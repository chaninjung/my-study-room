services:
  - type: web
    name: dnd-coding-test-runner
    runtime: docker
    rootDir: coding_test_server
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - key: RUNNER_MODE
        value: local
      - key: REQUIRE_AUTH
        value: "true"
      - key: SUPABASE_URL
        value: https://xzbjvamjllfpcsnigqch.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DND_ASSET_BUCKET
        value: dnd-private-assets
      - key: DND_ASSET_OBJECT
        value: dnd_hw1_assets.zip
      - key: ANSWER_USER_ID
        sync: false
      - key: DND_ASSET_ARCHIVE
        value: /etc/secrets/dnd_hw1_assets.zip
      - key: ALLOWED_ORIGINS
        value: https://chaninjung.github.io
