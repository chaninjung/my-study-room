<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<!-- 한글 UI 폰트: Pretendard(주), 실패하면 Noto Sans KR / 시스템 폰트로 자동 대체.
     Noto Sans KR 을 주 폰트로 쓰려면 아래 preload 한 줄을 Google Fonts 링크로 바꾸고
     theme.css 의 font-family 첫 항목을 "Noto Sans KR" 로 바꾸면 됩니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<meta name="description" content="Deep Network Development 2026 Autumn - Theory Test 1 practice test">
<title>My Study Room — 학습 허브</title>
<style>/* ==========================================================================
   theme.css — 공용 디자인 시스템 (문제 앱 / 용어집 / 인쇄 페이지 공통)
   폰트: Pretendard Variable (CDN, 비동기) → Noto Sans KR → 시스템 폰트
   원칙: 중립 그레이 + 단일 액센트(navy) · 8px 라운드 · 미세한 그림자 · 그라디언트 없음
   ========================================================================== */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --surface-3:#f2f4f7;
  --border:#e4e7ec;
  --border-2:#d0d5dd;
  --text:#101828;
  --text-2:#475467;
  --text-3:#667085;
  --text-4:#98a2b3;
  --primary:#1d3a8f;
  --primary-hover:#16306f;
  --primary-soft:#eef2fd;
  --primary-border:#c7d4f5;
  --link:#175cd3;
  --ok:#087443;      --ok-bg:#ecfdf3;   --ok-border:#a6e5c0;
  --warn:#b54708;    --warn-bg:#fffaeb; --warn-border:#f3d99b;
  --bad:#b42318;     --bad-bg:#fef3f2;  --bad-border:#f3bdb8;
  --purple:#5925dc;  --purple-bg:#f4f0ff; --purple-border:#cdbcf7;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 2px 4px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);
  --r-sm:6px; --r-md:8px; --r-lg:10px;
  --focus:0 0 0 3px rgba(29,58,143,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    "Noto Sans KR","Apple SD Gothic Neo","Segoe UI","Malgun Gothic",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{letter-spacing:-.02em;margin:0}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* 한글은 단어 중간에서 줄바꿈되지 않게 (긴 영문·코드는 필요할 때만 분리) */
.qText,.opt,.opt span,.expl,.prompt,.rBody,.sent,.card,.note,td,th{
  word-break:keep-all;overflow-wrap:anywhere}
/* 좁은 flex 행에서는 글자가 한 글자씩 쪼개지지 않도록 (min-content 를 단어 단위로 유지) */
.rowGrid,.rowGrid .name,.rowGrid .muted,.mockRow,.mockRow .name,.mockRow .meta,.mockRow .best,
.stat > div,.legend div,.ovRow,.sbItem,.sbCourseHead,.scoreChip{
  word-break:keep-all;overflow-wrap:normal;min-width:0}
/* 그리드/플렉스 자식이 강제로 넘치지 않도록 */
.panel,main,.side,.examWrap > *{min-width:0}
.mono,.timer,.scoreNum,.stat b,.legend b,.ovRow span,table.grid td{font-variant-numeric:tabular-nums}

/* ===================== 버튼 ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1;height:38px;padding:0 14px;
  border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--border-2);background:#fff;color:var(--text);
  box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s,box-shadow .15s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:#b9c0cc}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:0;box-shadow:var(--focus)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.wide{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

/* ===================== 상단 바 / 언어 토글 =====================
   상단 바는 '화면이 바뀌어도 위치가 변하지 않도록' 고정한다:
   - flex-wrap:nowrap  → 줄바꿈으로 내비게이션이 밀리지 않음
   - 오른쪽 항목(langBox/linkish)은 flex:0 0 auto 로 절대 줄어들지 않음
   - breadcrumb 만 줄어들고 말줄임(…) 처리됨                                   */
.topbar{background:#fff;border-bottom:1px solid var(--border);min-height:60px;display:flex;align-items:center;
  padding:10px 20px;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:nowrap;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text);
  min-width:0;flex:0 1 auto;overflow:hidden}
.crumbs .sep{color:var(--text-4);font-weight:400}
.crumbs .cur{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .grow{flex:1 1 auto}
.topbar .langBox,.topbar .linkish{flex:0 0 auto;white-space:nowrap}
.linkish{color:var(--text-2);font-size:13.5px;font-weight:600;cursor:pointer;background:none;border:0;
  padding:6px 2px;font-family:inherit;transition:color .15s}
.linkish:hover{color:var(--primary);text-decoration:none}
.langBox{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;
  background:#fff;box-shadow:var(--shadow-xs)}
.langBtn{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border:0;background:#fff;
  color:var(--text-3);cursor:pointer;transition:background .15s,color .15s}
.langBtn + .langBtn{border-left:1px solid var(--border)}
.langBtn:hover{background:var(--surface-2)}
.langBtn.on{background:var(--primary);color:#fff}

/* ===================== 레이아웃 / 패널 ===================== */
.wrap{max-width:1360px;margin:0 auto;padding:20px 20px 48px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panelHead{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;
  color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panelHead .grow{flex:1}
.panelBody{padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterRow{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--text-3);font-size:13px}

/* ===================== 배지 / 칩 ===================== */
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-2);margin-right:6px;white-space:nowrap;line-height:1.7}
.tag.num{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.tag.lec{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary)}
.tag.AC{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:99px;
  padding:6px 12px;font-size:13px;color:var(--text-2);background:#fff;cursor:pointer;
  transition:border-color .15s,background .15s}
.fchip:hover{border-color:var(--border-2);background:var(--surface-2)}
.fchip input{margin:0}

/* ===================== 표 ===================== */
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.grid th,table.grid td{border-bottom:1px solid var(--surface-3);padding:10px 14px;text-align:left;vertical-align:top}
table.grid th{color:var(--text-3);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--surface-2)}
table.grid tbody tr:hover{background:#fcfcfd}
table.grid tr:last-child td{border-bottom:0}

/* ===================== 비밀번호 게이트 (선택 기능) ===================== */
.gateWrap{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;
  justify-content:center;padding:20px}
.gateWrap[hidden]{display:none}
.gateCard{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);
  width:100%;max-width:400px;padding:26px 24px}
.gateBadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-border);
  border-radius:99px;padding:2px 9px;margin-bottom:12px}
.gateTitle{font-size:17px;font-weight:700;margin:0 0 8px}
.gateSub{font-size:13px;color:var(--text-3);line-height:1.65;margin:0 0 18px}
.gateErr{color:var(--bad);font-size:13px;margin:0 0 10px}
.gateInput{width:100%;height:42px;font-family:inherit;font-size:15px;padding:0 12px;color:var(--text);
  border:1px solid var(--border-2);border-radius:var(--r-sm);margin-bottom:12px;background:#fff}
.gateInput:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
.gateChk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);
  margin:0 0 16px;line-height:1.5;cursor:pointer}
.gateChk input{margin-top:2px}
.gateFoot{font-size:11.5px;color:var(--text-4);line-height:1.6;margin-top:14px}
body.gate-locked{overflow:hidden}

/* ===================== 기타 공통 ===================== */
.note{font-size:12.5px;color:var(--text-3);padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.stat{display:flex;gap:28px;flex-wrap:wrap}
.stat > div{font-size:12.5px;color:var(--text-3)}
.stat > div b{display:block;font-size:19px;color:var(--text);margin-top:2px}
.expl{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin-top:12px;font-size:13.5px;
  color:var(--text-2);white-space:pre-wrap}
.revealHint{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:12.5px;color:var(--text-3);white-space:normal}
.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary)}
/* 검색 입력 (문제은행 / 용어집 공용) */
.search{width:100%;max-width:380px;height:38px;font-family:inherit;font-size:14px;padding:0 12px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);background:#fff;color:var(--text);
  transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--text-4)}
.search:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
footer{color:var(--text-4);font-size:12px;text-align:center;padding:26px 0 8px}
</style>
<style>/* ==========================================================================
   shell.css — 앱 프레임 (왼쪽 사이드바: 학기 → 과목 → 섹션 + 본문)
   ========================================================================== */
.shell{display:flex;align-items:stretch;min-height:100vh}

/* ---------- 사이드바 ---------- */
.sidebar{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.sbBrand{padding:14px 14px;border-bottom:1px solid var(--border)}
.sbBrand a{display:block;font-size:14.5px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.sbBrand a:hover{text-decoration:none;color:var(--primary)}
.sbBrandSub{margin-top:3px;font-size:11.5px;color:var(--text-3);line-height:1.5}
.sbNav{flex:1;padding:8px 8px 16px}
.sbSem{margin-bottom:6px}
.sbSemHead{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;background:none;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;border-radius:var(--r-sm);text-align:left}
.sbSemHead:hover{background:var(--surface-2);color:var(--text-2)}
.sbSemHead .chev{width:0;height:0;flex:0 0 auto;border-left:4px solid currentColor;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
.sbSemHead.open .chev{transform:rotate(90deg) translateX(1px)}
.sbSemSub{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-4);letter-spacing:0;text-transform:none}
.sbCourse{margin:2px 0 10px}
.sbCourseHead{padding:6px 10px;font-size:13.5px;font-weight:700;color:var(--text)}
.sbCourseSub{padding:0 10px 8px;font-size:11.5px;color:var(--text-4);line-height:1.5}
.sbItems{display:flex;flex-direction:column;gap:1px}
.sbItem{display:block;width:100%;text-align:left;padding:7px 8px 7px 14px;border:0;border-left:2px solid transparent;
  background:none;font-family:inherit;font-size:13px;color:var(--text-2);cursor:pointer;border-radius:0 var(--r-sm) var(--r-sm) 0;
  transition:background .15s,color .15s,border-color .15s}
.sbItem:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.sbItem.on{background:var(--primary-soft);color:var(--primary);font-weight:700;border-left-color:var(--primary)}
.sbSoon{padding:8px 12px 12px;font-size:12px;color:var(--text-4);line-height:1.6;
  border-left:2px dashed var(--border-2);margin-left:10px}
.sbFoot{padding:12px 14px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.sbFootTitle{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.sbProgress{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-3)}
.sbProgress div{display:flex}
.sbProgress b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
.sbBackdrop{display:none}

/* ---------- 본문 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- 메뉴(햄버거) 버튼 ---------- */
.sbToggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);background:#fff;cursor:pointer;box-shadow:var(--shadow-xs)}
.sbToggle:hover{background:var(--surface-2)}
.burger{position:relative;display:block;width:16px;height:2px;background:var(--text-2);border-radius:1px}
.burger::before,.burger::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--text-2);border-radius:1px}
.burger::before{top:-5px}
.burger::after{top:5px}

/* ---------- 응시/결과 화면에서는 사이드바 숨김 (집중 모드) ---------- */
body.view-quiz .sidebar,body.view-result .sidebar{display:none}
body.view-quiz .sbToggle,body.view-result .sbToggle{display:none!important}

/* ---------- 태블릿 이하: 사이드바를 드로어로 ---------- */
@media (max-width:1024px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100%;width:264px;flex-basis:264px;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
  body.sb-open .sidebar{transform:translateX(0)}
  .sbBackdrop{display:block;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:35;
    opacity:0;pointer-events:none;transition:opacity .22s}
  body.sb-open .sbBackdrop{opacity:1;pointer-events:auto}
  .sbToggle{display:inline-flex}
  .sbFoot{display:none}
}
@media (max-width:560px){
  .sidebar{width:86vw;flex-basis:86vw}
  .sbBrand{padding:14px 14px}
  .sbNav{padding:8px 8px 16px}
}
</style>
<style>/* ==========================================================================
   exam.css — 문제 앱 전용 레이아웃 (시험 포털: 팔레트 / 문제 / 타이머·Overview)
   ========================================================================== */
.examWrap{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:18px;align-items:start}

/* ---------- 좌측: 섹션 / 팔레트 ---------- */
.side{position:sticky;top:78px}
.secTitle{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:600;
  color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface-2)}
.secTitle b{margin-left:auto;font-weight:700;color:var(--text);font-size:13px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px}
.pbtn{height:36px;border:1px solid var(--border);background:#fff;border-radius:var(--r-sm);
  font-family:inherit;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;padding:0;
  transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
.pbtn:hover{border-color:var(--border-2);background:var(--surface-2)}
.pbtn.answered{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.pbtn.marked{background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple)}
.pbtn.notans{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad)}
.pbtn.cur{border-color:var(--primary);color:var(--primary);box-shadow:var(--focus)}
.legend{padding:12px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3)}
.legend div{display:flex;align-items:center;gap:8px;margin:6px 0}
.legend b{margin-left:auto;font-weight:700;color:var(--text)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 10px}
.dot.answered{background:#12b76a}
.dot.notans{background:#f04438}
.dot.marked{background:#7a5af8}
.dot.book{background:#f79009}
.dot.notvisited{background:#d0d5dd}

/* ---------- 중앙: 문제 ---------- */
.qHead{display:flex;align-items:center;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.qHead .qNum{font-weight:700;font-size:15px}
.qHead .grow{flex:1}
.qText{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:18px 20px;margin:14px 20px 20px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.opts{padding:0 20px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 16px;margin:0 0 10px;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--border-2);background:var(--surface-2)}
.opt .key{flex:0 0 26px;font-weight:700;color:var(--text-3)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt.sel .key{color:var(--primary)}
.opt.correct{border-color:var(--ok-border);background:var(--ok-bg);box-shadow:inset 0 0 0 1px #12b76a}
.opt.correct .key{color:var(--ok)}
.opt.wrong{border-color:var(--bad-border);background:var(--bad-bg);box-shadow:inset 0 0 0 1px #f04438}
.opt.wrong .key{color:var(--bad)}
.opt.missed{border-color:var(--warn-border);background:var(--warn-bg);box-shadow:inset 0 0 0 1px #f79009}
.opt.missed .key{color:var(--warn)}
/* 해설을 보는 중에도 '내가 고른 보기'를 알 수 있게 표시 */
.opt .mineTag{margin-left:auto;flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:700;
  color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.actionBar{display:flex;align-items:center;gap:10px;padding:8px 20px 20px;flex-wrap:wrap}
.actionBar .grow{flex:1}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-2);cursor:pointer}

/* ---------- 우측: 타이머 / Overview ---------- */
.timerBox{border-bottom:1px solid var(--border);padding:18px 12px 12px;text-align:center;
  background:var(--surface-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
.timer{font-size:34px;font-weight:700;color:var(--primary);letter-spacing:1px;line-height:1.1}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--bad)}
.timer.free{color:var(--text-2)}          /* 연습 모드: 시간 제한 없음 (경과 시간) */
.timerLabels.free{letter-spacing:0;text-transform:none;color:var(--text-3);font-size:11.5px}
.timerLabels{display:flex;justify-content:center;gap:28px;font-size:11px;color:var(--text-4);
  margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.sideBtns{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.ov{padding:14px 16px 6px}
.ovTitle{font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ovRow{display:flex;font-size:13px;padding:6px 0;border-bottom:1px solid var(--surface-3);color:var(--text-2)}
.ovRow:last-child{border-bottom:0}
.ovRow span{margin-left:auto;font-weight:700;color:var(--text)}
.sideSubmit{padding:12px}

/* ---------- 진행바 ---------- */
.bar{height:6px;background:#eaecf0;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .3s ease}

/* ---------- 홈 / 새 뷰 공통 ---------- */
.pageTitle{font-size:20px;font-weight:700;margin:0 0 6px}

/* 모의고사 세트 행: 좁은 칸에서도 읽기 좋게 2줄 배치
   1행: [실전] 모의고사 1 .......... 미응시 [시작]
   2행: 15문항 · 45분 · 통과 7점                                    */
.mockRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 10px;
  align-items:center;padding:12px 16px;border-bottom:1px solid var(--surface-3);transition:background .15s}
.mockRow:hover{background:var(--surface-2)}
.mockRow:last-child{border-bottom:0}
.mockRow .tag{margin-right:0;white-space:nowrap}
.mockRow .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mockRow .best{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.mockRow .meta{grid-column:1 / -1;font-size:12.5px;color:var(--text-3);line-height:1.5}
.mockRow .btn{white-space:nowrap}
/* 최종 모의고사: 눈에 띄게 강조 (시험 전 마지막 점검용) */
.mockRow.final{background:var(--primary-soft);border-left:4px solid var(--primary)}
.mockRow.final:hover{background:var(--surface-2)}
.mockRow.final .name{font-weight:700;color:var(--primary)}
.mockRow .tag.finalTag{background:var(--primary);color:#fff;border-color:var(--primary)}
.finalPanel{border:2px solid var(--primary);border-radius:var(--r-lg);overflow:hidden}
.finalPanel .panelHead{background:var(--primary-soft);color:var(--primary);font-weight:700}
.finalPanel .panelNote{padding:10px 16px 0;font-size:12.5px;color:var(--text-3);line-height:1.6}

.scoreGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scoreChip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 10px;font-size:12.5px;color:var(--text-3);background:#fff}
.scoreChip b{margin-left:auto;font-size:14px;color:var(--text-4);font-variant-numeric:tabular-nums}
.scoreChip.done{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary)}
.scoreChip.done b{color:var(--primary)}
.homeHead{padding:20px 20px 8px}
.homeHead h1{font-size:20px;font-weight:700;margin:0 0 6px}
.rowGrid{display:flex;align-items:center;gap:10px 12px;padding:12px 16px;
  border-bottom:1px solid var(--surface-3);transition:background .15s;flex-wrap:wrap}
.rowGrid:hover{background:var(--surface-2)}
.rowGrid:last-child{border-bottom:0}
.rowGrid .grow{flex:1}
.rowGrid .name{font-weight:600;flex:0 1 auto}
.rowGrid .muted{flex:1 1 auto;min-width:0}
.rowGrid .btn{flex:0 0 auto}

/* ---------- 결과 ---------- */
.resTop{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px}
.scoreNum{font-size:40px;font-weight:700;letter-spacing:-.02em}
.scoreNum.pass{color:var(--ok)}
.scoreNum.fail{color:var(--bad)}
.qres{border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;margin:0 0 14px;box-shadow:var(--shadow-xs)}
.qres .rHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2);font-size:13px;color:var(--text-3);flex-wrap:wrap;
  border-radius:var(--r-lg) var(--r-lg) 0 0}
.qres .rHead .grow{flex:1}
.qres .rBody{padding:16px}
.s10{color:var(--ok);font-weight:700}
.s05{color:var(--warn);font-weight:700}
.s00{color:var(--bad);font-weight:700}
.prompt{white-space:pre-wrap;font-size:15px;line-height:1.7}

/* ==========================================================================
   반응형 — 데스크톱 / 노트북 / 태블릿 / 폰(세로·가로)
   · 홈 화면은 .homeWrap (인라인 스타일 제거 → 미디어 쿼리가 실제로 적용됨)
   · 860px 이하: 상단·하단 고정 바 + 목록 접힘 (앱 같은 모바일 레이아웃)
   ========================================================================== */

/* 데스크톱: 홈 화면 2열 (기존 인라인 grid-template-columns 를 대체) */
.homeWrap{grid-template-columns:minmax(0,1fr) 340px}

/* 모바일 전용 바: 데스크톱에서는 완전히 숨김 */
.mbar,.mfoot{display:none}

/* ---------- 노트북 (3열 유지, 폭만 축소) ---------- */
@media (max-width:1280px){
  .examWrap{grid-template-columns:220px minmax(0,1fr) 280px;gap:14px}
  .homeWrap{grid-template-columns:minmax(0,1fr) 300px;gap:14px}
}
@media (max-width:1120px){
  .homeWrap{grid-template-columns:minmax(0,1fr)}
}

/* ---------- 좁은 노트북: 목록을 위쪽 가로줄로 ---------- */
@media (max-width:1040px){
  .examWrap{grid-template-columns:minmax(0,1fr) 260px;gap:14px}
  .side.left{grid-column:1 / -1;position:static}
  .palette{grid-template-columns:repeat(10,1fr)}
  .side{top:70px}
  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px}
}

/* ---------- 태블릿 / 폰 ---------- */
@media (max-width:860px){
  .wrap{padding:14px 14px 40px}
  body.view-quiz .wrap{padding:70px 14px 86px}   /* 상·하단 고정 바가 가리지 않도록 */
  .topbar{position:static;box-shadow:none}
  .examWrap,.homeWrap{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static}

  /* 상단 고정 바: 진행 / 타이머 / 문항 목록 */
  .mbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:30;
    background:#fff;border-bottom:1px solid var(--border);padding:8px 14px;
    box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .mbar .mprog{font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap}
  .mbar .mtimer{margin-left:auto;font-size:20px;letter-spacing:0}
  .mbar .mfree{font-size:11px;font-weight:600;color:var(--text-3);border:1px solid var(--border);
    border-radius:99px;padding:1px 7px;white-space:nowrap}

  /* 하단 고정 바: 이전 / 다음·제출 */
  .mfoot{display:flex;align-items:center;gap:8px;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:#fff;border-top:1px solid var(--border);padding:8px 14px;
    box-shadow:0 -2px 10px rgba(16,24,40,.06)}
  .mfoot .grow{flex:1}
  .mfoot #mNextBtn{min-width:140px}

  /* 순서: 문제 → (목록) → 안내/개요 */
  main.panel{order:1}
  .side.left{order:2}
  .side.right{order:3}

  /* 문항 목록은 기본 접힘, '문항 목록' 버튼으로 펼침 */
  .side.left{display:none}
  body.palette-open .side.left{display:block}
  .palette{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .pbtn{height:44px;font-size:13.5px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}

  /* 우측 패널: 상·하단 바로 대체되는 요소는 숨김 */
  .side.right .timerBox,.side.right .sideSubmit{display:none}
  .sideBtns{grid-template-columns:1fr 1fr}
  /* 이전/다음은 하단 고정 바에 있으므로 액션바에서는 숨겨 중복 제거 */
  .actionBar #prevBtn,.actionBar #nextBtn{display:none}
  .actionBar .chk{flex:1 1 auto}

  .qText{padding:15px 16px;margin:12px 16px 16px;font-size:14.5px}
  .opts{padding:0 16px}
  .opt{padding:13px 14px;gap:10px}
  .qHead{padding:14px 16px 0}
  .actionBar{padding:6px 16px 16px}
  .actionBar .btn{flex:1 1 auto}
  .resTop{gap:16px;padding:16px}
  .scoreNum{font-size:32px}
  .homeHead{padding:16px 16px 6px}
  .homeHead h1{font-size:17px}
  .rowGrid{flex-wrap:wrap;gap:8px;padding:12px 14px}
  .rowGrid .muted{flex-basis:100%}
  .filterRow{padding:12px 14px}
}

/* ---------- 폰 (세로) ---------- */
@media (max-width:560px){
  .wrap{padding:12px 10px 36px}
  body.view-quiz .wrap{padding:64px 10px 80px}
  .appName,.crumbs .sep{display:none}
  /* 상단 바는 어떤 화면에서도 같은 항목·같은 위치를 유지한다 (폰에서는 용어집/인쇄는 ☰ 메뉴에서) */
  .topbar{padding:8px 12px;gap:8px;min-height:0;flex-wrap:nowrap;overflow:hidden}
  .topbar .navGloss,.topbar .navPaper{display:none}
  .crumbs{font-size:13.5px}
  .crumbs .cur{max-width:38vw}
  .linkish{font-size:12.5px}
  .langBtn{padding:5px 9px;font-size:12px}
  .panelHead{padding:10px 12px;font-size:13px}
  .panelBody{padding:12px}
  .mbar{padding:7px 12px;gap:8px}
  .mbar .mtimer{font-size:18px}
  .mbar .mprog{font-size:12.5px}
  .mfoot{padding:7px 10px}
  .mfoot .btn{flex:0 0 auto}
  .mfoot #mNextBtn{min-width:0;flex:1}
  .qText{margin:10px 12px 14px;padding:14px;font-size:14px}
  .opts{padding:0 12px}
  .qHead{padding:12px 12px 0}
  .actionBar{padding:6px 12px 14px}
  .actionBar .chk{flex:1 1 45%}
  .actionBar .btn{flex:1 1 100%}
  .palette{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px;padding:10px}
  .pbtn{height:42px}
  .sideBtns{grid-template-columns:1fr}
  .stat{gap:16px}
  .resTop{gap:12px;padding:14px}
  .scoreNum{font-size:28px}
  .qres .rHead{padding:10px 12px}
  .qres .rBody{padding:12px}
  .prompt{font-size:14px}
  .legend{grid-template-columns:1fr}
  table.grid th,table.grid td{padding:8px 10px}
  .timerLabels{display:none}
}

/* ---------- 가로가 짧은 화면(폰 가로) ---------- */
@media (max-height:560px) and (orientation:landscape){
  .wrap{padding:12px 14px 32px}
  body.view-quiz .wrap{padding:60px 14px 72px}
  .qText{margin:8px 14px 10px;padding:12px}
  .opt{padding:10px 12px;margin-bottom:8px}
  .mbar,.mfoot{padding:6px 12px}
  .palette{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
}

@media print{
  body{background:#fff}
  .topbar,.side,.btn,.actionBar,.bar,.timerBox,.mbar,.mfoot{display:none!important}
  .examWrap{grid-template-columns:1fr}
  .panel{box-shadow:none;border-color:#c8ccd4}
}

   - LANG: "ko" | "en" (localStorage 에 저장)
   - t(key): 현재 언어의 문자열
   - tf(key, ...args): %s 자리를 채운 문자열
   - questionField(q, "prompt"): q.prompt_ko / q.prompt_en 선택
*/
var LANGS = ["ko", "en"];
var LANG = (function () {
  try {
    if (typeof localStorage !== "undefined") {
      var v = localStorage.getItem("dnd_tt1_lang");
      if (LANGS.indexOf(v) !== -1) return v;
    }
  } catch (e) { /* ignore */ }
  return "ko";
})();

function setLang(v) {
  if (LANGS.indexOf(v) === -1) return;

function t(key) {
  var e = I18N[key];
  if (!e) return key;

function tf(key) {
  var s = t(key);
  var args = Array.prototype.slice.call(arguments, 1);
  var i = 0;
  return s.replace(/%s/g, function () {
    var v = args[i++];
    return v === undefined || v === null ? "" : String(v);
  });
}

function questionField(q, field) {

  if (v === undefined || v === null) return q[field];

}

function applyStaticI18n() {
  if (typeof document === "undefined") return;
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute("data-i18n");
    nodes[i].textContent = t(key);
  }
  var btns = document.querySelectorAll("[data-lang]");
  for (var j = 0; j < btns.length; j++) {

    btns[j].className = "langBtn" + (on ? " on" : "");

<script id="core-logic">
/* ===== core.js — DOM 비의존 순수 로직 (node로 단위 테스트 가능) ===== */
const LETTERS = "ABCDEFGH";

function letterAt(i) { return LETTERS[i]; }

/* 채점: 정답 완전 일치 1.0 / 실수 1개 0.5 / 실수 2개 이상 0.0
   실수 = (참인데 선택 안 함) 1개 + (거짓인데 선택함) 1개 */
function gradeAnswer(q, selected) {
  const sel = new Set(selected || []);
  let missed = 0, extra = 0;
  q.correct.forEach(function (c) { if (!sel.has(c)) missed++; });
  sel.forEach(function (s) { if (q.correct.indexOf(s) === -1) extra++; });
  const mistakes = missed + extra;
  let score = 0.0;
  if (mistakes === 0) score = 1.0;
  else if (mistakes === 1) score = 0.5;
  return { score: score, mistakes: mistakes, missed: missed, extra: extra };
}

/* 세션 채점 */
function gradeSession(questions, answers) {
  let total = 0;
  const results = questions.map(function (q, i) {
    const sel = answers[q.sid] || [];
    const g = gradeAnswer(q, sel);
    total += g.score;
    return { index: i, q: q, selected: sel, score: g.score, mistakes: g.mistakes, missed: g.missed, extra: g.extra };
  });
  return { results: results, total: Math.round(total * 100) / 100, max: questions.length };
}

/* Fisher-Yates */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 보기 순서 섞기 (+ 정답 문자 재매핑)
   이중 언어 문항은 options_ko / options_en 을 같은 순서로 함께 섞는다. */
function shuffleOptions(q) {
  const base = q.options || q.options_ko || [];
  const n = base.length;
  const order = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
  const map = {};
  order.forEach(function (oldIdx, newIdx) { map[letterAt(oldIdx)] = letterAt(newIdx); });
  const copy = JSON.parse(JSON.stringify(q));
  copy.correct = q.correct.map(function (c) { return map[c]; }).sort();
  copy.options = order.map(function (i) { return (q.options || q.options_ko)[i]; });
  if (q.options_ko) copy.options_ko = order.map(function (i) { return q.options_ko[i]; });
  if (q.options_en) copy.options_en = order.map(function (i) { return q.options_en[i]; });
  return copy;
}

/* 세션 생성: sid 부여, (선택) 보기 셔플, (선택) 문제 셔플 */
function buildSession(questions, opts) {
  opts = opts || {};
  let list = questions.slice();
  if (opts.shuffleQuestions) list = shuffle(list);
  let out = list.map(function (q, i) {
    const copy = opts.shuffleOptions ? shuffleOptions(q) : JSON.parse(JSON.stringify(q));
    copy.sid = "s" + i + "_" + q.id;
    return copy;
  });
  return out;
}

/* 실전 모드: 이론 nA개 + NumPy nB개 무작위 추출 */
function pickExamSet(all, nTotal, nNumpy) {
  const num = shuffle(all.filter(function (q) { return q.part === "B"; }));
  const the = shuffle(all.filter(function (q) { return q.part !== "B"; }));
  const picked = num.slice(0, nNumpy).concat(the.slice(0, Math.max(0, nTotal - nNumpy)));
  if (picked.length < nTotal) {
    const rest = shuffle(all.filter(function (q) { return picked.indexOf(q) === -1; }));
    picked.push.apply(picked, rest.slice(0, nTotal - picked.length));
  }
  return shuffle(picked);
}

/* 통과 기준: 실전 모드는 meta.exam_pass, 연습 모드는 60% */
function passLine(total, meta, isExam) {
  if (isExam) return meta.exam_pass;
  return Math.ceil(total * 0.6 * 10) / 10;
}

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

/* 시험 포털용 시계 표기: 00 : 44 : 59 */
function formatClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return p(h) + " : " + p(m) + " : " + p(s);
}

function scoreClass(score) {
  if (score >= 1.0) return "s10";
  if (score >= 0.5) return "s05";
  return "s00";
}

    el("seeAll").onclick = function () { go("records"); };
    el("mocksAll").onclick = function () { go("mocks"); };
    wireMockButtons();
  }

  /* ---------- 뷰: 🎲 랜덤 문항 (1~100 직접 입력) ---------- */
  const RAND_MIN = 1, RAND_MAX = 100, RAND_DEFAULT = 10;
  const RAND_PRESETS = [1, 5, 10, 20, 50, 100];
  function randPool(scope) {
    if (scope === "theory") return ALL.filter(function (q) { return q.part !== "B"; });
    if (scope === "numpy") return ALL.filter(function (q) { return q.part === "B"; });
    return ALL.slice();
  }
  function randScope() {
    const e = el("randScope");
    if (e && e.value) return e.value;
    /* 결과 화면의 '다시 뽑기' 등: 직전 랜덤 세션의 범위를 그대로 쓴다 */
    if (S && S.cfg && S.cfg.mode === "random" && S.cfg.scope) return S.cfg.scope;
    return "all";
  }
  /* 사용자가 입력한 문항 수. 랜덤 뷰가 아니거나 입력칸이 없으면(개요/결과 화면)
     직전 값 → 저장값 → 기본값 순으로 쓴다.
     { want: 숫자|null, strict: 입력칸이 있었는지 } */
  function randRequest() {
    const e = el("randCount");
    if (VIEW !== "random" || !e) {
      if (S && S.cfg && S.cfg.mode === "random" && S.cfg.want) return { want: S.cfg.want, strict: false };
      return { want: store.randCount || RAND_DEFAULT, strict: false };
    }
    const raw = String(e.value === undefined || e.value === null ? "" : e.value).trim();
    if (!/^\d+$/.test(raw)) return { want: null, strict: true };
    return { want: parseInt(raw, 10), strict: true };
  }
  /* 지금 설정으로 실제 출제될 문항 수 (범위 크기로 잘라낸다) */
  function randPlan() {
    const req = randRequest();
    const scope = randScope();
    const pool = randPool(scope);
    const want = Math.min(req.want === null ? RAND_DEFAULT : req.want, RAND_MAX);
    return { scope: scope, pool: pool, want: want, n: Math.min(want, pool.length) };
  }
  function randMinutes(n) { return Math.max(5, n * 3); }   /* 시험과 같은 문항당 3분 */
  function updateRandMeta() {
    const box = el("randMeta");
    if (!box) return;
    const p = randPlan();
    box.textContent = tf("rand.meta", p.pool.length, p.n, randMinutes(p.n));
  }
  function startRandom() {
    const req = randRequest();
    if (req.strict && (req.want === null || req.want < RAND_MIN || req.want > RAND_MAX)) {
      alert(t("rand.alertCount"));
      return;
    }
    const p = randPlan();
    if (p.n < 1) { alert(t("alert.noMock")); return; }
    store.randCount = p.want;                     /* 다음에 '바로 시작'할 때 재사용 */
    saveStore();
    const picked = shuffle(p.pool).slice(0, p.n);
    /* 화면에 시간 제한 체크박스가 없으면(결과 화면의 '다시 뽑기') 직전 설정을 유지 */
    const timed = el("optTimed") ? timedChoice() : !!(S && S.cfg && S.cfg.timed);
    newSession(picked, {
      mode: "random", scope: p.scope, want: p.want,
      detailKey: "rand.nLabel", detailArg: p.n,
      label: modeLabel("mode.random", timed) + " · " + tf("rand.scope." + p.scope, p.pool.length) +
             " · " + tf("rand.nLabel", p.n),
      minutes: timed ? randMinutes(p.n) : 0, timed: timed,
      shuffleQuestions: true,
      shuffleOptions: el("optShufO") ? el("optShufO").checked : true
    });
    renderQuiz();
  }
  function renderRandom() {
    const theoryN = ALL.filter(function (q) { return q.part !== "B"; }).length;
    const numpyN = ALL.filter(function (q) { return q.part === "B"; }).length;
    const last = store.randCount || RAND_DEFAULT;
    const best = store.randBest || 0;
    const hist = store.history.filter(function (h) { return h.mk === "random" || h.mk === "random10"; })
      .slice(-8).reverse();
    const rows = hist.length
      ? hist.map(function (h) {
          const passed = h.total >= h.pass;
          return "<tr><td>" + esc(h.date) + "</td><td>" + h.total + " / " + h.max + '</td><td class="' +
            (passed ? "pass" : "fail") + '">' + (passed ? "PASS" : "FAIL") + "</td></tr>";
        }).join("")
      : '<tr><td colspan="3" class="muted">' + t("rand.none") + "</td></tr>";
    const presets = RAND_PRESETS.map(function (v) {
      return '<button class="btn sm" type="button" id="randP' + v + '">' + v + "</button>";
    }).join("");

    app.innerHTML =
      panel(t("rand.title"),
        '<div class="panelBody">' +
        '<div class="muted">' + t("rand.sub") + "</div>" +
        '<div class="row" style="margin-top:14px">' +
        '<span class="name">' + t("rand.count") + "</span>" +
        '<input id="randCount" class="search" type="number" min="' + RAND_MIN + '" max="' + RAND_MAX +
        '" step="1" value="' + last + '" style="max-width:110px">' +
        '<button class="btn primary" id="randStart">' + t("rand.start") + "</button>" +
        '<span class="grow"></span>' +
        '<label class="chk"><input type="checkbox" id="optTimed"> ' + t("opt.timed") + "</label>" +
        '<label class="chk"><input type="checkbox" id="optShufO" checked> ' + t("home.shufO") + "</label>" +
        "</div>" +
        '<div class="row" style="margin-top:10px">' +
        '<span class="muted">' + t("rand.preset") + "</span>" + presets +
        '<span class="grow"></span>' +
        '<span class="name">' + t("rand.scope") + "</span>" +
        '<select id="randScope" class="search" style="max-width:190px">' +
        '<option value="all">' + tf("rand.scope.all", ALL.length) + "</option>" +
        '<option value="theory">' + tf("rand.scope.theory", theoryN) + "</option>" +
        '<option value="numpy">' + tf("rand.scope.numpy", numpyN) + "</option>" +
        "</select>" +
        "</div>" +
        '<div class="muted" id="randMeta" style="margin-top:8px"></div>' +
        '<div class="muted" style="margin-top:4px">' + t("rand.hint") + "</div></div>",
        ' style="margin-bottom:16px"') +
      panel(t("rand.recent") + '<span class="grow"></span><span class="muted">' +
        t("rand.bestLabel") + " " + (best ? best + t("rand.pts") : t("home.mock.none")) + "</span>",
        '<table class="grid"><tr><th>' + t("home.th.date") + "</th><th>" + t("home.th.score") +
        "</th><th>" + t("home.th.result") + "</th></tr>" + rows + "</table>",
        ' style="margin-bottom:16px"') +
      '<div class="note"><button class="linkish" id="goMocks">' + t("mocks.titleShort") + " →</button> " +
      '<button class="linkish" id="goBank">' + t("bank.title") + " →</button> " +
      '<button class="linkish" id="goWrong">' + t("wrong.title") + " →</button></div>";

    el("randStart").onclick = function () { startRandom(); };
    el("randCount").oninput = function () { updateRandMeta(); };
    el("randScope").onchange = function () { updateRandMeta(); };
    el("optTimed").onchange = function () { updateRandMeta(); };
    RAND_PRESETS.forEach(function (v) {
      el("randP" + v).onclick = function () { el("randCount").value = String(v); updateRandMeta(); };
    });
    el("goMocks").onclick = function () { go("mocks"); };
    el("goBank").onclick = function () { go("bank"); };
    el("goWrong").onclick = function () { go("wrong"); };
    updateRandMeta();
  }

  /* ---------- 뷰 2: 모의고사 ---------- */
  function renderMocks() {
    if (!MOCKS) {
      app.innerHTML = panel(t("mocks.title"), '<div class="panelBody muted">' + t("home.mock.empty") + "</div>");

  /* ---------- 뷰 3: 문제은행 ---------- */

      return "<tr><td><span class='tag " + (k === "NumPy" ? "num" : "lec") + "'>" + esc(k) + "</span></td>" +
        "<td>" + lec[k] + "</td><td><button class='btn sm' data-lecstart='" + esc(k) + "'>" +

    }).join("");
    const rows = ALL.map(function (q, i) {
      return '<tr data-idx="' + i + '" data-lec="' + esc(q.lecture) + '" data-text="' +
        esc((q.id + " " + qf(q, "topic") + " " + qf(q, "prompt")).toLowerCase()) + '">' +
        "<td>" + (i + 1) + "</td><td class='mono'>" + esc(q.id) + "</td>" +
        "<td><span class='tag " + (q.part === "B" ? "num" : "lec") + "'>" + esc(q.lecture) + "</span></td>" +

    app.innerHTML =
      panel(t("bank.title") + '<span class="grow"></span><span class="muted" id="bankCount">' +
        tf("foundCount", ALL.length) + "</span>",

        '<div class="row" style="margin-top:12px">' +
        '<button class="btn sm primary" id="mSel">' + t("home.startRange") + "</button>" +
        '<button class="btn sm" id="selAll">' + t("home.selAll") + "</button>" +
        '<button class="btn sm" id="selNone">' + t("home.selNone") + "</button>" +
        '<span class="grow"></span>' +
        '<label class="chk"><input type="checkbox" id="optTimed"> ' + t("opt.timed") + "</label>" +
        '<label class="chk"><input type="checkbox" id="optShufQ"> ' + t("home.shufQ") + "</label>" +
        '<label class="chk"><input type="checkbox" id="optShufO" checked> ' + t("home.shufO") + "</label>" +
        "</div>" +
        '<div class="muted" style="margin-top:8px">' + t("bank.rangeHint") + " " + t("opt.timedHint") + "</div></div>",
        ' style="margin-bottom:16px"') +
      panel(t("bank.perLecture"),
        '<table class="grid"><tr><th>' + t("th.lecture") + "</th><th>" + t("th.count") + "</th><th></th></tr>" +
        lecRows + "</table>", ' style="margin-bottom:16px"') +
      panel(t("bank.list"), '<table class="grid"><tr><th>#</th><th>ID</th><th>' + t("th.lecture") +
        "</th><th>" + t("th.topic") + "</th><th>" + t("bank.answer") + "</th><th></th></tr>" + rows + "</table>");

    el("bankQ").oninput = function () { filterBank(); };
    document.querySelectorAll("#lecChips .lecfilter").forEach(function (c) {
      c.onchange = function () { filterBank(); };

      b.onclick = function () { startOne(b.getAttribute("data-one")); };
    });
    document.querySelectorAll("[data-lecstart]").forEach(function (b) {
      b.onclick = function () { startRange([b.getAttribute("data-lecstart")]); };
    });
    el("selAll").onclick = function () {
      document.querySelectorAll(".lecfilter").forEach(function (c) { c.checked = true; });
      filterBank();
    };
    el("selNone").onclick = function () {
      document.querySelectorAll(".lecfilter").forEach(function (c) { c.checked = false; });
      filterBank();
    };
    el("mSel").onclick = function () {
      startRange(Array.prototype.slice.call(document.querySelectorAll(".lecfilter:checked"))
        .map(function (c) { return c.value; }));

  /* 문제은행 표 필터 (검색어 + 강의 칩) */
  function filterBank() {
    const q = (el("bankQ") ? el("bankQ").value : "").trim().toLowerCase();
    const sel = Array.prototype.slice.call(document.querySelectorAll(".lecfilter:checked"))
      .map(function (c) { return c.value; });
    let shown = 0;
    document.querySelectorAll("tr[data-idx]").forEach(function (tr) {
      const okLec = sel.indexOf(tr.getAttribute("data-lec")) !== -1;
      const okTxt = !q || tr.getAttribute("data-text").indexOf(q) !== -1;
      const show = okLec && okTxt;
      tr.hidden = !show;
      if (show) shown++;
    });
    const c = el("bankCount");
    if (c) c.textContent = tf("foundCount", shown);
  }

  function startRange(lectures) {
    const pool = ALL.filter(function (q) { return lectures.indexOf(q.lecture) !== -1; });
    if (pool.length < 3) { alert(t("alert.minLecture")); return; }
    const timed = timedChoice();
    newSession(pool, {
      mode: "range", detail: lectures.join(", "),
      label: modeLabel("mode.range", timed) + " · " + lectures.join(", "),
      minutes: timed ? Math.max(10, Math.round(pool.length * 1.2)) : 0,
      timed: timed,
      shuffleQuestions: el("optShufQ") ? el("optShufQ").checked : false,
      shuffleOptions: el("optShufO") ? el("optShufO").checked : true
    });
    renderQuiz();
  }

  /* ---------- 뷰 4: 오답 복습 ---------- */

    if (!list.length) {

        "<td><span class='tag " + (q.part === "B" ? "num" : "lec") + "'>" + esc(q.lecture) + "</span></td>" +
        "<td>" + esc(qf(q, "topic")) + "</td>" +
        "<td class='mono'>" + q.correct.join(", ") + "</td>" +
        "<td>" + (store.wrong[q.id] || 0) + "</td>" +
        '<td><button class="btn sm" data-one="' + q.id + '">' + t("bank.practice") + "</button></td></tr>";
    }).join("");
    app.innerHTML = panel(t("wrong.title") + '<span class="grow"></span><span class="muted">' +
      tf("foundCount", list.length) + "</span>",
      '<div class="panelBody row">' +
      '<button class="btn primary" id="wStart">' + t("wrong.start") + "</button>" +
      '<button class="btn" id="wClear">' + t("wrong.clear") + "</button></div>" +
      '<table class="grid"><tr><th>ID</th><th>' + t("th.lecture") + "</th><th>" + t("th.topic") +
      "</th><th>" + t("bank.answer") + "</th><th>" + t("wrong.count") + "</th><th></th></tr>" + rows + "</table>");
    el("wStart").onclick = function () {
      /* 오답 복습은 연습이므로 시간 제한 없음 */
      newSession(list, {
        mode: "wrong", label: modeLabel("mode.wrong", false), minutes: 0, timed: false,
        shuffleQuestions: false, shuffleOptions: true
      });
      renderQuiz();
    };
    el("wClear").onclick = function () {
      if (!confirm(t("alert.confirmWrongClear"))) return;
      store.wrong = {};
      saveStore();
      go("wrong");
    };

      b.onclick = function () { startOne(b.getAttribute("data-one")); };
    });

  /* ---------- 뷰 5: 학습 기록 ---------- */
  function renderRecords() {
    const hist = store.history;
    const total = hist.reduce(function (a, h) { return a + h.total; }, 0);
    const avg = hist.length ? Math.round((total / hist.length) * 10) / 10 : 0;
    const best = store.mockBest || {};
    const chips = (MOCKS ? MOCKS.mocks : []).map(function (m) {
      const b = best[m.id];
      return '<span class="scoreChip' + (b !== undefined ? " done" : "") + '">' +
        esc(mockLabel(m)) + "<b>" + (b !== undefined ? b : "-") + "</b></span>";
    }).join("");
    app.innerHTML =
      panel(t("rec.title") + '<span class="grow"></span><span class="muted">' +
        tf("foundCount", hist.length) + "</span>",
        '<div class="panelBody"><div class="stat">' +
        statCard("rec.attempts", hist.length) +
        statCard("rec.average", avg) +
        statCard("ov.best", store.best || 0) +
        statCard("rec.mockCount", Object.keys(best).length + " / " + (MOCKS ? MOCKS.mocks.length : 0)) +
        "</div></div>", ' style="margin-bottom:16px"') +
      panel(t("rec.summary"), '<div class="panelBody"><div class="scoreGrid">' + chips + "</div></div>",
        ' style="margin-bottom:16px"') +
      panel(t("home.records"),
        histTableHtml(50) +
        '<div class="note"><button class="btn sm" id="reset">' + t("home.reset") + "</button></div>");
    el("reset").onclick = function () {
      if (!confirm(t("alert.confirmReset"))) return;
      store = { history: [], wrong: {}, best: 0, mockBest: {} };
      saveStore();
      go("records");
    };
  }

  function startMock(mockId) {
    if (!MOCKS || !MOCKS.mocks) return;
    const m = MOCKS.mocks.filter(function (x) { return x.id === mockId; })[0];
    if (!m) return;
    const pool = m.questions.map(function (qid) {
      return ALL.filter(function (q) { return q.id === qid; })[0];
    }).filter(function (q) { return !!q; });
    if (!pool.length) { alert(t("alert.noMock")); return; }
    newSession(pool, {
      mode: "mock", mockId: m.id, label: mockLabel(m),
      minutes: m.minutes || META.exam_minutes,
      shuffleQuestions: false, shuffleOptions: true
    });
    renderQuiz();
  }

  /* 연습 모드의 '시간 제한' 선택 (체크박스가 없으면 = 무제한) */
  function timedChoice() {
    const c = el("optTimed");
    return c ? !!c.checked : false;
  }
  function modeLabel(key, timed) {
    return t(key) + (timed ? "" : " · " + t("mode.untimed"));
  }

  function startMode(mode) {
    const shufQ = el("optShufQ") ? el("optShufQ").checked : false;
    const shufO = el("optShufO") ? el("optShufO").checked : true;
    const timed = timedChoice();
    let pool, cfg;
    if (mode === "exam") {
      /* 실전 모드는 항상 시간 제한 (실제 시험과 동일) */
      pool = pickExamSet(ALL, META.exam_questions, 6);
      cfg = { mode: "exam", label: t("mode.exam"), minutes: META.exam_minutes,
              timed: true, shuffleQuestions: false, shuffleOptions: shufO };
    } else if (mode === "all") {
      pool = ALL.slice();
      cfg = { mode: "all", label: modeLabel("mode.all", timed), minutes: timed ? 60 : 0,
              timed: timed, shuffleQuestions: shufQ, shuffleOptions: shufO };
    } else {
      pool = ALL.filter(function (q) { return store.wrong[q.id] > 0; });
      cfg = { mode: "wrong", label: modeLabel("mode.wrong", timed),
              minutes: timed ? Math.max(10, Math.round(pool.length * 1.2)) : 0,
              timed: timed, shuffleQuestions: shufQ, shuffleOptions: shufO };
    }
    newSession(pool, cfg);
    renderQuiz();
  }

  /* 연습 모드에서만 '해설 보기/숨기기' 토글을 제공한다 (모의고사·실전은 시험처럼 숨김) */
  function canReveal() { return !!(S && S.cfg) && S.cfg.mode !== "exam" && S.cfg.mode !== "mock"; }

  /* 시험 중 나가기 — 응답이 있으면 확인 후, 시작했던 목록 화면으로 돌아간다 */
  function exitQuiz() {
    if (!S) { go("overview"); return; }
    const answered = Object.keys(S.answers).filter(function (k) {
      return (S.answers[k] || []).length > 0;
    }).length;
    if (answered > 0 && !confirm(t("quiz.exitConfirm"))) return;
    go(VIEW || "overview");
  }

  /* ---------- 문항 화면 (시험 포털 레이아웃) ---------- */
  function renderQuiz() {
    const n = S.questions.length;
    const q = S.questions[S.cur];
    const ans = S.answers[q.sid];
    const revealed = !!S.revealed[q.sid];
    setView("quiz");
    S.visited[q.sid] = true;
    const st = stats();

    const opts = qf(q, "options").map(function (txt, i) {
      const L = letterAt(i);
      const mine = ans.indexOf(L) !== -1;
      let cls = "opt";
      if (revealed) {
        if (q.correct.indexOf(L) !== -1) cls += " correct";
        else if (mine) cls += " wrong";
        if (mine) cls += " mine";
      } else if (mine) cls += " sel";
      return '<div class="' + cls + '" data-k="' + L + '"><span class="key">' + L.toLowerCase() +
        ")</span><span>" + esc(txt) + "</span>" +
        (revealed && mine ? '<span class="mineTag">' + t("quiz.mine") + "</span>" : "") + "</div>";
    }).join("");

    const palette = S.questions.map(function (x, i) {
      let cls = "pbtn";
      const isAns = S.answers[x.sid] && S.answers[x.sid].length > 0;
      if (S.flags[x.sid]) cls += " marked";
      else if (isAns) cls += " answered";
      else if (S.visited[x.sid]) cls += " notans";
      if (i === S.cur) cls += " cur";
      return '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + "</button>";
    }).join("");

    const ovRow = function (label, val) {
      return '<div class="ovRow">' + label + "<span>" + val + "</span></div>";
    };

    app.innerHTML =
      '<div class="examWrap">' +

      /* ---- 모바일 전용: 상단 고정 바 (진행 / 타이머 / 문항 목록) ---- */
      '<div class="mbar">' +
      '<span class="mprog">Q ' + (S.cur + 1) + " / " + n + "</span>" +
      '<span class="timer mtimer" data-timer>' + (S.timed ? formatClock(S.remain) : formatClock(S.elapsed)) + "</span>" +
      (S.timed ? "" : '<span class="mfree">' + t("mode.free") + "</span>") +
      '<button class="btn sm" id="mPaletteBtn" aria-expanded="false">' + t("quiz.palette") + "</button>" +
      "</div>" +

      /* ---- 좌측: 섹션 / 팔레트 ---- */
      '<aside class="side left panel">' +
      '<div class="panelHead">' + t("quiz.sections") + "</div>" +
      '<div class="secTitle">' + t("quiz.section") + " <b>" + n + "</b></div>" +
      '<div class="palette">' + palette + "</div>" +
      '<div class="legend">' +
      '<div><span class="dot answered"></span>' + t("quiz.legend.answered") + "<b>" + st.answered + "</b></div>" +
      '<div><span class="dot notans"></span>' + t("quiz.legend.notans") + "<b>" + st.notAnswered + "</b></div>" +
      '<div><span class="dot marked"></span>' + t("quiz.legend.marked") + "<b>" + st.marked + "</b></div>" +
      '<div><span class="dot book"></span>' + t("quiz.legend.book") + "<b>" + st.book + "</b></div>" +
      '<div><span class="dot notvisited"></span>' + t("quiz.legend.notvisited") + "<b>" + st.notVisited + "</b></div>" +
      "</div></aside>" +

      /* ---- 중앙: 문제 ---- */
      '<main class="panel">' +
      '<div class="qHead"><span class="qNum">Q: ' + (S.cur + 1) + "</span>" +
      '<span class="tag ' + (q.part === "B" ? "num" : "lec") + '">' + esc(q.lecture) + "</span>" +
      '<span class="tag">' + esc(q.id) + "</span>" +
      '<span class="grow"></span>' +
      '<button class="linkish" id="flagBtn">' + t("quiz.mark") + "</button></div>" +
      '<div class="qText">' + esc(qf(q, "prompt")) + "</div>" +
      '<div class="opts">' + opts + "</div>" +
      (revealed ? '<div class="opts"><div class="expl"><b>' + t("quiz.answer") + q.correct.join(", ") + "</b>\n" + esc(qf(q, "explanation")) +
        '<div class="revealHint">' + t("quiz.revealHint") + "</div></div></div>" : "") +
      '<div class="actionBar">' +
      '<label class="chk"><input type="checkbox" id="flagChk"' + (S.flags[q.sid] ? " checked" : "") + "> " + t("quiz.mark") + "</label>" +
      '<label class="chk"><input type="checkbox" id="bookChk"' + (S.bookmarks[q.sid] ? " checked" : "") + "> " + t("quiz.legend.book") + "</label>" +
      '<span class="grow"></span>' +
      '<button class="btn" id="prevBtn"' + (S.cur === 0 ? " disabled" : "") + ">" + t("quiz.prev") + "</button>" +
      '<button class="btn" id="clearBtn">' + t("quiz.clear") + "</button>" +
      (canReveal() ? '<button class="btn" id="revealBtn" aria-pressed="' + (revealed ? "true" : "false") + '">' + t(revealed ? "quiz.revealHide" : "quiz.reveal") + "</button>" : "") +
      '<button class="btn primary" id="nextBtn">' + (S.cur === n - 1 ? t("quiz.submit") : t("quiz.next")) + "</button>" +
      "</div></main>" +

      /* ---- 우측: 타이머 / Overview ---- */
      '<aside class="side right panel">' +
      '<div class="timerBox"><div class="' + timerClass() + '" id="timer">' +
      (S.timed ? formatClock(S.remain) : formatClock(S.elapsed)) + "</div>" +
      (S.timed
        ? '<div class="timerLabels"><span>Hrs</span><span>Min</span><span>Sec</span></div>'
        : '<div class="timerLabels free"><span>' + t("quiz.elapsed") + "</span></div>") +
      "</div>" +
      '<div class="sideBtns">' +
      '<button class="btn sm wide" id="aboutBtn">' + t("quiz.about") + "</button>" +
      '<button class="btn sm wide" id="instrBtn">' + t("quiz.instr") + "</button>" +
      '<button class="btn sm wide" id="exitBtn">' + t("nav.exit") + "</button>" +
      "</div>" +
      '<div class="ov"><div class="ovTitle">' + t("quiz.overview") + "</div>" +
      ovRow(t("quiz.ov.total"), st.total) +
      ovRow(t("quiz.ov.visited"), st.visited) +
      ovRow(t("quiz.ov.notvisited"), st.notVisited) +
      ovRow(t("quiz.ov.answered"), st.answered) +
      ovRow(t("quiz.ov.notanswered"), st.notAnswered) +
      ovRow(t("quiz.ov.marked"), st.marked) +
      ovRow(t("quiz.ov.book"), st.book) +
      "</div>" +
      '<div class="sideSubmit"><button class="btn primary wide" id="submitBtn">' + t("quiz.submit") + "</button></div>" +
      "</aside>" +

      /* ---- 모바일 전용: 하단 고정 바 (이전 / 다음·제출) ---- */
      '<div class="mfoot">' +
      '<button class="btn sm" id="mPrevBtn"' + (S.cur === 0 ? " disabled" : "") + ">" + t("quiz.prev") + "</button>" +
      '<button class="btn sm" id="mExitBtn">' + t("nav.exit") + "</button>" +
      '<span class="grow"></span>' +
      '<button class="btn sm primary" id="mNextBtn">' + (S.cur === n - 1 ? t("quiz.submit") : t("quiz.next")) + "</button>" +
      "</div>" +
      "</div>" +

      '<div class="panel" style="margin-top:16px"><div class="bar"><i style="width:' +
      Math.round((st.answered / n) * 100) + '%"></i></div>' +
      '<div class="note">' + esc(S.cfg.label) + " · " + tf("quiz.answeredOf", st.answered, n) +
      " · " + t("quiz.halfNote") + "</div></div>";

    document.querySelectorAll(".opt").forEach(function (o) {
      o.onclick = function () { toggleOption(q, o.getAttribute("data-k")); };
    });
    document.querySelectorAll("[data-jump]").forEach(function (b) {
      b.onclick = function () {
        S.cur = parseInt(b.getAttribute("data-jump"), 10);
        closePaletteOnMobile();
        renderQuiz();
      };
    });
    /* 모바일: 문항 목록 열고 닫기 */
    function closePaletteOnMobile() {
      if (isNarrow()) {
        document.body.className = document.body.className.replace(/\s*palette-open/g, "");
      }
    }
    if (el("mPaletteBtn")) {
      el("mPaletteBtn").onclick = function () {
        const open = document.body.className.indexOf("palette-open") === -1;
        document.body.className = open
          ? (document.body.className + " palette-open").replace(/^\s+/, "")
          : document.body.className.replace(/\s*palette-open/g, "");
        el("mPaletteBtn").textContent = open ? t("quiz.paletteClose") : t("quiz.palette");
        el("mPaletteBtn").setAttribute("aria-expanded", open ? "true" : "false");
      };
    }
    if (el("mPrevBtn")) el("mPrevBtn").onclick = function () { if (S.cur > 0) { S.cur--; renderQuiz(); } };
    if (el("mNextBtn")) el("mNextBtn").onclick = function () {
      if (S.cur < n - 1) { S.cur++; renderQuiz(); } else { askSubmit(); }
    };
    /* 언어 전환/재렌더 후에도 목록 버튼 라벨 동기화 */
    if (el("mPaletteBtn") && document.body.className.indexOf("palette-open") !== -1) {
      el("mPaletteBtn").textContent = t("quiz.paletteClose");
      el("mPaletteBtn").setAttribute("aria-expanded", "true");
    }
    el("prevBtn").onclick = function () { if (S.cur > 0) { S.cur--; renderQuiz(); } };
    el("nextBtn").onclick = function () {
      if (S.cur < n - 1) { S.cur++; renderQuiz(); } else { askSubmit(); }
    };
    el("flagBtn").onclick = function () { S.flags[q.sid] = !S.flags[q.sid]; renderQuiz(); };
    el("flagChk").onchange = function () { S.flags[q.sid] = el("flagChk").checked; renderQuiz(); };
    el("bookChk").onchange = function () { S.bookmarks[q.sid] = el("bookChk").checked; renderQuiz(); };
    el("clearBtn").onclick = function () { S.answers[q.sid] = []; renderQuiz(); };
    if (el("revealBtn")) el("revealBtn").onclick = function () {
      S.revealed[q.sid] = !S.revealed[q.sid];
      renderQuiz();
    };
    el("submitBtn").onclick = function () { askSubmit(); };
    el("aboutBtn").onclick = function () {
      alert(tf("quiz.about.body", n, S.timed ? (S.cfg.minutes + t("unit.min")) : t("quiz.noLimit"), S.pass));
    };
    el("instrBtn").onclick = function () {
      alert(t("quiz.instr.body"));
    };
    el("exitBtn").onclick = exitQuiz;
    if (el("mExitBtn")) el("mExitBtn").onclick = exitQuiz;
  }

  function toggleOption(q, k) {
    const a = S.answers[q.sid];
    const i = a.indexOf(k);
    if (i === -1) a.push(k); else a.splice(i, 1);
    a.sort();
    renderQuiz();
  }

  function askSubmit() {
    const blank = S.questions.filter(function (x) { return S.answers[x.sid].length === 0; }).length;
    let msg = t("quiz.confirmSubmit");
    if (blank > 0) {
      msg = tf("quiz.confirmBlank", blank);
    }
    if (confirm(msg)) submit(false);
  }

  function submit(auto) {
    if (timerId) { clearInterval(timerId); timerId = null; }
    S.submitted = true;
    S.auto = !!auto;
    const g = gradeSession(S.questions, S.answers);
    S.results = g.results;
    S.total = g.total;

    /* 오답노트 저장 */
    g.results.forEach(function (r) {
      const id = r.q.id;
      if (r.score < 1.0) store.wrong[id] = (store.wrong[id] || 0) + 1;
      else delete store.wrong[id];
    });
    const rec = {
      date: new Date().toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }),
      mode: S.cfg.label, mk: S.cfg.mode, total: g.total, max: g.max, pass: S.pass
    };
    store.history.push(rec);
    if (store.history.length > 50) store.history = store.history.slice(-50);
    if (g.total > store.best) store.best = g.total;
    if (S.cfg.mode === "random") {
      if (g.total > (store.randBest || 0)) store.randBest = g.total;
    }
    if (S.cfg.mode === "mock" && S.cfg.mockId) {
      const prev = store.mockBest[S.cfg.mockId];
      if (prev === undefined || g.total > prev) store.mockBest[S.cfg.mockId] = g.total;
    }
    saveStore();
    renderResult(auto);
  }

  /* ---------- 결과 화면 ---------- */
  function renderResult(auto) {
    const n = S.questions.length;
    const passed = S.total >= S.pass;
    setView("result");
    const mistakes = S.results.reduce(function (a, r) { return a + r.mistakes; }, 0);
    const used = S.timed ? Math.max(0, S.cfg.minutes * 60 - S.remain) : S.elapsed;
    const wrongN = S.results.filter(function (r) { return r.score < 1.0; }).length;

    const rows = S.results.map(function (r, idx) {
      const q = r.q;
      const opts = qf(q, "options").map(function (t, i) {
        const L = letterAt(i);
        const isCorr = q.correct.indexOf(L) !== -1;
        const isSel = r.selected.indexOf(L) !== -1;
        let cls = "opt";
        if (isCorr && isSel) cls += " correct";
        else if (isCorr) cls += " missed";
        else if (isSel) cls += " wrong";
        return '<div class="' + cls + '"><span class="key">' + L + "</span><span>" + esc(t) + "</span></div>";
      }).join("");
      const mark = r.score === 1 ? t("res.perfect") : r.score === 0.5 ? t("res.oneMistake") : tf("res.mistakes", r.mistakes);
      return '<div class="qres"><div class="rHead"><span class="tag ' + (q.part === "B" ? "num" : "lec") + '">' +
        esc(q.lecture) + '</span><span class="tag">' + (idx + 1) + ". " + esc(q.id) + "</span>" +
        "<span>" + esc(qf(q, "topic")) + '</span><span class="grow"></span>' +
        '<span class="' + scoreClass(r.score) + '">' + r.score.toFixed(1) + t("res.pts") + " (" + mark + ")</span></div>" +
        '<div class="rBody"><div class="prompt">' + esc(qf(q, "prompt")) + "</div>" + opts +
        '<div class="muted" style="margin-top:10px">' + t("res.yourAnswer") + '<span class="mono">' +
        (r.selected.length ? r.selected.join(", ") : t("res.blank")) +
        '</span> · ' + t("res.answer") + '<span class="mono">' + q.correct.join(", ") + "</span></div>" +
        '<div class="expl">' + esc(qf(q, "explanation")) + "</div></div></div>";
    }).join("");

    app.innerHTML =
      '<div class="panel" style="margin-bottom:16px"><div class="resTop">' +
      '<div><div class="scoreNum ' + (passed ? "pass" : "fail") + '">' + S.total.toFixed(1) + " / " + n + "</div>" +
      '<div class="muted">' + esc(S.cfg.label) + (auto ? t("res.auto") : "") + tf("res.passLine", S.pass) + "</div></div>" +
      '<div class="grow"></div><div class="stat">' +
      '<div>' + t("res.result") + '<b class="' + (passed ? "pass" : "fail") + '">' + (passed ? "PASS" : "FAIL") + "</b></div>" +
      "<div>" + t("res.totalMist") + "<b>" + mistakes + "</b></div><div>" + t("res.wrongItems") + "<b>" + wrongN + "</b></div>" +
      "<div>" + t("res.usedTime") + "<b>" + formatTime(used) + "</b></div></div></div>" +
      '<div class="panelBody" style="border-top:1px solid #eceef1"><div class="row">' +
      '<button class="btn primary" id="again">' + t("res.again") + "</button>" +
      '<button class="btn" id="retryWrong"' + (wrongN ? "" : " disabled") + ">" + tf("res.retryWrong", wrongN) + "</button>" +
      (S.cfg.mode === "random" ? '<button class="btn" id="randAgain">' + t("rand.again") + "</button>" : "") +
      '<button class="btn" id="newExam">' + t("res.newExam") + "</button>" +
      '<button class="btn" id="homeBtn">' + t("res.home") + "</button>" +
      '<button class="btn" id="copyBtn">' + t("res.copy") + "</button>" +
      '<button class="btn" id="printBtn">' + t("res.print") + "</button>" +
      "</div></div></div>" +
      '<div class="note" style="margin-bottom:12px">' + t("res.legend") + "</div>" + rows;

    el("again").onclick = function () {
      const qs = S.questions.map(function (q) { const c = JSON.parse(JSON.stringify(q)); delete c.sid; return c; });
      newSession(qs, S.cfg);
      renderQuiz();
    };
    el("retryWrong").onclick = function () {
      const bad = S.results.filter(function (r) { return r.score < 1.0; })
        .map(function (r) { const c = JSON.parse(JSON.stringify(r.q)); delete c.sid; return c; });
      newSession(bad, { mode: "wrong", label: modeLabel("mode.wrong", false), minutes: 0, timed: false,
        shuffleQuestions: false, shuffleOptions: false });
      renderQuiz();
    };
    el("newExam").onclick = function () { startMode("exam"); };
    if (el("randAgain")) el("randAgain").onclick = function () { startRandom(); };
    el("homeBtn").onclick = function () { renderHome(); };
    el("printBtn").onclick = function () { window.print(); };
    el("copyBtn").onclick = function () {
      const lines = ["[" + S.cfg.label + "] " + S.total.toFixed(1) + " / " + n + " (" + (passed ? "PASS" : "FAIL") + ")"];
      S.results.forEach(function (r, i) {
        lines.push((i + 1) + ". [" + r.q.id + " / " + r.q.lecture + "] " + r.score.toFixed(1) + t("res.pts") + " — " +
          t("res.yourAnswer") + (r.selected.join(",") || t("res.blank")) + " / " + t("res.answer") + r.q.correct.join(","));
      });
      const txt = lines.join("\n");
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { alert(t("res.copied")); },
        function () { prompt(t("res.copyPrompt"), txt); });
      else prompt(t("res.copyPrompt"), txt);
    };
  }

  /* ---------- 키보드 ---------- */
  document.addEventListener("keydown", function (e) {
    if (!S || S.submitted) return;
    const q = S.questions[S.cur];
    if (!q) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key >= "1" && e.key <= "6") {
      const i = parseInt(e.key, 10) - 1;
      if (i < q.options.length) { toggleOption(q, letterAt(i)); e.preventDefault(); }
    } else if ((e.key === "e" || e.key === "E") && canReveal()) {
      S.revealed[q.sid] = !S.revealed[q.sid]; renderQuiz(); e.preventDefault();
    } else if (e.key === "ArrowRight" || e.key === "Enter") {
      if (S.cur < S.questions.length - 1) { S.cur++; renderQuiz(); e.preventDefault(); }
    } else if (e.key === "ArrowLeft") {
      if (S.cur > 0) { S.cur--; renderQuiz(); e.preventDefault(); }
    } else if (e.key === "f" || e.key === "F") {
      S.flags[q.sid] = !S.flags[q.sid]; renderQuiz();
    } else if (e.key === "b" || e.key === "B") {
      S.bookmarks[q.sid] = !S.bookmarks[q.sid]; renderQuiz();
    }
  });

  /* ---------- 언어 전환 ---------- */
  function labelFor(cfg) {
    if (cfg.mode === "mock" && cfg.mockId && MOCKS) {
      const m = MOCKS.mocks.filter(function (x) { return x.id === cfg.mockId; })[0];
      if (m) return mockLabel(m);
    }
    const e = I18N["mode." + cfg.mode];
    return e ? (e[LANG] || e.ko) : cfg.label;
  }
  function rerender() {
    if (S) {
      S.cfg.label = labelFor(S.cfg);
      setCrumb(crumbFor(S.cfg));
      if (S.submitted) renderResult(S.auto); else renderQuiz();
    } else {
      renderSidebar();
      renderView();
      const c = currentCourse();
      setCrumb(label(c.sem.label) + " › " + label(c.course.label) + " › " + viewTitle());
    }
  }
  window.__setLang = function (v) {
    if (v === LANG) return;
    setLang(v);
    applyStaticI18n();
    rerender();
  };
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.onclick = function () { window.__setLang(b.getAttribute("data-lang")); };
  });

  /* ---------- 부팅 (게이트가 있으면 복호화 후 게이트가 호출) ---------- */
  function boot() {
    resolveData();
    /* 사이드바 토글 / 상단 링크 */
    if (el("sbToggle")) {
      el("sbToggle").onclick = function () {
        const open = document.body.className.indexOf("sb-open") === -1;
        document.body.className = open
          ? (document.body.className + " sb-open").replace(/^\s+/, "")
          : document.body.className.replace(/\s*sb-open/g, "");
      };
    }
    if (el("sbBackdrop")) el("sbBackdrop").onclick = function () { closeSidebar(); };
    if (el("brandLink")) el("brandLink").onclick = function (e) { if (e && e.preventDefault) e.preventDefault(); go("overview"); };
    if (el("homeLink")) el("homeLink").onclick = function () { go("overview"); };

    applyStaticI18n();
    go("overview");
  }
  window.__bootApp = boot;
  if (!window.__GATED__) boot();     /* 비밀번호 게이트가 없으면 바로 시작 */

  /* 디버그/테스트용 훅 */
  window.__app = {
    get S() { return S; },
    get store() { return store; },
    get lang() { return LANG; },
    get view() { return VIEW; },
    get curriculum() { return CURRICULUM; },
    setLang: window.__setLang,
    go: go,
    renderSidebar: renderSidebar,
    renderHome: renderHome, renderQuiz: renderQuiz, renderResult: renderResult,
    startMode: startMode, startMock: startMock, startOne: startOne, startRange: startRange,
    startRandom: startRandom,
    submit: submit, askSubmit: askSubmit, toggleOption: toggleOption, exitQuiz: exitQuiz
  };
})();

</script>
</body>
</html>
