<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Deep Network Development 2026 Autumn - Theory Test 1 연습용 문제 앱">
<title>DND Theory Test 1 — 연습 문제</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem("dnd_theme");
      if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* ignore */ }
  })();
</script>
<style>
  :root[data-theme="light"]{
    --bg:#f5f6fb; --bg2:#eceffa; --surface:#ffffff; --surface2:#f4f6fc; --surface3:#eef1f9;
    --line:#e2e6f0; --line2:#d3d9e8; --txt:#0f1428; --txt2:#3d4663; --dim:#6b7492;
    --acc:#4f46e5; --acc2:#7c3aed; --acc-soft:#eef0ff;
    --ok:#059669; --ok-soft:#e7f7f1; --half:#b45309; --half-soft:#fdf4e3;
    --bad:#dc2626; --bad-soft:#fdecec; --ring:rgba(79,70,229,.28);
    --sh1:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --sh2:0 2px 6px rgba(16,24,40,.08), 0 18px 44px rgba(16,24,40,.10);
  }
  :root[data-theme="dark"]{
    --bg:#0a0d18; --bg2:#0e1222; --surface:#121729; --surface2:#171d33; --surface3:#1c2340;
    --line:#252d4a; --line2:#33406b; --txt:#eaeefb; --txt2:#c3cbe4; --dim:#8b95b8;
    --acc:#7c8cff; --acc2:#b18cff; --acc-soft:#1b2140;
    --ok:#34d399; --ok-soft:#12271f; --half:#fbbf24; --half-soft:#2a2113;
    --bad:#fb7185; --bad-soft:#2c1420; --ring:rgba(124,140,255,.35);
    --sh1:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --sh2:0 2px 8px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 520px at 12% -12%, var(--bg2), transparent 60%),
      radial-gradient(900px 480px at 92% 4%, var(--acc-soft), transparent 55%),
      var(--bg);
    color:var(--txt); line-height:1.65;
    font-family:"Pretendard","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .shell{max-width:1000px;margin:0 auto;padding:0 18px 96px}
  /* ---------- 상단 바 ---------- */
  .topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
  .topbar .inner{max-width:1000px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px;font-size:.98rem}
  .brand small{display:block;font-weight:500;font-size:.72rem;color:var(--dim);letter-spacing:0}
  .logo{width:32px;height:32px;border-radius:10px;flex:0 0 32px;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px var(--ring);
    display:grid;place-items:center;color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.3px}
  .spacer{flex:1}
  /* ---------- 타이포 ---------- */
  h1{font-size:clamp(1.35rem,1.1rem + 1.2vw,1.9rem);margin:.35em 0 .15em;letter-spacing:-.8px;line-height:1.25}
  h2{font-size:1.06rem;margin:0 0 .55em;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--dim);font-size:.93rem;margin-bottom:6px}
  .grow{flex:1}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.86rem;
    background:var(--surface3);border:1px solid var(--line);border-radius:8px;padding:1px 7px}
  /* ---------- 카드 ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:20px 22px;box-shadow:var(--sh1);margin:14px 0}
  .card.tight{padding:13px 16px;border-radius:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  /* ---------- 버튼 ---------- */
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line2);
    background:var(--surface2);color:var(--txt);padding:10px 15px;font-weight:600;
    transition:transform .12s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
    display:inline-flex;align-items:center;gap:7px;justify-content:center}
  button:hover{border-color:var(--acc);background:var(--surface);box-shadow:var(--sh1);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
  button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
  button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;
    box-shadow:0 8px 22px var(--ring)}
  button.primary:hover{filter:brightness(1.06)}
  button.ghost{background:transparent;border-color:transparent;color:var(--txt2)}
  button.ghost:hover{background:var(--surface2);border-color:var(--line)}
  button.small{padding:7px 12px;font-size:.86rem;border-radius:10px}
  /* ---------- 배지 ---------- */
  .badge{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;letter-spacing:.1px;
    padding:3px 10px;border-radius:999px;background:var(--surface3);border:1px solid var(--line);color:var(--txt2);
    margin-right:6px;white-space:nowrap}
  .badge.lec{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
  .badge.num{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .pill{font-size:.86rem;color:var(--dim)}
  /* ---------- 보기 ---------- */
  .opt{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface2);
    border-radius:14px;padding:13px 15px;margin:9px 0;cursor:pointer;transition:.14s ease}
  .opt:hover{border-color:var(--acc);background:var(--surface);transform:translateY(-1px);box-shadow:var(--sh1)}
  .opt .key{flex:0 0 28px;height:28px;border-radius:9px;background:var(--surface3);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--txt2);transition:.14s}
  .opt.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 4px var(--ring)}
  .opt.sel .key{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .key{background:var(--ok);color:#fff;border-color:transparent}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad);color:#fff;border-color:transparent}
  .opt.missed{border-color:var(--half);background:var(--half-soft)}
  .opt.missed .key{background:var(--half);color:#fff;border-color:transparent}
  .prompt{white-space:pre-wrap;font-size:1.04rem;font-weight:700;letter-spacing:-.2px}
  /* ---------- 진행/타이머 ---------- */
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.06rem;padding:4px 11px;border-radius:10px;
    background:var(--surface3);border:1px solid var(--line)}
  .timer.warn{color:var(--half);border-color:var(--half);background:var(--half-soft)}
  .timer.danger{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s ease}
  .nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .nav button{width:38px;height:36px;padding:0;font-size:.84rem;border-radius:10px}
  .nav button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .nav button.flag{border-color:var(--half);color:var(--half);background:var(--half-soft)}
  .nav button.cur{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;
    box-shadow:0 0 0 4px var(--ring)}
  /* ---------- 통계/결과 ---------- */
  .stat{display:flex;gap:22px;flex-wrap:wrap}
  .stat > div{font-size:.82rem;color:var(--dim)}
  .stat > div b{display:block;font-size:1.3rem;color:var(--txt);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .score-big{font-size:clamp(2.1rem,1.6rem + 3vw,3.1rem);font-weight:900;letter-spacing:-2px;line-height:1;
    font-variant-numeric:tabular-nums}
  .score-big.pass{background:linear-gradient(135deg,var(--ok),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
  .score-big.fail{background:linear-gradient(135deg,var(--bad),var(--half));-webkit-background-clip:text;background-clip:text;color:transparent}
  .pass{color:var(--ok)} .fail{color:var(--bad)}
  .s10{color:var(--ok);font-weight:800} .s05{color:var(--half);font-weight:800} .s00{color:var(--bad);font-weight:800}
  .expl{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:0 14px 14px 0;padding:12px 15px;margin-top:12px;font-size:.93rem;color:var(--txt2);white-space:pre-wrap}
  .qres{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0;box-shadow:var(--sh1)}
  .qres .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  /* ---------- 표 ---------- */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;margin-top:10px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  /* ---------- 기타 ---------- */
  label.chk{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--txt2);cursor:pointer;
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface2)}
  label.chk:hover{border-color:var(--acc)}
  input[type="checkbox"]{width:16px;height:16px;accent-color:var(--acc)}
  a.linkbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;
    font-size:.86rem;font-weight:600;color:var(--txt2);text-decoration:none;border:1px solid transparent;
    transition:.16s ease}
  a.linkbtn:hover{background:var(--surface2);border-color:var(--line);color:var(--txt)}
  .hide{display:none!important}
  footer{color:var(--dim);font-size:.8rem;text-align:center;padding:28px 0 10px}
  .note{font-size:.84rem;color:var(--dim);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
  @media (max-width:640px){
    .card{padding:16px 15px;border-radius:16px}
    .opt{padding:12px 13px;gap:10px}
    .shell{padding:0 12px 80px}
    .stat{gap:14px}
  }
  @media print{
    :root[data-theme]{--bg:#fff;--surface:#fff;--surface2:#fff;--surface3:#fff;--txt:#000;--txt2:#222;--dim:#555;--line:#bbb}
    body{background:#fff}
    .topbar,button,.nav,.timer,.bar{display:none!important}
    .card,.qres{box-shadow:none;border-color:#bbb;break-inside:avoid}
    .opt{border-color:#999;background:#fff}
  }
</style>
</head>

<div class="topbar"><div class="inner">
  <div class="logo">DND</div>

</div></div>
<main class="shell">

</main>
<script>
  (function () {
    var b = document.getElementById("themeBtn");
    function label() {
      var t = document.documentElement.getAttribute("data-theme");
      b.textContent = t === "dark" ? "☀️ 테마" : "🌙 테마";
    }
    b.addEventListener("click", function () {
      var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("dnd_theme", t); } catch (e) { /* ignore */ }
      label();
    });
    label();
  })();
</script>

<script id="core-logic">
/* ===== core.js — DOM 비의존 순수 로직 (node로 단위 테스트 가능) ===== */
const LETTERS = "ABCDEFGH";

function letterAt(i) { return LETTERS[i]; }

/* 채점: 정답 완전 일치 1.0 / 실수 1개 0.5 / 실수 2개 이상 0.0
   실수 = (참인데 선택 안 함) 1개 + (거짓인데 선택함) 1개 */
function gradeAnswer(q, selected) {
  const sel = new Set(selected || []);
  let missed = 0, extra = 0;
  q.correct.forEach(function (c) { if (!sel.has(c)) missed++; });
  sel.forEach(function (s) { if (q.correct.indexOf(s) === -1) extra++; });
  const mistakes = missed + extra;
  let score = 0.0;
  if (mistakes === 0) score = 1.0;
  else if (mistakes === 1) score = 0.5;
  return { score: score, mistakes: mistakes, missed: missed, extra: extra };
}

/* 세션 채점 */
function gradeSession(questions, answers) {
  let total = 0;
  const results = questions.map(function (q, i) {
    const sel = answers[q.sid] || [];
    const g = gradeAnswer(q, sel);
    total += g.score;
    return { index: i, q: q, selected: sel, score: g.score, mistakes: g.mistakes, missed: g.missed, extra: g.extra };
  });
  return { results: results, total: Math.round(total * 100) / 100, max: questions.length };
}

/* Fisher-Yates */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 보기 순서 섞기 (+ 정답 문자 재매핑) */
function shuffleOptions(q) {
  const n = q.options.length;
  const order = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
  const options = order.map(function (i) { return q.options[i]; });
  const map = {};
  order.forEach(function (oldIdx, newIdx) { map[letterAt(oldIdx)] = letterAt(newIdx); });
  const correct = q.correct.map(function (c) { return map[c]; }).sort();
  const copy = JSON.parse(JSON.stringify(q));
  copy.options = options;
  copy.correct = correct;
  return copy;
}

/* 세션 생성: sid 부여, (선택) 보기 셔플, (선택) 문제 셔플 */
function buildSession(questions, opts) {
  opts = opts || {};
  let list = questions.slice();
  if (opts.shuffleQuestions) list = shuffle(list);
  let out = list.map(function (q, i) {
    const copy = opts.shuffleOptions ? shuffleOptions(q) : JSON.parse(JSON.stringify(q));
    copy.sid = "s" + i + "_" + q.id;
    return copy;
  });
  return out;
}

/* 실전 모드: 이론 nA개 + NumPy nB개 무작위 추출 */
function pickExamSet(all, nTotal, nNumpy) {
  const num = shuffle(all.filter(function (q) { return q.part === "B"; }));
  const the = shuffle(all.filter(function (q) { return q.part !== "B"; }));
  const picked = num.slice(0, nNumpy).concat(the.slice(0, Math.max(0, nTotal - nNumpy)));
  if (picked.length < nTotal) {
    const rest = shuffle(all.filter(function (q) { return picked.indexOf(q) === -1; }));
    picked.push.apply(picked, rest.slice(0, nTotal - picked.length));
  }
  return shuffle(picked);
}

/* 통과 기준: 실전 모드는 meta.exam_pass, 연습 모드는 60% */
function passLine(total, meta, isExam) {
  if (isExam) return meta.exam_pass;
  return Math.ceil(total * 0.6 * 10) / 10;
}

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function scoreClass(score) {
  if (score >= 1.0) return "s10";
  if (score >= 0.5) return "s05";
  return "s00";
}

</script>
<script id="app-logic">
/* ===== app.js — 시험 대비 문제 앱 (vanilla JS, DOM) ===== */
(function () {
  "use strict";
  const DATA = window.__QUESTION_DATA__;
  const MOCKS = window.__MOCK_DATA__ || null;
  const META = DATA.meta;
  const ALL = DATA.questions;
  const LS_KEY = "dnd_tt1_v1";
  const app = document.getElementById("app");

  /* ---------- 저장소 ---------- */
  let store = loadStore();
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s && typeof s === "object") {
        return { history: s.history || [], wrong: s.wrong || {}, best: s.best || 0, mockBest: s.mockBest || {} };
      }
    } catch (e) { /* ignore */ }
    return { history: [], wrong: {}, best: 0, mockBest: {} };
  }
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
  }

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function el(id) { return document.getElementById(id); }
  function byLecture(list) {
    const m = {};
    list.forEach(function (q) { m[q.lecture] = (m[q.lecture] || 0) + 1; });
    return m;
  }

  /* ---------- 상태 ---------- */
  let S = null;          // 현재 세션
  let timerId = null;

  function newSession(questions, cfg) {
    const qs = buildSession(questions, cfg);
    S = {
      cfg: cfg,
      questions: qs,
      answers: {},
      revealed: {},
      flags: {},
      cur: 0,
      startAt: Date.now(),
      remain: cfg.minutes * 60,
      submitted: false,
      results: null,
      total: 0,
      pass: passLine(qs.length, META, cfg.mode === "exam" || cfg.mode === "mock")
    };
    qs.forEach(function (q) { S.answers[q.sid] = []; });
    startTimer();
  }

  function startTimer() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      if (!S || S.submitted) return;
      S.remain--;
      const t = el("timer");
      if (t) {
        t.textContent = formatTime(S.remain);
        t.className = "timer" + (S.remain <= 60 ? " danger" : S.remain <= 300 ? " warn" : "");

      if (S.remain <= 0) { clearInterval(timerId); submit(true); }

    if (timerId) { clearInterval(timerId); timerId = null; }
    S = null;

    const chips = order.filter(function (k) { return lec[k]; }).map(function (k) {
      const isNum = k === "NumPy";
      return '<label class="chk" style="border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#141c2d">' +
        '<input type="checkbox" class="lecfilter" value="' + k + '"' + (isNum ? "" : " checked") + "> " +
        '<span class="badge ' + (isNum ? "num" : "lec") + '">' + k + "</span> " + lec[k] + "문항</label>";

    const wrongN = Object.keys(store.wrong).filter(function (id) { return store.wrong[id] > 0; }).length;
    const hist = store.history.slice(-5).reverse();

    /* 모의고사 버튼 */

    if (MOCKS && MOCKS.mocks) {

        const mb = store.mockBest || {};

      }).join("");

        '<div class="pill">각 세트: <b>' + MOCKS.meta.exam_questions + "문항 / " + MOCKS.meta.exam_minutes + "분 / 통과 " +
        MOCKS.meta.exam_pass + "점</b> · NumPy " + MOCKS.meta.numpy_per_mock + "문항 + 이론 " +
        (MOCKS.meta.exam_questions - MOCKS.meta.numpy_per_mock) + "문항 · 문항당 1.0/0.5/0.0점</div>" +
        '<div class="row" style="margin-top:10px">' + btns + "</div>" +
        '<div class="pill" style="margin-top:10px">세트 1~' + MOCKS.meta.primary + " 은 실전 세트, 세트 " +
        (MOCKS.meta.primary + 1) + "~" + MOCKS.meta.count +
        " 은 문제은행의 모든 문항이 최소 한 번 출제되도록 만든 추가 세트입니다.</div></div>";
    }
    const histRows = hist.length
      ? hist.map(function (h) {
          return "<tr><td>" + esc(h.date) + "</td><td>" + esc(h.mode) + "</td><td>" + h.total + " / " + h.max +
            '</td><td class="' + (h.total >= h.pass ? "pass" : "fail") + '">' + (h.total >= h.pass ? "PASS" : "FAIL") + "</td></tr>";
        }).join("")
      : '<tr><td colspan="4" style="color:var(--dim)">아직 기록이 없습니다.</td></tr>';

    app.innerHTML =
      "<h1>" + esc(META.title) + "</h1>" +
      '<div class="sub">' + esc(META.subtitle) + "</div>" +
      '<div class="card tight"><div class="pill">' + esc(META.real_exam_note) + "</div>" +
      '<div class="pill" style="margin-top:4px">채점: ' + esc(META.grading_note) + "</div></div>" +

      '<div class="card"><h2 style="margin-top:0">모드 선택</h2><div class="row">' +
      '<button class="primary" id="mExam">실전 모드(랜덤) — ' + META.exam_questions + "문항 / " + META.exam_minutes + "분 / 통과 " + META.exam_pass + "점</button>" +
      '<button id="mAll">전체 연습 — ' + ALL.length + "문항 / 60분</button>" +
      '<button id="mWrong"' + (wrongN ? "" : " disabled") + ">오답 복습 — " + wrongN + "문항</button>" +
      "</div>" +
      '<div style="margin-top:14px;color:var(--dim);font-size:.9rem">강의별 범위 선택 (해제하면 그 강의는 제외됩니다)</div>' +
      '<div class="row" style="margin-top:6px">' + chips +
      '<button class="small" id="mSel">선택 범위로 연습 시작</button>' +
      '<button class="small ghost" id="selAll">전체 선택</button><button class="small ghost" id="selNone">전체 해제</button></div>' +
      '<div class="row" style="margin-top:14px">' +
      '<label class="chk"><input type="checkbox" id="optShufQ"> 문제 순서 섞기</label>' +
      '<label class="chk"><input type="checkbox" id="optShufO" checked> 보기 순서 섞기</label>' +
      "</div></div>" +
      mockHtml +

      '<div class="card"><h2 style="margin-top:0">기록</h2>' +
      '<div class="stat"><div>최고 점수<b>' + store.best + "</b></div><div>저장된 오답<b>" + wrongN +
      "</b></div><div>응시한 모의고사<b>" + Object.keys(store.mockBest || {}).length + " / " + (MOCKS ? MOCKS.mocks.length : 0) + "</b></div></div>" +
      '<table style="margin-top:10px"><tr><th>날짜</th><th>모드</th><th>점수</th><th>결과</th></tr>' + histRows + "</table>" +
      '<div class="row" style="margin-top:10px"><button class="small ghost" id="reset">기록/오답 초기화</button>' +
      '<button class="small ghost" id="printHome">현재 화면 인쇄</button></div></div>' +

      '<div class="card"><h2 style="margin-top:0">사용법 / 단축키</h2><div class="pill">' +
      "① 문항에서 <b>1~5</b> 키로 보기 선택/해제, <b>←/→</b> 로 문항 이동, <b>Enter</b> 는 다음 문항입니다.<br>" +
      "② 정답이 여러 개인 문항이 많습니다. <b>확실히 참인 보기만</b> 고르면 실수 1개 = 0.5점이 보장됩니다.<br>" +
      "③ 제출하면 문항별 1.0 / 0.5 / 0.0 과 해설이 표시되고, 틀린 문항은 자동으로 오답노트에 저장됩니다.<br>" +
      "④ 모든 데이터는 브라우저(localStorage)에만 저장되며, 인터넷 연결이 필요 없습니다.</div></div>";

    el("mExam").onclick = function () { startMode("exam"); };
    el("mAll").onclick = function () { startMode("all"); };
    document.querySelectorAll("[data-mock]").forEach(function (b) {
      b.onclick = function () { startMock(b.getAttribute("data-mock")); };
    });
    if (wrongN) el("mWrong").onclick = function () { startMode("wrong"); };
    el("selAll").onclick = function () { document.querySelectorAll(".lecfilter").forEach(function (c) { c.checked = true; }); };
    el("selNone").onclick = function () { document.querySelectorAll(".lecfilter").forEach(function (c) { c.checked = false; }); };
    el("mSel").onclick = function () {
      const sel = Array.prototype.slice.call(document.querySelectorAll(".lecfilter:checked")).map(function (c) { return c.value; });
      const pool = ALL.filter(function (q) { return sel.indexOf(q.lecture) !== -1; });
      if (pool.length < 3) { alert("최소 3문항 이상이 되도록 강의를 선택하세요."); return; }
      newSession(pool, {
        mode: "range", label: "범위 연습",
        minutes: Math.max(10, Math.round(pool.length * 1.2)),
        shuffleQuestions: el("optShufQ").checked, shuffleOptions: el("optShufO").checked
      });
      renderQuiz();
    };
    el("reset").onclick = function () {
      if (!confirm("기록과 오답노트를 모두 지울까요?")) return;
      store = { history: [], wrong: {}, best: 0, mockBest: {} };
      saveStore(); renderHome();
    };
    el("printHome").onclick = function () { window.print(); };
  }

  function startMock(mockId) {
    if (!MOCKS || !MOCKS.mocks) return;
    const m = MOCKS.mocks.filter(function (x) { return x.id === mockId; })[0];
    if (!m) return;
    const pool = m.questions.map(function (qid) {
      return ALL.filter(function (q) { return q.id === qid; })[0];
    }).filter(function (q) { return !!q; });
    if (!pool.length) { alert("모의고사 데이터를 찾을 수 없습니다."); return; }
    newSession(pool, {
      mode: "mock", mockId: m.id, label: m.label,
      minutes: m.minutes || META.exam_minutes,
      shuffleQuestions: false, shuffleOptions: true
    });
    renderQuiz();
  }

  function startMode(mode) {
    const shufQ = el("optShufQ") ? el("optShufQ").checked : false;
    const shufO = el("optShufO") ? el("optShufO").checked : true;
    let pool, cfg;
    if (mode === "exam") {
      pool = pickExamSet(ALL, META.exam_questions, 6);
      cfg = { mode: "exam", label: "실전 모드", minutes: META.exam_minutes, shuffleQuestions: false, shuffleOptions: shufO };
    } else if (mode === "all") {
      pool = ALL.slice();
      cfg = { mode: "all", label: "전체 연습", minutes: 60, shuffleQuestions: shufQ, shuffleOptions: shufO };
    } else {
      pool = ALL.filter(function (q) { return store.wrong[q.id] > 0; });
      cfg = { mode: "wrong", label: "오답 복습", minutes: Math.max(10, Math.round(pool.length * 1.2)), shuffleQuestions: shufQ, shuffleOptions: shufO };
    }
    newSession(pool, cfg);
    renderQuiz();
  }

  /* ---------- 문항 화면 ---------- */
  function renderQuiz() {
    const n = S.questions.length;
    const q = S.questions[S.cur];
    const ans = S.answers[q.sid];
    const answered = S.questions.filter(function (x) { return S.answers[x.sid].length > 0; }).length;
    const revealed = !!S.revealed[q.sid];

    const opts = q.options.map(function (t, i) {
      const L = letterAt(i);
      let cls = "opt";
      if (revealed) {
        if (q.correct.indexOf(L) !== -1) cls += " correct";
        else if (ans.indexOf(L) !== -1) cls += " wrong";
      } else if (ans.indexOf(L) !== -1) cls += " sel";
      return '<div class="' + cls + '" data-k="' + L + '"><span class="key">' + L + "</span><span>" + esc(t) + "</span></div>";
    }).join("");

    const nav = S.questions.map(function (x, i) {
      const done = S.answers[x.sid].length > 0;
      const cls = (i === S.cur ? "cur " : "") + (done ? "done " : "") + (S.flags[x.sid] ? "flag" : "");
      return '<button class="' + cls.trim() + '" data-jump="' + i + '">' + (i + 1) + "</button>";
    }).join("");

    app.innerHTML =
      '<div class="card tight"><div class="row">' +
      '<span class="badge">' + esc(S.cfg.label) + "</span>" +
      '<span class="grow">문항 <b>' + (S.cur + 1) + "</b> / " + n + " · 응답 " + answered + " · 검토 " +
      Object.keys(S.flags).filter(function (k) { return S.flags[k]; }).length + "</span>" +
      '<span class="timer' + (S.remain <= 60 ? " danger" : S.remain <= 300 ? " warn" : "") + '" id="timer">' + formatTime(S.remain) + "</span>" +
      '<button class="primary small" id="submitBtn">제출하기</button>' +
      "</div>" +
      '<div class="bar" style="margin-top:10px"><i style="width:' + Math.round((answered / n) * 100) + '%"></i></div>' +
      "</div>" +

      '<div class="card">' +
      '<div class="row"><span class="badge ' + (q.part === "B" ? "num" : "lec") + '">' + esc(q.lecture) + "</span>" +
      '<span class="badge">' + esc(q.id) + "</span><span class=\"pill\">" + esc(q.topic) + "</span></div>" +
      '<div class="prompt" style="margin:10px 0 4px">' + esc(q.prompt) + "</div>" +
      opts +
      (revealed
        ? '<div class="expl"><b>정답: ' + q.correct.join(", ") + "</b>\n" + esc(q.explanation) + "</div>"
        : "") +
      '<div class="row" style="margin-top:14px">' +
      '<button class="small" id="prevBtn"' + (S.cur === 0 ? " disabled" : "") + ">← 이전</button>" +
      '<button class="small" id="nextBtn"' + (S.cur === n - 1 ? " disabled" : "") + ">다음 →</button>" +
      '<button class="small ghost" id="flagBtn">' + (S.flags[q.sid] ? "★ 검토 해제" : "☆ 검토 표시") + "</button>" +
      '<button class="small ghost" id="clearBtn">선택 지우기</button>' +
      (S.cfg.mode !== "exam" && S.cfg.mode !== "mock" ? '<button class="small ghost" id="revealBtn">해설 보기</button>' : "") +
      "</div></div>" +

      '<div class="card tight"><div class="pill">문항 이동 (초록 = 응답 완료, 노랑 = 검토 표시)</div><div class="nav">' + nav + "</div></div>";

    document.querySelectorAll(".opt").forEach(function (o) {
      o.onclick = function () { if (!revealed) toggleOption(q, o.getAttribute("data-k")); };
    });
    document.querySelectorAll("[data-jump]").forEach(function (b) {
      b.onclick = function () { S.cur = parseInt(b.getAttribute("data-jump"), 10); renderQuiz(); };
    });
    el("prevBtn").onclick = function () { if (S.cur > 0) { S.cur--; renderQuiz(); } };
    el("nextBtn").onclick = function () { if (S.cur < n - 1) { S.cur++; renderQuiz(); } };
    el("flagBtn").onclick = function () { S.flags[q.sid] = !S.flags[q.sid]; renderQuiz(); };
    el("clearBtn").onclick = function () { S.answers[q.sid] = []; renderQuiz(); };
    if (el("revealBtn")) el("revealBtn").onclick = function () { S.revealed[q.sid] = true; renderQuiz(); };
    el("submitBtn").onclick = function () { askSubmit(); };
  }

  function toggleOption(q, k) {
    const a = S.answers[q.sid];
    const i = a.indexOf(k);
    if (i === -1) a.push(k); else a.splice(i, 1);
    a.sort();
    renderQuiz();
  }

  function askSubmit() {
    const blank = S.questions.filter(function (x) { return S.answers[x.sid].length === 0; }).length;
    let msg = "제출할까요?";
    if (blank > 0) {
      msg = "아직 응답하지 않은 문항이 " + blank + "개 있습니다.\n" +
        "(교수님 규칙상 빈 문항도 '참인 보기를 놓친 실수'로 계산됩니다: 참 1개 문항은 0.5점, 참 2개 이상이면 0점)\n\n" +
        "제출할까요?";
    }
    if (confirm(msg)) submit(false);
  }

  function submit(auto) {
    if (timerId) { clearInterval(timerId); timerId = null; }
    S.submitted = true;
    const g = gradeSession(S.questions, S.answers);
    S.results = g.results;
    S.total = g.total;

    /* 오답노트 저장 */
    g.results.forEach(function (r) {
      const id = r.q.id;
      if (r.score < 1.0) store.wrong[id] = (store.wrong[id] || 0) + 1;
      else delete store.wrong[id];
    });
    const rec = {
      date: new Date().toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }),
      mode: S.cfg.label, total: g.total, max: g.max, pass: S.pass
    };
    store.history.push(rec);
    if (store.history.length > 50) store.history = store.history.slice(-50);
    if (g.total > store.best) store.best = g.total;
    if (S.cfg.mode === "mock" && S.cfg.mockId) {
      const prev = store.mockBest[S.cfg.mockId];
      if (prev === undefined || g.total > prev) store.mockBest[S.cfg.mockId] = g.total;
    }
    saveStore();
    renderResult(auto);
  }

  /* ---------- 결과 화면 ---------- */
  function renderResult(auto) {
    const n = S.questions.length;
    const passed = S.total >= S.pass;
    const mistakes = S.results.reduce(function (a, r) { return a + r.mistakes; }, 0);
    const used = Math.max(0, S.cfg.minutes * 60 - S.remain);
    const wrongN = S.results.filter(function (r) { return r.score < 1.0; }).length;

    const rows = S.results.map(function (r, idx) {
      const q = r.q;
      const opts = q.options.map(function (t, i) {
        const L = letterAt(i);
        const isCorr = q.correct.indexOf(L) !== -1;
        const isSel = r.selected.indexOf(L) !== -1;
        let cls = "opt";
        if (isCorr && isSel) cls += " correct";
        else if (isCorr) cls += " missed";
        else if (isSel) cls += " wrong";
        return '<div class="' + cls + '"><span class="key">' + L + "</span><span>" + esc(t) + "</span></div>";
      }).join("");
      const mark = r.score === 1 ? "완전 정답" : r.score === 0.5 ? "실수 1개" : "실수 " + r.mistakes + "개";
      return '<div class="qres"><div class="head"><div><span class="badge ' + (q.part === "B" ? "num" : "lec") + '">' +
        esc(q.lecture) + "</span><span class=\"badge\">" + (idx + 1) + "번 · " + esc(q.id) + "</span>" +
        '<span class="pill">' + esc(q.topic) + "</span></div>" +
        '<div class="' + scoreClass(r.score) + '">' + r.score.toFixed(1) + "점 (" + mark + ")</div></div>" +
        '<div class="prompt" style="margin:8px 0 2px">' + esc(q.prompt) + "</div>" + opts +
        '<div class="pill" style="margin-top:8px">내 답: <span class="mono">' + (r.selected.length ? r.selected.join(", ") : "무응답") +
        '</span> · 정답: <span class="mono">' + q.correct.join(", ") + "</span></div>" +
        '<div class="expl">' + esc(q.explanation) + "</div></div>";
    }).join("");

    app.innerHTML =
      '<div class="card"><div class="row">' +
      '<div><div class="score-big ' + (passed ? "pass" : "fail") + '">' + S.total.toFixed(1) + " / " + n + "</div>" +
      '<div class="pill">' + esc(S.cfg.label) + (auto ? " · 시간 종료로 자동 제출" : "") + " · 통과 기준 " + S.pass + "점</div></div>" +
      '<div class="grow"></div><div class="stat">' +
      "<div>합격 여부<b class=\"" + (passed ? "pass" : "fail") + "\">" + (passed ? "PASS" : "FAIL") + "</b></div>" +
      "<div>총 실수<b>" + mistakes + "</b></div><div>틀린 문항<b>" + wrongN + "</b></div>" +
      "<div>소요 시간<b>" + formatTime(used) + "</b></div></div></div>" +
      '<div class="row" style="margin-top:14px">' +
      '<button class="primary" id="again">같은 문제 다시 풀기</button>' +
      '<button id="retryWrong"' + (wrongN ? "" : " disabled") + ">틀린 문항만 다시 풀기 (" + wrongN + ")</button>" +
      '<button id="newExam">새 실전 모드</button>' +
      '<button class="ghost" id="homeBtn">홈으로</button>' +
      '<button class="ghost" id="copyBtn">결과 텍스트 복사</button>' +
      '<button class="ghost" id="printBtn">인쇄/PDF</button>' +
      "</div></div>" +
      '<div class="card tight"><div class="pill">아래에서 문항별 채점 결과와 해설을 확인하세요. ' +
      "초록 = 정답, 주황 = 놓친 정답, 빨강 = 잘못 선택한 보기</div></div>" + rows;

    el("again").onclick = function () {
      const qs = S.questions.map(function (q) { const c = JSON.parse(JSON.stringify(q)); delete c.sid; return c; });
      newSession(qs, S.cfg);
      renderQuiz();
    };
    el("retryWrong").onclick = function () {
      const bad = S.results.filter(function (r) { return r.score < 1.0; })
        .map(function (r) { const c = JSON.parse(JSON.stringify(r.q)); delete c.sid; return c; });
      newSession(bad, { mode: "wrong", label: "오답 복습", minutes: Math.max(5, Math.round(bad.length * 1.2)), shuffleQuestions: false, shuffleOptions: false });
      renderQuiz();
    };
    el("newExam").onclick = function () { startMode("exam"); };
    el("homeBtn").onclick = function () { renderHome(); };
    el("printBtn").onclick = function () { window.print(); };
    el("copyBtn").onclick = function () {
      const lines = ["[" + S.cfg.label + "] " + S.total.toFixed(1) + " / " + n + " (" + (passed ? "PASS" : "FAIL") + ")"];
      S.results.forEach(function (r, i) {
        lines.push((i + 1) + ". [" + r.q.id + " / " + r.q.lecture + "] " + r.score.toFixed(1) + "점 — 내 답 " +
          (r.selected.join(",") || "무응답") + " / 정답 " + r.q.correct.join(","));
      });
      const txt = lines.join("\n");
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { alert("결과를 클립보드에 복사했습니다."); },
        function () { prompt("복사하세요:", txt); });
      else prompt("복사하세요:", txt);
    };
  }

  /* ---------- 키보드 ---------- */
  document.addEventListener("keydown", function (e) {
    if (!S || S.submitted) return;
    const q = S.questions[S.cur];
    if (!q) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key >= "1" && e.key <= "6") {
      const i = parseInt(e.key, 10) - 1;
      if (i < q.options.length && !S.revealed[q.sid]) { toggleOption(q, letterAt(i)); e.preventDefault(); }
    } else if (e.key === "ArrowRight" || e.key === "Enter") {
      if (S.cur < S.questions.length - 1) { S.cur++; renderQuiz(); e.preventDefault(); }
    } else if (e.key === "ArrowLeft") {
      if (S.cur > 0) { S.cur--; renderQuiz(); e.preventDefault(); }
    } else if (e.key === "f" || e.key === "F") {
      S.flags[q.sid] = !S.flags[q.sid]; renderQuiz();
    }
  });

  /* ---------- 시작 ---------- */
  renderHome();
  /* 디버그/테스트용 훅 */
  window.__app = {
    get S() { return S; },
    get store() { return store; },
    renderHome: renderHome, renderQuiz: renderQuiz, renderResult: renderResult,
    startMode: startMode, startMock: startMock, submit: submit, askSubmit: askSubmit, toggleOption: toggleOption
  };
})();

</script>
</body>
</html>
