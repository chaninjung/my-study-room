<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="light">
<!-- 한글 UI 폰트: Pretendard(주), 실패하면 Noto Sans KR / 시스템 폰트로 자동 대체.
     Noto Sans KR 을 주 폰트로 쓰려면 아래 preload 한 줄을 Google Fonts 링크로 바꾸고
     theme.css 의 font-family 첫 항목을 "Noto Sans KR" 로 바꾸면 됩니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<!-- 로고/배너 워드마크용 Montserrat (인프런 로고 톤 · 실패하면 Noto Sans/시스템 폰트로 자동 대체) -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"></noscript>
<meta name="description" content="ELTE AI & Computer Science Study Hub — Deep Network Development (DND) mock exam practice for ELTE students (@inf.elte.hu). Practice exam-style questions and take mock exams to prepare for the real ELTE exam.">
<title>My Study Room — 학습 허브</title>
<link rel="icon" href="assets/favicon.ico">
<style>/* ==========================================================================
   theme.css — 공용 디자인 시스템 (문제 앱 / 용어집 / 인쇄 페이지 공통)
   폰트: Pretendard Variable (CDN, 비동기) → Noto Sans KR → 시스템 폰트
   원칙: 중립 그레이 + 단일 액센트(navy) · 8px 라운드 · 미세한 그림자 · 그라디언트 없음
   ========================================================================== */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --surface-3:#f2f4f7;
  --border:#e4e7ec;
  --border-2:#d0d5dd;
  --text:#101828;
  --text-2:#475467;
  --text-3:#667085;
  --text-4:#98a2b3;
  --primary:#1d3a8f;
  --primary-hover:#16306f;
  --primary-soft:#eef2fd;
  --primary-border:#c7d4f5;
  --link:#175cd3;
  --ok:#087443;      --ok-bg:#ecfdf3;   --ok-border:#a6e5c0;
  --warn:#b54708;    --warn-bg:#fffaeb; --warn-border:#f3d99b;
  --bad:#b42318;     --bad-bg:#fef3f2;  --bad-border:#f3bdb8;
  --purple:#5925dc;  --purple-bg:#f4f0ff; --purple-border:#cdbcf7;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 2px 4px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);
  --r-sm:6px; --r-md:8px; --r-lg:10px;
  --focus:0 0 0 3px rgba(29,58,143,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    "Noto Sans KR","Apple SD Gothic Neo","Segoe UI","Malgun Gothic",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{letter-spacing:-.02em;margin:0}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* 한글은 단어 중간에서 줄바꿈되지 않게 (긴 영문·코드는 필요할 때만 분리) */
.qText,.opt,.opt span,.expl,.prompt,.rBody,.sent,.card,.note,td,th{
  word-break:keep-all;overflow-wrap:anywhere}
/* 좁은 flex 행에서는 글자가 한 글자씩 쪼개지지 않도록 (min-content 를 단어 단위로 유지) */
.rowGrid,.rowGrid .name,.rowGrid .muted,.mockRow,.mockRow .name,.mockRow .meta,.mockRow .best,
.stat > div,.legend div,.ovRow,.sbItem,.sbCourseHead,.scoreChip{
  word-break:keep-all;overflow-wrap:normal;min-width:0}
/* 그리드/플렉스 자식이 강제로 넘치지 않도록 */
.panel,main,.side,.examWrap > *{min-width:0}
.mono,.timer,.scoreNum,.stat b,.legend b,.ovRow span,table.grid td{font-variant-numeric:tabular-nums}

/* ===================== 버튼 ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1;height:38px;padding:0 14px;
  border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--border-2);background:#fff;color:var(--text);
  box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s,box-shadow .15s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:#b9c0cc}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:0;box-shadow:var(--focus)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
/* 주요 버튼은 브랜드 초록 (라이브러리/로그인과 통일) */
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.wide{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

/* ===================== 상단 바 / 언어 토글 =====================
   상단 바는 '화면이 바뀌어도 위치가 변하지 않도록' 고정한다:
   - flex-wrap:nowrap  → 줄바꿈으로 내비게이션이 밀리지 않음
   - 오른쪽 항목(langBox/linkish)은 flex:0 0 auto 로 절대 줄어들지 않음
   - breadcrumb 만 줄어들고 말줄임(…) 처리됨                                   */
.topbar{background:#fff;border-bottom:1px solid var(--border);min-height:60px;display:flex;align-items:center;
  padding:10px 20px;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:nowrap;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text);
  min-width:0;flex:0 1 auto;overflow:hidden}
.crumbs .sep{color:var(--text-4);font-weight:400}
.crumbs .cur{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .grow{flex:1 1 auto}
.topbar .langBox,.topbar .linkish{flex:0 0 auto;white-space:nowrap}
.linkish{color:var(--text-2);font-size:13.5px;font-weight:600;cursor:pointer;background:none;border:0;
  padding:6px 2px;font-family:inherit;transition:color .15s}
.linkish:hover{color:var(--primary);text-decoration:none}
.linkish.on{color:var(--primary)}
.langBox{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;
  background:#fff;box-shadow:var(--shadow-xs)}
.langBtn{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border:0;background:#fff;
  color:var(--text-3);cursor:pointer;transition:background .15s,color .15s}
.langBtn + .langBtn{border-left:1px solid var(--border)}
.langBtn:hover{background:var(--surface-2)}
.langBtn.on{background:var(--primary);color:#fff}

/* ===================== 레이아웃 / 패널 ===================== */
.wrap{width:100%;max-width:1360px;margin:0 auto;padding:20px 20px 48px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panelHead{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;
  color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panelHead .grow{flex:1}
.panelBody{padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterRow{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--text-3);font-size:13px}

/* ===================== 배지 / 칩 ===================== */
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-2);margin-right:6px;white-space:nowrap;line-height:1.7}
.tag.num{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.tag.lec{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary)}
.tag.AC{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:99px;
  padding:6px 12px;font-size:13px;color:var(--text-2);background:#fff;cursor:pointer;
  transition:border-color .15s,background .15s}
.fchip:hover{border-color:var(--border-2);background:var(--surface-2)}
.fchip input{margin:0}

/* ===================== 표 ===================== */
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.grid th,table.grid td{border-bottom:1px solid var(--surface-3);padding:10px 14px;text-align:left;vertical-align:top}
table.grid th{color:var(--text-3);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--surface-2)}
table.grid tbody tr:hover{background:#fcfcfd}
table.grid tr:last-child td{border-bottom:0}

/* ===================== 비밀번호 게이트 (선택 기능) ===================== */
.gateWrap{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;
  justify-content:center;padding:20px}
.gateWrap[hidden]{display:none}
.gateCard{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);
  width:100%;max-width:400px;padding:26px 24px}
.gateBadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-border);
  border-radius:99px;padding:2px 9px;margin-bottom:12px}
.gateTitle{font-size:17px;font-weight:700;margin:0 0 8px}
.gateSub{font-size:13px;color:var(--text-3);line-height:1.65;margin:0 0 18px}
.gateErr{color:var(--bad);font-size:13px;margin:0 0 10px}
.gateInput{width:100%;height:42px;font-family:inherit;font-size:15px;padding:0 12px;color:var(--text);
  border:1px solid var(--border-2);border-radius:var(--r-sm);margin-bottom:12px;background:#fff}
.gateInput:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
.gateChk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);
  margin:0 0 16px;line-height:1.5;cursor:pointer}
.gateChk input{margin-top:2px}
.gateFoot{font-size:11.5px;color:var(--text-4);line-height:1.6;margin-top:14px}
body.gate-locked{overflow:hidden}

/* ===================== 기타 공통 ===================== */
.note{font-size:12.5px;color:var(--text-3);padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.stat{display:flex;gap:28px;flex-wrap:wrap}
.stat > div{font-size:12.5px;color:var(--text-3)}
.stat > div b{display:block;font-size:19px;color:var(--text);margin-top:2px}
.expl{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin-top:12px;font-size:13.5px;
  color:var(--text-2);white-space:pre-wrap}
.revealHint{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:12.5px;color:var(--text-3);white-space:normal}
.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary)}
/* 검색 입력 (문제은행 / 용어집 공용) */
.search{width:100%;max-width:380px;height:38px;font-family:inherit;font-size:14px;padding:0 12px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);background:#fff;color:var(--text);
  transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--text-4)}
.search:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
footer{color:var(--text-4);font-size:12px;text-align:center;padding:26px 0 8px}

/* ===================== 클라우드 동기화 (계정 버튼 · 모달) ===================== */
/* 인프런 느낌의 브랜드 초록 — 주요 버튼 · 라이브러리/로그인 등 앱 전체 강조색 */
:root{--brand:#00c471;--brand-dark:#00a862;--brand-soft:#e6f8f0}
/* StudyRoom 워드마크 (인프런 로고 톤) */
.studyroom-logo-text{font-family:'Montserrat','Noto Sans',sans-serif;font-weight:700;color:#00C471}
.acctBox{display:inline-flex;align-items:center;flex:0 0 auto}
.acctBtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.acctIcon{font-size:14px;line-height:1}
.acctName{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctDot{width:7px;height:7px;border-radius:50%;background:var(--text-4);display:inline-block}
.acctDot.ok{background:var(--brand)}
.acctDot.ing{background:var(--warn)}
.acctDot.err{background:var(--bad)}
/* 프로필 드롭다운 (로그인 후 계정 버튼 → 이름/Student/Dashboard/My learning/… ) */
.acctMenu{position:fixed;top:64px;right:20px;z-index:60;width:268px;max-width:calc(100vw - 24px);
  background:#fff;border:1px solid #eceff2;border-radius:14px;padding:8px;font-size:14px;
  box-shadow:0 12px 34px rgba(9,15,23,.16)}
.acctMenu[hidden]{display:none}
.acctMenuHead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;
  font-family:inherit;text-align:left;cursor:pointer;padding:12px;border-radius:10px}
.acctMenuHead:hover{background:#f6f8fa}
.acctMenuAvatar{width:40px;height:40px}
.acctMenuAvatar svg{width:22px;height:22px}
.acctMenuId{display:flex;flex-direction:column;min-width:0;flex:1}
.acctMenuName{font-size:14.5px;font-weight:700;color:#1d2129;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctMenuRole{font-size:12.5px;color:#8b95a1;margin-top:1px}
.acctMenuChev{color:#b0b8c1;flex:0 0 auto;display:inline-flex;align-items:center}
.acctMenuChev svg{width:18px;height:18px;display:block}
.acctMenuList{display:flex;flex-direction:column;gap:1px;padding:4px 0}
.acctMenuHr{height:1px;background:#f2f4f6;margin:4px 8px}
.acctMenuItem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;
  font-family:inherit;font-size:14px;color:#333d4b;cursor:pointer;padding:10px 12px;border-radius:10px;text-align:left}
.acctMenuItem:hover{background:#f6f8fa;color:#1d2129}
.acctMenuItem svg{width:19px;height:19px;display:block;color:#8b95a1;flex:0 0 auto}
.acctMenuItem:hover svg{color:#1d2129}
@media (max-width:560px){.acctMenu{top:58px;right:12px;width:min(300px,calc(100vw - 24px))}}
/* 창/시트가 떠 있는 동안 배경 페이지는 스크롤하지 않는다 → 스크롤 막대가 두 개 생기지 않는다 */
body.sheetOpen{overflow:hidden}
.syncBack{position:fixed;inset:0;background:rgba(9,15,23,.52);z-index:9000;display:flex;
  align-items:center;justify-content:center;padding:16px;overflow:auto;overscroll-behavior:contain}
.syncBack[hidden]{display:none}
.syncWrap{width:100%;max-width:424px}
/* 로그인 창 = 인프런 톤: 흰 카드 · 둥근 모서리 · 넉넉한 여백 · 초록 버튼
   (창 높이는 화면을 넘지 않는다 — 넘치면 배경이 아니라 창 안에서만 스크롤된다) */
.syncCard{position:relative;background:#fff;border:0;border-radius:16px;display:flex;flex-direction:column;
  max-height:calc(100vh - 32px);box-shadow:0 18px 48px rgba(9,15,23,.22);overflow:hidden}
.syncBody{padding:42px 36px 30px;overflow:auto}
/* 창 상단 가운데 로고 (인프런 로그인 창처럼 파비콘 + 초록 워드마크) */
.syncLogo{display:flex;align-items:center;justify-content:center;gap:9px;margin:4px 0 24px}
.syncLogoImg{width:30px;height:30px;border-radius:7px;display:block}
.syncLogoText{font-size:26px}
.syncX{position:absolute;top:16px;right:16px;width:34px;height:34px;border:0;background:none;color:#8b95a1;
  border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.syncX:hover{background:#f2f4f6;color:#1d2129}
.syncX svg{width:19px;height:19px;display:block}
.syncInput{display:block;width:100%;height:50px;font-family:inherit;font-size:14.5px;padding:0 16px;
  border:1px solid #dfe3e8;border-radius:8px;background:#fff;color:#1d2129;margin-bottom:12px;
  transition:border-color .15s,box-shadow .15s}
.syncInput::placeholder{color:#8b95a1}
.syncInput:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
/* 인증번호(OTP) 입력 — 숫자 6자리를 크게, 가운데 정렬 */
.syncOtp{letter-spacing:.5em;text-align:center;font-size:19px;font-variant-numeric:tabular-nums}
.syncOtpMail{margin:-4px 0 12px;font-size:13.5px;text-align:center;word-break:break-all}
.syncPw{position:relative}
.syncPw .syncInput{padding-right:52px}
.syncEye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:34px;border:0;
  background:none;color:#8b95a1;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;margin-top:-6px}
.syncEye:hover{color:#1d2129;background:#f2f4f6}
.syncEye svg{width:20px;height:20px;display:block}
.syncErr{min-height:18px;font-size:12.5px;color:var(--bad);margin:0 0 8px}
/* 로그인/가입 버튼 (초록·꽉 찬 폭) */
.syncCard .btn.primary{width:100%;height:50px;border:0;border-radius:8px;background:var(--brand);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.syncCard .btn.primary:hover{background:var(--brand-dark)}
.syncLinks{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 0}
.syncLink{border:0;background:none;padding:2px;font-family:inherit;font-size:12.5px;color:#8b95a1;cursor:pointer}
.syncLink:hover{color:#1d2129}
.syncLink.on{color:#1d2129;font-weight:700}
.syncDiv{color:#dfe3e8;font-size:12px}
.syncInfo{margin:12px 0 0;font-size:12.5px;line-height:1.55;color:#8b95a1;text-align:center}
.syncSocial{margin-top:24px}
.syncSep{display:flex;align-items:center;gap:12px;font-size:12px;color:#b0b8c1;margin-bottom:16px}
.syncSep::before,.syncSep::after{content:"";flex:1;height:1px;background:#eceff2}
.syncOAuth{display:flex;align-items:center;justify-content:center;gap:14px}
.oauthBtn{width:52px;height:52px;border-radius:12px;border:1px solid #e5e8eb;background:#fff;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.oauthBtn:hover{filter:brightness(.97);box-shadow:0 2px 8px rgba(9,15,23,.10)}
.oauthBtn svg{display:block}
.oauthGoogle{color:#4285f4}
.oauthKakao{background:#fee500;border-color:#fee500;color:#3c1e1e}
.oauthGithub{background:#24292f;border-color:#24292f;color:#fff}
.oauthApple{background:#111;border-color:#111;color:#fff}

.syncNowName{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;color:#1d2129}
.syncNow{background:#f6f8fa;border-radius:10px;padding:14px 16px}

/* 신기능 안내 창(자동 공지) — 'What's new' 시트

.noticeWrap{max-width:424px}

.noticeBadge svg{width:23px;height:23px;display:block}
.noticeKicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand);text-align:center;margin:0 0 6px}
.noticeTitle{font-size:18px;font-weight:800;line-height:1.35;color:#1d2129;text-align:center;
  letter-spacing:-.02em;margin:0 0 7px;word-break:keep-all}
.noticeLead{margin:0 0 15px;font-size:13px;line-height:1.6;color:#4e5968;text-align:center;word-break:keep-all}
.noticeLead b{color:#1d2129}
.noticeList{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
.noticeItem{display:flex;gap:10px;align-items:flex-start}
.noticeIco{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:#f6f8fa;color:#4e5968;
  display:inline-flex;align-items:center;justify-content:center}
.noticeIco svg{width:17px;height:17px;display:block}
.noticeItemBody{min-width:0}
.noticeItemTitle{font-size:13px;font-weight:700;color:#1d2129;margin:0 0 2px;word-break:keep-all}
.noticeItemText{margin:0;font-size:12px;line-height:1.55;color:#8b95a1;word-break:keep-all}
.noticeItemText b{color:#4e5968}
.noticeTip{margin:0;padding:9px 12px;border-radius:9px;background:#f6f8fa;
  font-size:12px;line-height:1.5;color:#4e5968;text-align:center;word-break:keep-all}
.noticeChk{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 10px;font-size:12px;
  color:#8b95a1;cursor:pointer;user-select:none;word-break:keep-all}
.noticeChk input{flex:0 0 auto;width:15px;height:15px;margin:0}
.noticeOkBtn{width:100%;height:44px;border:0;border-radius:10px;font-size:14.5px;font-weight:700}

/* ---------- 라이브러리 (과목 카탈로그) ---------- */
/* 계정 기능이 켜졌는데 로그인 전이면 사이드바를 감춘다 (자기 DB 를 볼 수 있을 때만 보임) */
body.sbLocked .sidebar,body.sbLocked .sbBackdrop{display:none}
body.sbLocked .sbToggle{display:none}
/* 라이브러리 화면은 전체 폭 — 사이드바/브레드크럼/메뉴는 감추고 로고만 */
body.view-library .sidebar,body.view-library .sbBackdrop{display:none}
body.view-library .topbar .crumbs,body.view-library .topbar .sbToggle{display:none}
body.view-library .wrap{max-width:none;padding:0}
/* 로그인 전 헤더 오른쪽은 **지구본 + Sign in** 두 개만 (언어 버튼·용어집·홈 링크는 숨김) */
.libTopRight{display:inline-flex;align-items:center;gap:10px}
body.view-library .libTopRight{display:inline-flex}
body.view-library .topbar .langBox,body.view-library .topbar .navGloss,
body.view-library .topbar #homeLink{display:none}
body.view-library .topbar .brandHome{display:inline-flex}
.topbar .brandHome{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:#1d2129;
  letter-spacing:-.02em;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:8px}
.topbar .brandHome:hover{background:#f2f4f6}
.brandLogo{width:26px;height:26px;border-radius:6px;display:block;flex:0 0 auto}
/* 지구본 버튼 = 인프런 ActionIcon 실측값(42px · 회색 10% 원 · #495057 · 아이콘 18px) */
.iconBtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(135,143,151,.1);color:#495057;cursor:pointer;transition:background .15s}
.iconBtn:hover{background:rgba(135,143,151,.18)}
.iconBtn svg{width:16px;height:16px;display:block}
.avatar{width:28px;height:28px;border-radius:50%;position:relative;overflow:hidden;flex:0 0 auto;
  background:#e5e8eb;color:#8b95a1;display:inline-flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700}
.avatar img,.avatarImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar svg{width:16px;height:16px}
/* 라이브러리 헤더는 인프런 실측값 그대로 (흰 바탕 + 헤어라인 · 높이 65px) */
body.view-library .topbar{background:#fff;border-bottom:1px solid #f2f4f6;padding:11px 28px;gap:10px}
/* Sign in = 인프런 Button(light) 실측값: 회색 10% 알약 · 높이 42px · 좌우 22px · 16px/600 · radius 32px */
body.view-library .acctBtn{height:42px;padding:0 22px;border:0;border-radius:32px;font-size:16px;font-weight:600;
  color:#495057;background:rgba(135,143,151,.1)}
body.view-library .acctBtn:hover{background:rgba(135,143,151,.18);color:#212529}

/* ---- 검색 (inflearn 실측: 높이 58px 알약 · 테두리 #dee2e6 · radius 50px · 안쪽 8px / 초록 원형 버튼 42px) ---- */
/* 상단 로고와 같은 왼쪽 선(28px)에서 시작한다 — 화면이 넓어도 가운데로 몰리지 않는다 */
.libWrap{max-width:none;margin:0;padding:10px 28px 80px}
.libSearch{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dee2e6;border-radius:50px;
  height:58px;padding:0 8px;max-width:520px;margin:0 auto 32px}
.libSearchInput{border:0;outline:0;font:inherit;font-size:16px;flex:1;height:36px;background:transparent;
  color:#212529;padding:0 0 0 10px}
.libSearchInput::placeholder{color:#868e96}
.libSearchBtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  background:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.libSearchBtn:hover{background:var(--brand-dark)}
.libSearchBtn svg{width:16px;height:16px;display:block}

/* 중간·좁은 데스크톱/태블릿에서는 검색창이 화면을 지나치게 차지하지 않도록 최대폭을 줄인다.
   넓은 화면(1912px)에서는 인프런과 같은 520px를 유지한다. */
@media (max-width:1080px){.libSearch{max-width:460px}}
@media (max-width:768px){.libSearch{max-width:380px}}
@media (max-width:560px){.libSearch{max-width:none}}

/* ---- 섹션 제목 + View all (inflearn 배치: 왼쪽 굵은 제목 / 오른쪽 회색 링크) ---- */
.libLogo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;max-width:1460px}
.libLogo b{font-size:22px;font-weight:700;color:#1d2129;letter-spacing:-.03em}
.libViewAll{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:500;color:#4e5968;
  background:none;border:0;cursor:pointer;padding:4px 2px}
.libViewAll:hover{color:var(--brand)}
.libViewAll svg{width:16px;height:16px;display:block}

/* ---- 학기 탭 (inflearn: 굵은 밑줄 · 첫 탭은 제목과 왼쪽 정렬 · 오른쪽 원형 스크롤 버튼) ---- */
.libTabsWrap{position:relative;display:flex;align-items:center;border-bottom:1px solid #f2f4f6;margin:0 0 20px;
  max-width:1460px}
.libTabs{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
.libTabs::-webkit-scrollbar{display:none}
.libTab{position:relative;background:none;border:0;padding:12px 14px 14px;font:inherit;font-size:15px;
  font-weight:500;color:#8b95a1;cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
.libTab:first-child{padding-left:0}
.libTab:hover{color:#4e5968}
.libTab.on{color:#1d2129;font-weight:700}
.libTab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#1d2129}
.libTabSub{font-size:13px;font-weight:400;color:#b0b8c1;margin-left:4px}

/* ---- 카드 가로 스크롤 (inflearn · 항상 왼쪽 정렬) ---- */
.libRow{display:flex;gap:20px;overflow-x:auto;scroll-behavior:smooth;justify-content:flex-start;
  padding:2px 0 6px;scrollbar-width:none;max-width:1460px}
.libRow::-webkit-scrollbar{display:none}
/* 전체 보기: 카드 폭은 그대로(218px) 두고 왼쪽부터 채운다 — 하나뿐이어도 늘어나지 않는다 */
.libGridAll{display:grid;grid-template-columns:repeat(auto-fill,218px);gap:30px 20px;justify-content:start;
  max-width:1460px}
.libRowNav{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;max-width:1460px}
.rowNavBtn{width:40px;height:40px;border-radius:50%;border:1px solid #e5e8eb;background:#fff;color:#4e5968;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.rowNavBtn:hover{background:#f9fafb;color:#1d2129;border-color:#d1d6db}
.rowNavBtn:disabled{opacity:.35;cursor:default}
.rowNavBtn svg{width:18px;height:18px;display:block}
.libCard{flex:0 0 218px;width:218px;display:block;text-align:left;padding:0;background:none;border:0;
  cursor:pointer;font:inherit}
.libGridAll .libCard{flex:none;width:auto}
.libCover{position:relative;height:130px;border-radius:6px;overflow:hidden;border:1px solid #e5e8eb;
  background:#f2f4f6;color:#8b95a1;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;letter-spacing:.06em}
.libCoverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.libBody{padding:14px 0 0}
.libTitle{font-size:16px;font-weight:600;color:#1d2129;line-height:1.4;letter-spacing:-.01em;min-height:44px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.libSub{margin-top:6px;font-size:13px;color:#8b95a1;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.libFoot{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:#8b95a1}
.lockBadge{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:#4e5968;background:#f2f4f6;border-radius:6px;padding:3px 7px;white-space:nowrap}
.lockBadge svg{width:12px;height:12px;display:block}
.libEmpty{grid-column:1/-1;flex:1 0 100%;padding:56px 0;text-align:center;color:#8b95a1;font-size:14px}
.libHint{max-width:none;margin:22px 0 0;text-align:left;font-size:13px;color:#8b95a1;line-height:1.6}
/* 게이트 잠금 패널 (로그인 전 — 용어집 등) */
body.sbLocked .wrap>.tabs,body.sbLocked .wrap>section{display:none}
.lockPanel{max-width:460px;margin:64px auto;text-align:center;background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:36px 26px}
.lockPanelIcon{color:#8b95a1;margin-bottom:12px}
.lockPanelIcon svg{width:30px;height:30px;display:block;margin:0 auto}
.lockPanelTitle{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.lockPanelSub{font-size:13px;color:var(--text-3);line-height:1.65;margin-bottom:18px}
@media (max-width:560px){
  /* 좁은 화면에서는 닉네임 글자만 숨기고 아이콘은 남긴다 (상단 바 줄바꿈 방지) */
  .acctName{display:none}
  /* 라이브러리: 좁은 화면에서는 카드/여백·검색창을 줄인다 (inflearn 모바일과 같은 결) */
  body.view-library .topbar{padding:10px 14px}
  .libWrap{padding:10px 14px 60px}
  .libSearch{height:54px;padding:0 6px;border-radius:27px;margin-bottom:24px}
  .libSearchBtn{width:40px;height:40px}
  .libSearchBtn svg{width:15px;height:15px}
  /* 헤더 아이콘·Sign in 알약도 한 단계 작게 (모바일 65px → 59px) */
  .iconBtn{width:38px;height:38px}
  .iconBtn svg{width:16px;height:16px}
  body.view-library .acctBtn{height:38px;padding:0 16px;font-size:14.5px}
  .libCard{flex:0 0 158px;width:158px}
  .libGridAll{grid-template-columns:repeat(auto-fill,158px)}
  .libLogo b{font-size:19px}
  .libTitle{font-size:15px;min-height:42px}
  /* 로그인 창: 좁은 화면에서는 좌우 여백·소셜 버튼을 줄인다 */
  .syncBody{padding:38px 20px 24px}
  .oauthBtn{width:46px;height:46px;border-radius:10px}
  .syncOAuth{gap:10px}
  /* 창/시트: 화면이 좁으면 여백을 줄여 창 안에서만 스크롤되게 (스크롤 막대는 하나만) */
  .syncBack{padding:12px}
  .syncCard{max-height:calc(100vh - 24px)}
  .noticeBody{padding:18px 18px 4px}
  .noticeFoot{padding:0 18px 16px}
  .noticeTitle{font-size:17px}
}

.prio3{border-style:dashed;color:var(--text-4)}
/* 출처 그룹 배지 (dnd_question_classification.md): 1 DOCX = 시험 범위, 2A/2B 강의, 3 참고 */
.grp{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;font-size:11.5px;
  font-weight:700;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);
  vertical-align:middle;white-space:nowrap}
.grp1{border-color:#8fc98a;background:#eaf6e8;color:#26641f}
.grp2a{border-color:#a9c6e8;background:#eef4fc;color:#1f4e86}
.grp2b{border-color:#e6cf94;background:#fbf6e8;color:#7a5a12}
.grp3{border-style:dashed;color:var(--text-4)}
/* 중요도 티어 배지 (dnd_likely_exam_questions.md): A = DOCX 그대로, B = 강조된 슬라이드, C = 낮음 */
.tier{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11.5px;
  font-weight:800;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-3);
  vertical-align:middle;white-space:nowrap}
.tier.tierA{border-color:#e8b4b0;background:#fdeeec;color:#a3271d}
.tier.tierB{border-color:#e6cf94;background:#fbf6e8;color:#7a5a12}
.tier.tierAB{border-color:#c3b2e6;background:#f2eefb;color:#5a3fa8}
/* 개요의 '다른 방법' 접이식 영역 (실전 모드 · 전체 연습) */
details.more{margin:6px 0 0;border-top:1px solid var(--border)}
details.more > summary{cursor:pointer;padding:10px 0 8px;font-size:12.5px;font-weight:700;color:var(--text-3);
  list-style:none}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▸ ";color:var(--text-4)}
details.more[open] > summary::before{content:"▾ "}
details.more > summary:hover{color:var(--primary)}
details.more .rowGrid{border-top:1px solid var(--border)}
.qText{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:18px 20px;margin:14px 20px 20px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.opts{padding:0 20px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 16px;margin:0 0 10px;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--border-2);background:var(--surface-2)}
.opt .key{flex:0 0 26px;font-weight:700;color:var(--text-3)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt.sel .key{color:var(--primary)}
.opt.correct{border-color:var(--ok-border);background:var(--ok-bg);box-shadow:inset 0 0 0 1px #12b76a}
.opt.correct .key{color:var(--ok)}
.opt.wrong{border-color:var(--bad-border);background:var(--bad-bg);box-shadow:inset 0 0 0 1px #f04438}
.opt.wrong .key{color:var(--bad)}
.opt.missed{border-color:var(--warn-border);background:var(--warn-bg);box-shadow:inset 0 0 0 1px #f79009}
.opt.missed .key{color:var(--warn)}
/* 해설을 보는 중에도 '내가 고른 보기'를 알 수 있게 표시 */
.opt .mineTag{margin-left:auto;flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:700;
  color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.actionBar{display:flex;align-items:center;gap:10px;padding:8px 20px 20px;flex-wrap:wrap}
.actionBar .grow{flex:1}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-2);cursor:pointer}

/* ---------- 우측: 타이머 / Overview ---------- */
.timerBox{border-bottom:1px solid var(--border);padding:18px 12px 12px;text-align:center;
  background:var(--surface-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
.timer{font-size:34px;font-weight:700;color:var(--primary);letter-spacing:1px;line-height:1.1}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--bad)}
.timer.free{color:var(--text-2)}          /* 연습 모드: 시간 제한 없음 (경과 시간) */
.timerLabels.free{letter-spacing:0;text-transform:none;color:var(--text-3);font-size:11.5px}
.timerLabels{display:flex;justify-content:center;gap:28px;font-size:11px;color:var(--text-4);
  margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.sideBtns{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.ov{padding:14px 16px 6px}
.ovTitle{font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ovRow{display:flex;font-size:13px;padding:6px 0;border-bottom:1px solid var(--surface-3);color:var(--text-2)}
.ovRow:last-child{border-bottom:0}
.ovRow span{margin-left:auto;font-weight:700;color:var(--text)}
.sideSubmit{padding:12px}

/* ---------- 진행바 ---------- */
.bar{height:6px;background:#eaecf0;border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .3s ease}

/* ---------- 홈 / 새 뷰 공통 ---------- */
.pageTitle{font-size:20px;font-weight:700;margin:0 0 6px}

/* 모의고사 세트 행: 좁은 칸에서도 읽기 좋게 2줄 배치
   1행: [실전] 모의고사 1 .......... 미응시 [시작]
   2행: 15문항 · 45분 · 통과 7점                                    */
.mockRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 10px;
  align-items:center;padding:12px 16px;border-bottom:1px solid var(--surface-3);transition:background .15s}
.mockRow:hover{background:var(--surface-2)}
.mockRow:last-child{border-bottom:0}
.mockRow .tag{margin-right:0;white-space:nowrap}
.mockRow .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mockRow .best{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.mockRow .meta{grid-column:1 / -1;font-size:12.5px;color:var(--text-3);line-height:1.5}
.mockRow .btn{white-space:nowrap}
/* 최종 모의고사: 눈에 띄게 강조 (시험 전 마지막 점검용) */
.mockRow.final{background:var(--primary-soft);border-left:4px solid var(--primary)}
.mockRow.final:hover{background:var(--surface-2)}
.mockRow.final .name{font-weight:700;color:var(--primary)}
.mockRow .tag.finalTag{background:var(--primary);color:#fff;border-color:var(--primary)}
.finalPanel{border:2px solid var(--primary);border-radius:var(--r-lg);overflow:hidden}
.finalPanel .panelHead{background:var(--primary-soft);color:var(--primary);font-weight:700}
.finalPanel .panelNote{padding:10px 16px 0;font-size:12.5px;color:var(--text-3);line-height:1.6}

.scoreGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scoreChip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 10px;font-size:12.5px;color:var(--text-3);background:#fff}
.scoreChip b{margin-left:auto;font-size:14px;color:var(--text-4);font-variant-numeric:tabular-nums}
.scoreChip.done{border-color:var(--primary-border);background:var(--primary-soft);color:var(--primary)}
.scoreChip.done b{color:var(--primary)}
.homeHead{padding:20px 20px 8px}
.homeHead h1{font-size:20px;font-weight:700;margin:0 0 6px}
.rowGrid{display:flex;align-items:center;gap:10px 12px;padding:12px 16px;
  border-bottom:1px solid var(--surface-3);transition:background .15s;flex-wrap:wrap}
.rowGrid:hover{background:var(--surface-2)}
.rowGrid:last-child{border-bottom:0}
.rowGrid .grow{flex:1}
.rowGrid .name{font-weight:600;flex:0 1 auto}
.rowGrid .muted{flex:1 1 auto;min-width:0}
.rowGrid .btn{flex:0 0 auto}
/* 기록 표: 머리글·날짜·점수·결과 칸은 줄바꿈하지 않는다 (FAIL/RESULT 가 쪼개지지 않게) */
.histTable th,.histTable td:first-child,.histTable td:nth-child(3),
.histTable td:last-child{white-space:nowrap}
/* MODE 칸: 전체 라벨("범위 연습 · 무제한 · ⭐ A")은 좁은 칸에서 여러 줄로 깨진다.
   기본 모드 이름만 넣고(histMode), 넘쳐도 단어 경계에서만 줄바꿈한다(글자 중간 깨짐 방지). */
.histTable td.hmode{white-space:normal;word-break:keep-all;overflow-wrap:break-word;line-height:1.35}

/* ---------- 과목 단원(섹션) 탭 바 (이론1 · 이론2 · 코딩 · 오럴) ---------- */
.secBar{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;margin:0 0 16px}
.secBarLab{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.secTabs{display:flex;gap:8px;flex-wrap:wrap;min-width:0;overflow-x:auto;scrollbar-width:none}
.secTabs::-webkit-scrollbar{display:none}
.secTab{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--text-2);background:#fff;border:1px solid var(--border);border-radius:99px;padding:8px 16px;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.secTab:hover{background:var(--surface-2);color:var(--text)}
.secTab.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}
.secTabSoon{font-size:10.5px;font-weight:700;color:var(--text-3);background:var(--surface-3);border-radius:99px;padding:2px 7px}
.secEmpty{padding:36px 16px 42px;text-align:center}
.secEmptyTitle{display:block;font-size:17px;font-weight:700;margin:0 0 6px;color:var(--text)}

/* ---------- 결과 ---------- */
.resTop{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:20px}
.scoreNum{font-size:40px;font-weight:700;letter-spacing:-.02em}
.scoreNum.pass{color:var(--ok)}
.scoreNum.fail{color:var(--bad)}
.qres{border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;margin:0 0 14px;box-shadow:var(--shadow-xs)}
.qres .rHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2);font-size:13px;color:var(--text-3);flex-wrap:wrap;
  border-radius:var(--r-lg) var(--r-lg) 0 0}
.qres .rHead .grow{flex:1}
.qres .rBody{padding:16px}
.s10{color:var(--ok);font-weight:700}
.s05{color:var(--warn);font-weight:700}
.s00{color:var(--bad);font-weight:700}
.prompt{white-space:pre-wrap;font-size:15px;line-height:1.7}

/* ==========================================================================
   반응형 — 데스크톱 / 노트북 / 태블릿 / 폰(세로·가로)
   · 홈 화면은 .homeWrap (인라인 스타일 제거 → 미디어 쿼리가 실제로 적용됨)
   · 860px 이하: 상단·하단 고정 바 + 목록 접힘 (앱 같은 모바일 레이아웃)
   ========================================================================== */

/* 데스크톱: 홈 화면 2열 (기존 인라인 grid-template-columns 를 대체) */
.homeWrap{grid-template-columns:minmax(0,1fr) 420px}

/* 모바일 전용 바: 데스크톱에서는 완전히 숨김 */
.mbar,.mfoot{display:none}

/* ---------- 노트북 (3열 유지, 폭만 축소) ---------- */
@media (max-width:1280px){
  .examWrap{grid-template-columns:220px minmax(0,1fr) 280px;gap:14px}
  .homeWrap{grid-template-columns:minmax(0,1fr) 360px;gap:14px}
}
@media (max-width:1120px){
  .homeWrap{grid-template-columns:minmax(0,1fr)}
}

/* ---------- 좁은 노트북: 목록을 위쪽 가로줄로 ---------- */
@media (max-width:1040px){
  .examWrap{grid-template-columns:minmax(0,1fr) 260px;gap:14px}
  .side.left{grid-column:1 / -1;position:static}
  .palette{grid-template-columns:repeat(10,1fr)}
  .side{top:70px}
  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px}
}

/* ---------- 태블릿 / 폰 ---------- */
@media (max-width:860px){
  .wrap{padding:14px 14px 40px}
  /* 시험 화면에서는 상단 고정 바가 상단 바를 대신한다(겹침 방지) — 그 바에 '홈'이 항상 있다 */
  body.view-quiz .topbar{display:none}
  body.view-quiz .wrap{padding:56px 14px 86px}   /* 상·하단 고정 바가 가리지 않도록 */
  .topbar{position:static;box-shadow:none}
  .examWrap,.homeWrap{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static}

  /* 상단 고정 바: 진행 / 타이머 / 문항 목록 */
  .mbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:30;
    background:#fff;border-bottom:1px solid var(--border);padding:8px 14px;
    box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .mbar .mprog{font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap}
  .mbar .mtimer{margin-left:auto;font-size:20px;letter-spacing:0}
  .mbar .mfree{font-size:11px;font-weight:600;color:var(--text-3);border:1px solid var(--border);
    border-radius:99px;padding:1px 7px;white-space:nowrap}

  /* 하단 고정 바: 이전 / 다음·제출 */
  .mfoot{display:flex;align-items:center;gap:8px;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:#fff;border-top:1px solid var(--border);padding:8px 14px;
    box-shadow:0 -2px 10px rgba(16,24,40,.06)}
  .mfoot .grow{flex:1}
  .mfoot #mNextBtn{min-width:140px}

  /* 순서: 문제 → (목록) → 안내/개요 */
  main.panel{order:1}
  .side.left{order:2}
  .side.right{order:3}

  /* 문항 목록은 기본 접힘, '문항 목록' 버튼으로 펼침 */
  .side.left{display:none}
  body.palette-open .side.left{display:block}
  .palette{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .pbtn{height:44px;font-size:13.5px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}

  /* 우측 패널: 상·하단 바로 대체되는 요소는 숨김 */
  .side.right .timerBox,.side.right .sideSubmit{display:none}
  .sideBtns{grid-template-columns:1fr 1fr}
  /* 이전/다음은 하단 고정 바에 있으므로 액션바에서는 숨겨 중복 제거 */
  .actionBar #prevBtn,.actionBar #nextBtn{display:none}
  .actionBar .chk{flex:1 1 auto}

  .qText{padding:15px 16px;margin:12px 16px 16px;font-size:14.5px}
  .opts{padding:0 16px}
  .opt{padding:13px 14px;gap:10px}
  .qHead{padding:14px 16px 0}
  .actionBar{padding:6px 16px 16px}
  .actionBar .btn{flex:1 1 auto}
  .resTop{gap:16px;padding:16px}
  .scoreNum{font-size:32px}
  .homeHead{padding:16px 16px 6px}
  .homeHead h1{font-size:17px}
  .rowGrid{flex-wrap:wrap;gap:8px;padding:12px 14px}
  .rowGrid .muted{flex-basis:100%}
  .filterRow{padding:12px 14px}
}

/* ---------- 폰 (세로) ---------- */
@media (max-width:560px){
  .wrap{padding:12px 10px 36px}
  body.view-quiz .wrap{padding:64px 10px 80px}
  .appName,.crumbs .sep{display:none}
  /* 상단 바는 어떤 화면에서도 같은 항목·같은 위치를 유지한다 (폰에서는 용어집/인쇄는 ☰ 메뉴에서) */
  .topbar{padding:8px 12px;gap:8px;min-height:0;flex-wrap:nowrap;overflow:hidden}
  .topbar .navGloss{display:none}
  .crumbs{font-size:13.5px}
  .crumbs .cur{max-width:38vw}
  .linkish{font-size:12.5px}
  .langBtn{padding:5px 9px;font-size:12px}
  .panelHead{padding:10px 12px;font-size:13px}
  .panelBody{padding:12px}
  .mbar{padding:7px 12px;gap:8px}
  .mbar .mtimer{font-size:18px}
  .mbar .mprog{font-size:12.5px}
  .mfoot{padding:7px 10px}
  .mfoot .btn{flex:0 0 auto}
  .mfoot #mNextBtn{min-width:0;flex:1}
  .qText{margin:10px 12px 14px;padding:14px;font-size:14px}
  .opts{padding:0 12px}
  .qHead{padding:12px 12px 0}
  .actionBar{padding:6px 12px 14px}
  .actionBar .chk{flex:1 1 45%}
  .actionBar .btn{flex:1 1 100%}
  .palette{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px;padding:10px}
  .pbtn{height:42px}
  .sideBtns{grid-template-columns:1fr}
  .stat{gap:16px}
  .resTop{gap:12px;padding:14px}
  .scoreNum{font-size:28px}
  .qres .rHead{padding:10px 12px}
  .qres .rBody{padding:12px}
  .prompt{font-size:14px}
  .legend{grid-template-columns:1fr}
  table.grid th,table.grid td{padding:8px 10px}
  .timerLabels{display:none}
}

/* ---------- 가로가 짧은 화면(폰 가로) ---------- */
@media (max-height:560px) and (orientation:landscape){
  .wrap{padding:12px 14px 32px}
  body.view-quiz .wrap{padding:60px 14px 72px}
  .qText{margin:8px 14px 10px;padding:12px}
  .opt{padding:10px 12px;margin-bottom:8px}
  .mbar,.mfoot{padding:6px 12px}
  .palette{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
}

@media print{
  body{background:#fff}
  .topbar,.side,.btn,.actionBar,.bar,.timerBox,.mbar,.mfoot{display:none!important}
  .examWrap{grid-template-columns:1fr}
  .panel{box-shadow:none;border-color:#c8ccd4}
}

   - LANG: "ko" | "en" (localStorage 에 저장)
   - t(key): 현재 언어의 문자열
   - tf(key, ...args): %s 자리를 채운 문자열
   - questionField(q, "prompt"): q.prompt_ko / q.prompt_en 선택
*/
var LANGS = ["ko", "en"];
var LANG = (function () {
  try {
    if (typeof localStorage !== "undefined") {
      var v = localStorage.getItem("dnd_tt1_lang");
      if (LANGS.indexOf(v) !== -1) return v;
    }
  } catch (e) { /* ignore */ }
  return "en";          /* 기본 언어 = 영어 (저장된 설정이 없을 때) */
})();

function setLang(v) {
  if (LANGS.indexOf(v) === -1) return;
  LANG = v;
  try { localStorage.setItem("dnd_tt1_lang", v); } catch (e) { /* ignore */ }
  if (typeof document !== "undefined" && document.documentElement) document.documentElement.lang = v;
}

/* 문자열 조회 */
function t(key) {
  var e = I18N[key];
  if (!e) return key;
  return e[LANG] || e.ko;
}

/* %s 자리 채우기 */
function tf(key) {
  var s = t(key);
  var args = Array.prototype.slice.call(arguments, 1);
  var i = 0;
  return s.replace(/%s/g, function () {
    var v = args[i++];
    return v === undefined || v === null ? "" : String(v);
  });
}

/* 문항 필드: 언어별 값이 있으면 그것을, 없으면 기본값을 돌려준다 */
function questionField(q, field) {
  var v = q[field + "_" + LANG];
  if (v === undefined || v === null) return q[field];
  return v;
}

/* data-i18n 속성을 가진 정적 요소들을 현재 언어로 갱신 */
function applyStaticI18n() {
  if (typeof document === "undefined") return;
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute("data-i18n");
    nodes[i].textContent = t(key);
  }
  var btns = document.querySelectorAll("[data-lang]");
  for (var j = 0; j < btns.length; j++) {
    var on = btns[j].getAttribute("data-lang") === LANG;
    btns[j].className = "langBtn" + (on ? " on" : "");
    btns[j].setAttribute("aria-pressed", on ? "true" : "false");
  }
  if (typeof document !== "undefined" && document.documentElement) {
    document.documentElement.lang = LANG;
  }
}

<script id="core-logic">
/* ===== core.js — DOM 비의존 순수 로직 (node로 단위 테스트 가능) ===== */
const LETTERS = "ABCDEFGH";

function letterAt(i) { return LETTERS[i]; }

/* 채점: 정답 완전 일치 1.0 / 실수 1개 0.5 / 실수 2개 이상 0.0
   실수 = (참인데 선택 안 함) 1개 + (거짓인데 선택함) 1개 */
function gradeAnswer(q, selected) {
  const sel = new Set(selected || []);
  let missed = 0, extra = 0;
  q.correct.forEach(function (c) { if (!sel.has(c)) missed++; });
  sel.forEach(function (s) { if (q.correct.indexOf(s) === -1) extra++; });
  const mistakes = missed + extra;
  let score = 0.0;
  if (mistakes === 0) score = 1.0;
  else if (mistakes === 1) score = 0.5;
  return { score: score, mistakes: mistakes, missed: missed, extra: extra };
}

/* 세션 채점 */
function gradeSession(questions, answers) {
  let total = 0;
  const results = questions.map(function (q, i) {
    const sel = answers[q.sid] || [];
    const g = gradeAnswer(q, sel);
    total += g.score;
    return { index: i, q: q, selected: sel, score: g.score, mistakes: g.mistakes, missed: g.missed, extra: g.extra };
  });
  return { results: results, total: Math.round(total * 100) / 100, max: questions.length };
}

/* Fisher-Yates */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 보기 순서 섞기 (+ 정답 문자 재매핑)
   이중 언어 문항은 options_ko / options_en 을 같은 순서로 함께 섞는다. */
function shuffleOptions(q) {
  const base = q.options || q.options_ko || [];
  const n = base.length;
  const order = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
  const map = {};
  order.forEach(function (oldIdx, newIdx) { map[letterAt(oldIdx)] = letterAt(newIdx); });
  const copy = JSON.parse(JSON.stringify(q));
  copy.correct = q.correct.map(function (c) { return map[c]; }).sort();
  copy.options = order.map(function (i) { return (q.options || q.options_ko)[i]; });
  if (q.options_ko) copy.options_ko = order.map(function (i) { return q.options_ko[i]; });
  if (q.options_en) copy.options_en = order.map(function (i) { return q.options_en[i]; });
  return copy;
}

/* 세션 생성: sid 부여, (선택) 보기 셔플, (선택) 문제 셔플 */
function buildSession(questions, opts) {
  opts = opts || {};
  let list = questions.slice();
  if (opts.shuffleQuestions) list = shuffle(list);
  let out = list.map(function (q, i) {
    const copy = opts.shuffleOptions ? shuffleOptions(q) : JSON.parse(JSON.stringify(q));
    copy.sid = "s" + i + "_" + q.id;
    return copy;
  });
  return out;
}

/* 실전 모드: 이론 nA개 + NumPy nB개 무작위 추출 */
function pickExamSet(all, nTotal, nNumpy) {
  const num = shuffle(all.filter(function (q) { return q.part === "B"; }));
  const the = shuffle(all.filter(function (q) { return q.part !== "B"; }));
  const picked = num.slice(0, nNumpy).concat(the.slice(0, Math.max(0, nTotal - nNumpy)));
  if (picked.length < nTotal) {
    const rest = shuffle(all.filter(function (q) { return picked.indexOf(q) === -1; }));
    picked.push.apply(picked, rest.slice(0, nTotal - picked.length));
  }
  return shuffle(picked);
}

/* 통과 기준: 실전 모드는 meta.exam_pass, 연습 모드는 60% */
function passLine(total, meta, isExam) {
  if (isExam) return meta.exam_pass;
  return Math.ceil(total * 0.6 * 10) / 10;
}

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

  /* ---------- 스크롤 잠금 ----------
     창(로그인/가입)이나 안내 시트가 떠 있는 동안 배경 페이지까지 스크롤되면
     스크롤 막대가 **두 개** 생기고 뒤 화면이 흔들린다.
     → body 에 sheetOpen(overflow:hidden) 을 주고, 사라진 스크롤 막대 폭만큼 오른쪽 여백을 채워
       잠글 때 레이아웃이 튀지 않게 한다(막대가 없는 환경이면 여백 0). */
  function lockPage(on) {
    try {
      var b = document.body;
      if (!b) return;
      var cur = String(b.className || "").split(/\s+/).filter(function (c) {
        return c && c !== "sheetOpen";
      });
      if (on) cur.push("sheetOpen");
      b.className = cur.join(" ");
      var gap = 0;
      if (on) {
        gap = (Number(window && window.innerWidth) || 0) -
          (Number(document.documentElement && document.documentElement.clientWidth) || 0);
      }
      if (b.style) b.style.paddingRight = on && gap > 0 ? gap + "px" : "";
    } catch (e) { /* DOM 이 없어도 조용히 넘어간다 */ }
  }
  /* 공지 시트가 지금 화면에 떠 있는가 (닫으면 host 가 비고 hidden 이 된다) */
  function noticeVisible() {
    var host = el("noticeHost");
    return !!(host && !host.hidden && String(host.innerHTML || "").indexOf("noticeBack") !== -1);
  }
  /* 지금 상태(창/시트)에 맞춰 잠금을 다시 계산 — 어느 경로로 닫혀도 스크롤은 하나만 남는다 */
  function syncScrollLock() { lockPage(!!modalOpen || noticeVisible()); }
  function renderModal() {
    var host = el("syncHost");
    if (!host || !modalOpen) { syncScrollLock(); return; }
    host.innerHTML = '<div class="syncBack" id="syncBack"><div class="syncWrap">' + modalHtml() + "</div></div>";
    host.hidden = false;
    wireModal();
    syncScrollLock();
  }
  function wireModal() {
    var back = el("syncBack");
    if (back) back.onclick = function (e) { if (e.target === back) closeModal(); };
    ["syncX", "syncClose2"].forEach(function (id) {
      var b = el(id);
      if (b) b.onclick = closeModal;
    });
    var tIn = el("syncTabIn"), tUp = el("syncTabUp");
    if (tIn) tIn.onclick = function () { modalMode = "in"; renderModal(); };
    if (tUp) tUp.onclick = function () { goSignup(); };
    /* 비밀번호 찾기 → 재설정 화면 · 아이디(이메일) 찾기 → 안내 문구 */
    var info = el("syncInfo");
    function setInfo(msg) { if (info) info.textContent = msg; }
    var fpw = el("syncFindPw");
    if (fpw) fpw.onclick = function () { modalMode = "reset"; renderModal(); };

    /* 입력: 아이디는 탭을 바꿔도 남긴다 · 비밀번호는 눈 아이콘으로 보이기/숨기기 */
    var idIn = el("syncNick");
    if (idIn) idIn.oninput = function () { modalNick = idIn.value || ""; };
    var eye = el("syncEye");
    if (eye) eye.onclick = function () {
      var p = el("syncPw");
      if (!p) return;
      var show = String(p.type || "password") === "password";
      p.type = show ? "text" : "password";
      eye.innerHTML = show ? SVG_EYE_OFF : SVG_EYE;
    };
    /* 소셜 로그인 버튼 (설정에 적은 제공자만 그려진다) */
    if (typeof document !== "undefined" && typeof document.querySelectorAll === "function") {
      document.querySelectorAll("[data-oauth]").forEach(function (b) {
        b.onclick = function () { signInWithProvider(b.getAttribute("data-oauth")); };
      });
    }
    /* 실패하면 다시 그린 뒤(버튼 활성) 에러 문구를 새 DOM 에 넣는다 */
    function after(run) {
      run.then(function (out) {
        if (out && out.ok) { closeModal(); return; }
        if (out && out.reason === "confirm") {
          otpKind = "confirm";
          /* 확인 메일을 보냈다 → 인증번호 6자리 입력 화면으로 (매직링크 대신 코드) */
          modalMode = "otp";
          if (out.email) pendingEmail = out.email;
          renderModal();
          return;
        }
        renderModal();
        var e = el("syncErr"), reason = out && out.reason;
        if (e) e.textContent = msgFor(reason);
      }, function () {
        renderModal();
        var e = el("syncErr");
        if (e) e.textContent = t("sync.netErr");
      });
    }
    var go = el("syncGo");
    if (go) {
      go.onclick = function () {
        var id = (el("syncNick") || {}).value || "";
        var pw = (el("syncPw") || {}).value || "";
        var err = el("syncErr");
        var v = CORE.validateId(id);
        if (err) err.textContent = "";
        if (!v.ok) { if (err) err.textContent = (v.reason === "email") ? t("sync.needEmail") : t("sync.nickBad"); return; }
        if (!CORE.validatePassword(pw).ok) { if (err) err.textContent = t("sync.pwBad"); return; }
        go.disabled = true;
        after(modalMode === "up" ? signUp(id, pw) : signIn(id, pw));
      };
    }
    var otpGo = el("syncOtpGo");
    if (otpGo) {
      otpGo.onclick = function () {
        var err = el("syncErr");
        var tok = (el("syncOtp") || {}).value || "";
        if (err) err.textContent = "";
        if (!/^\d{6}$/.test(String(tok).replace(/[^0-9]/g, ""))) { if (err) err.textContent = t("sync.otpBad"); return; }
        otpGo.disabled = true;
        verifyOtpCode(tok).then(function (out) {
          otpGo.disabled = false;
          if (out && out.ok) { if (out.next === "newpw") { openModal("newpw"); return; } closeModal(); return; }
          var e = el("syncErr");
          if (e) e.textContent = (out && out.reason === "otp") ? t("sync.otpBad") : msgFor(out && out.reason);
        }, function () { otpGo.disabled = false; var e = el("syncErr"); if (e) e.textContent = t("sync.netErr"); });
      };
    }
    var otpResend = el("syncOtpResend");
    if (otpResend) otpResend.onclick = function () {
      var i = el("syncInfo"); if (i) i.textContent = t("sync.statusSyncing");
      resendOtp().then(function (out) {
        var e = el("syncErr"), inf = el("syncInfo");
        if (out && out.ok) { if (e) e.textContent = ""; if (inf) inf.textContent = t("sync.otpSent"); return; }
        if (e) e.textContent = msgFor(out && out.reason);
      }, function () { var e = el("syncErr"); if (e) e.textContent = t("sync.netErr"); });
    };
    var otpBack = el("syncOtpBack");
    if (otpBack) otpBack.onclick = function () { modalMode = otpKind === "recover" ? "reset" : "up"; renderModal(); };
    var resetGo = el("syncResetGo");
    if (resetGo) {
      resetGo.onclick = function () {
        var id = (el("syncReset") || {}).value || "";
        var err = el("syncErr");
        if (err) err.textContent = "";
        resetGo.disabled = true;
        recover(id).then(function (out) {
          resetGo.disabled = false;
          var e = el("syncErr"), i = el("syncInfo");
          if (out && out.ok) {
            /* 메일로 코드가 갔으니 인증번호 화면으로 전환 */
            if (out.email) pendingEmail = out.email;
            otpKind = "recover";
            modalMode = "otp";
            renderModal();
            return;
          }
          if (e) e.textContent = (out && out.reason === "email") ? t("sync.needEmail") : msgFor(out && out.reason);
        }, function () { resetGo.disabled = false; var e = el("syncErr"); if (e) e.textContent = t("sync.netErr"); });
      };
    }
    var newGo = el("syncNewPwGo");
    if (newGo) {
      newGo.onclick = function () {
        var pw = (el("syncPw") || {}).value || "";
        var err = el("syncErr");
        if (err) err.textContent = "";
        if (!CORE.validatePassword(pw).ok) { if (err) err.textContent = t("sync.pwBad"); return; }
        newGo.disabled = true;
        updatePassword(pw).then(function (out) {
          newGo.disabled = false;
          if (out && out.ok) { closeModal(); return; }
          var e = el("syncErr");
          if (e) e.textContent = msgFor(out && out.reason);
        }, function () { newGo.disabled = false; var e = el("syncErr"); if (e) e.textContent = t("sync.netErr"); });
      };
    }
    var outBtn = el("syncOut");
    if (outBtn) outBtn.onclick = function () { signOut(); closeModal(); };
    var now = el("syncNowBtn");
    if (now) now.onclick = function () { syncNow("manual"); closeModal(); };
  }

  var NOTICE_SVG = {

      '<path d="M11 3.6l1.7 4.6 4.6 1.7-4.6 1.7L11 16.2 9.3 11.6 4.7 9.9l4.6-1.7z"/>' +
      '<path d="M18.4 15.6l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg>',
    sync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M7 18a4.6 4.6 0 0 1-.5-9.2A5.6 5.6 0 0 1 17 8.2a4.4 4.4 0 0 1 .6 8.7"/>' +
      '<path d="M12 12.5v7"/><path d="M9.2 16.6L12 13.8l2.8 2.8"/></svg>',
    merge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3.6" width="7.4" height="16.8" rx="1.8"/>' +
      '<rect x="13.2" y="7.2" width="7.8" height="9.6" rx="1.8"/>' +
      '<path d="M8.2 7.4h1"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="5" width="18" height="14" rx="2.4"/>' +
      '<path d="M7.5 9.5h.01M12 9.5h.01M16.5 9.5h.01M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M9 17h6"/></svg>'
  };
  function noticeIco(name) { return NOTICE_SVG[name] || NOTICE_SVG.spark; }
  /* 모던한 'What's new' 시트: 배지 + 제목 + 한 줄 설명 + 아이콘 항목 3개 + 체크박스 + 꽉 찬 버튼
     (문단을 줄줄이 쓰지 않고 훑어보기만 해도 이해되게) */
  function noticeHtml() {
    var N = NOTICE_TEXT[noticeLang()] || NOTICE_TEXT.en;
    var items = (N.items || []).map(function (it) {
      return '<li class="noticeItem"><span class="noticeIco" aria-hidden="true">' + noticeIco(it.icon) + "</span>" +
        '<div class="noticeItemBody"><div class="noticeItemTitle">' + esc(it.title) + "</div>" +
        '<p class="noticeItemText">' + it.text + "</p></div></li>";
    }).join("");
    return '<div class="syncBack" id="noticeBack"><div class="syncWrap noticeWrap">' +
      '<div class="syncCard">' +
      '<button class="syncX" id="noticeX" type="button" aria-label="' + esc(t("sync.close")) + '">' + SVG_X + "</button>" +
      '<div class="noticeBody">' +
      '<div class="noticeBadge" aria-hidden="true">' + noticeIco("spark") + "</div>" +
      '<div class="noticeKicker">' + esc(N.kicker) + "</div>" +
      '<h2 class="noticeTitle">' + esc(N.title) + "</h2>" +
      '<p class="noticeLead">' + N.lead + "</p>" +
      '<ul class="noticeList">' + items + "</ul>" +
      '<p class="noticeTip">' + N.tip + "</p>" +
      "</div>" +
      /* 체크박스·버튼은 창 아래에 고정 — 아주 낮은 화면에서도 버튼이 가려지지 않는다 */
      '<div class="noticeFoot">' +
      '<label class="noticeChk"><input type="checkbox" id="noticeChk"> <span>' + esc(N.hide) + "</span></label>" +
      '<button class="btn primary noticeOkBtn" id="noticeOk" type="button">' + esc(N.ok) + "</button>" +
      "</div></div></div></div>";
  }
  function renderNotice() {
    var host = el("noticeHost");
    if (!host) return;
    if (!noticeShouldShow()) { host.innerHTML = ""; host.hidden = true; syncScrollLock(); return; }
    host.innerHTML = noticeHtml();
    host.hidden = false;
    var back = el("noticeBack");
    if (back) back.onclick = function (e) { if (e.target === back) closeNotice(); };
    var ok = el("noticeOk");
    if (ok) ok.onclick = closeNotice;
    var x = el("noticeX");
    if (x) x.onclick = closeNotice;
    syncScrollLock();
  }
  function closeNotice() {
    var chk = el("noticeChk");
    if (chk && chk.checked) {
      lsSet(LS_NOTICE, JSON.stringify({ hideUntil: CORE.noticeHideUntil(Date.now(), CORE.NOTICE_DAYS) }));
    }
    noticeClosed = true;                 /* 이번 방문에서는 다시 뜨지 않는다 */
    var host = el("noticeHost");
    if (host) { host.innerHTML = ""; host.hidden = true; }
    syncScrollLock();                    /* 배경 스크롤을 다시 풀어 준다 */
  }

  /* ---------- 초기화 ---------- */
  function init() {
    granted = true;
    render();                                   /* 설정이 없어도 한 번 지나가며 계정 칸을 비워 둔다 */
    renderNotice();                             /* 공지: 설정이 없으면 빈 칸으로 둔다 (요청 0) */
    if (!configured) return;                    /* 설정 없음: 리스너도 달지 않는다 */
    catchOAuthReturn();                         /* 소셜 로그인으로 돌아왔으면 로그인 처리 */
    if (typeof document !== "undefined" && document.addEventListener) {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") flush();
        else if (auth) syncNow("visible");
      });
      /* 프로필 메뉴: 바깥 클릭 / Esc 로 닫기 */
      document.addEventListener("click", function (e) {
        try {
          if (!menuOpen || !e || !e.target) return;
          var m = el("acctMenu"), b = el("acctBtn"), t = e.target;
          if (m && (m === t || (m.contains && m.contains(t)))) return;
          if (b && (b === t || (b.contains && b.contains(t)))) return;
          closeAcctMenu();
        } catch (err) { /* ignore */ }
      });
      document.addEventListener("keydown", function (e) { if (e && e.key === "Escape") closeAcctMenu(); });
    }
    if (typeof window.addEventListener === "function") {
      window.addEventListener("pagehide", function () { flush(); });
      window.addEventListener("online", function () { if (auth) syncNow("online"); });
      window.addEventListener("offline", function () { setStatus("error", t("sync.statusError")); });
    }
    render();
    if (auth) syncNow("boot");
  }
  function setStrings(obj) {
    if (obj && typeof obj === "object") {
      STR = STR || {};
      Object.keys(obj).forEach(function (k) { STR[k] = obj[k]; });
    }
    render();
    renderModal();
  }

  /* ---------- 서버 콘텐츠 부팅 (배포본 전용) ----------
     sync.js 가 페이지 스크립트(app.js/glossary.js)보다 먼저 실행되므로 여기서 __GATED__ 를
     세워 페이지가 스스로 부팅하지 않게 하고, 로그인 여부에 따라 콘텐츠를 받아 부팅한다. */
  function bootPage() {
    try {
      if (typeof window.__bootApp === "function") { window.__bootApp(); return; }
      if (typeof window.__bootGlossary === "function") window.__bootGlossary();
    } catch (e) { /* ignore */ }
  }
  function contentBoot() {
    function go() {
      if (auth) {
        loadContent().then(function (out) {
          if (out && out.ok) contentApplied();
          bootPage();
        }, function () { bootPage(); });
      } else {
        bootPage();       /* 로그인 전: 카탈로그 + 로그인 UI 만 (문제 데이터 0바이트) */
      }
    }
    if (typeof document !== "undefined" && document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", go);
    } else { go(); }
  }
  if (CONTENT_SERVER && !window.__ENC_PAYLOAD__) {
    window.__GATED__ = true;        /* 콘텐츠 게이트가 부팅을 맡는다 (비밀번호 게이트가 없을 때) */
    contentBoot();
  }

  window.__sync = {
    init: init,
    setStrings: setStrings,
    render: render,
    configured: function () { return configured; },
    signedIn: function () { return !!auth; },
    user: function () { return auth ? { nick: auth.nick, user_id: auth.user_id } : null; },
    status: function () { return status; },
    statusText: statusText,
    signIn: signIn,
    signUp: signUp,
    verifyOtp: verifyOtpCode,
    resendOtp: resendOtp,
    signOut: signOut,
    recover: recover,
    updatePassword: updatePassword,
    loadContent: loadContent,
    syncNow: syncNow,
    flush: flush,
    onLocalChange: onLocalChange,
    resetRemote: resetRemote,
    openModal: openModal,
    closeModal: closeModal,
    goSignup: goSignup,
    closeNotice: closeNotice,
    /* 소셜 로그인 (설정에 적은 제공자만 노출) */
    oauthProviders: oauthList,
    oauthUrl: oauthUrl,
    signInWithProvider: signInWithProvider,
    /* 테스트용 내부 노출 */
    _pull: pull,
    _push: push,
    _localPayload: localPayload,
    _readLocalStore: readLocalStore,
    _writeLocalStore: writeLocalStore,
    _auth: function () { return auth; },
    _setAuth: function (a) { saveAuth(a); },
    _signupUrl: function () { return SIGNUP_URL; },
    _goSignup: goSignup,
    _noticeShouldShow: noticeShouldShow,
    _noticeHtml: noticeHtml,
    _modalHtml: modalHtml,
    _acctMenuHtml: acctMenuHtml,
    _toggleAcctMenu: toggleAcctMenu,
    _parsePairs: parsePairs,
    _jwtPayload: jwtPayload,
    _sessionFromOAuth: sessionFromOAuth,
    _catchOAuthReturn: catchOAuthReturn,
    _verifyOtp: verifyOtpCode,
    _resendOtp: resendOtp,
    _pendingEmail: function () { return pendingEmail; },
    _setPendingEmail: function (v) { pendingEmail = String(v || ""); },
    _otpKind: function () { return otpKind; },
    _setOtpKind: function (v) { otpKind = (v === "recover") ? "recover" : "confirm"; },
    _keys: { AUTH: LS_AUTH, OWNER: LS_OWNER, NOTICE: LS_NOTICE, TABLE: TABLE }
  };
})();

<script id="app-logic">
/* ===== app.js — 시험 대비 문제 앱 (vanilla JS, DOM) ===== */
(function () {
  "use strict";
  /* 데이터는 '부팅 시점'에 읽는다.
     비밀번호 게이트가 켜져 있으면 이 스크립트가 실행될 때는 아직 복호화 전(null)이고,
     게이트가 복호화를 마친 뒤 window.__bootApp() 을 호출한다. */
  let DATA = null, MOCKS = null, META = null, FULL = [], ALL = [];
  function resolveData() {
    const idsSelected = COURSE_ID === "ids" ||
      String((window.location && window.location.hash) || "").toLowerCase().indexOf("introductiontodatascience") !== -1;
    DATA = idsSelected ? (window.__IDS_QUESTION_DATA__ || null) : (window.__QUESTION_DATA__ || null);
    MOCKS = window.__MOCK_DATA__ || null;
    META = (DATA && DATA.meta) || {};
    FULL = (DATA && DATA.questions) || [];     /* 전체 문제은행 (범위 필터 없음) */
    refreshPool();                             /* ALL = 지금 단원(범위)의 문항만 */
  }
  /* ---------- 시험 범위(스코프): 이론1 = 강의 1–6 + NumPy · 이론2 = 강의 7 이상 ----------
     curriculum.js sections[].scope 로 정해지고 문제·모의고사·오답·랜덤이 이 범위로 필터된다.
     문항마다 lecture 태그가 있어 데이터를 옮기지 않고도 범위를 나눌 수 있다. */
  function lectureNo(l) {
    const m = /^Lecture (\d+)$/.exec(l || "");
    return m ? parseInt(m[1], 10) : 0;
  }
  function scopeOfQuestion(q) {
    if (q && q.course === "ids") return q.scope || "all";
    return lectureNo(q && q.lecture) >= 7 ? "t2" : "t1";
  }
  function sectionScope() {
    const s = sectionById(activeSectionId());
    return (s && s.scope) || "t1";
  }
  function scopedQuestions(scope) {
    const sc = scope || sectionScope();
    if (sc === "all") return FULL.slice();
    return FULL.filter(function (q) { return scopeOfQuestion(q) === sc; });
  }
  function refreshPool() { ALL = scopedQuestions(); }
  function scopedMocks() {
    if (currentCourse().course.id === "ids") return [];
    const sc = sectionScope();
    return MOCKS ? MOCKS.mocks.filter(function (m) { return (m.scope || "t1") === sc; }) : [];
  }
  /* 지금 단원의 모의고사 형식 — 없으면 데이터 기본값(이론 테스트 1: 15문항/45분/통과 7) */
  function sectionExam() {
    const s = sectionById(activeSectionId());
    if (s && s.exam) return s.exam;
    return { questions: META.exam_questions || 15, minutes: META.exam_minutes || 45,
             pass: META.exam_pass || 7, numpy: (MOCKS && MOCKS.meta.numpy_per_mock) || 6 };
  }
  function idsExamShortAnswers(scope) {
    if (currentCourse().course.id !== "ids" || !window.__IDS_SHORT_ANSWERS__) return [];
    return window.__IDS_SHORT_ANSWERS__.filter(function (x) {
      return scope === "all" || x.id.indexOf("T" + String(scope).slice(1) + "-") === 0;
    });
  }
  const LS_KEY = "dnd_tt1_v1";
  const LS_TIMER = "dnd_tt1_timer";     /* 타이머 끄기 설정 (이 브라우저에 저장) */
  const GLOSSARY_COUNT = 411;   /* glossary.json 의 용어 수 (테스트가 일치 여부를 검사) */
  const app = document.getElementById("app");

  /* ---------- 타이머 켜기/끄기 설정 ---------- */
  function timerOffPref() {
    try { return localStorage.getItem(LS_TIMER) === "off"; } catch (e) { return false; }
  }
  function setTimerOffPref(v) {
    try { localStorage.setItem(LS_TIMER, v ? "off" : "on"); } catch (e) { /* ignore */ }
  }

  /* ---------- 저장소 ---------- */
  let store = loadStore();
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s && typeof s === "object") {
        return { history: s.history || [], wrong: s.wrong || {}, best: s.best || 0,
                 mockBest: s.mockBest || {}, randBest: s.randBest || s.rand10Best || 0,
                 randCount: s.randCount || 0 };
      }
    } catch (e) { /* ignore */ }
    return { history: [], wrong: {}, best: 0, mockBest: {}, randBest: 0, randCount: 0 };
  }
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
    notifySync();
  }
  /* 기록이 바뀌면 (로그인 상태일 때만) 클라우드 동기화에 알린다 — sync.js 가 3초 디바운스 */
  function notifySync() {
    try { if (window.__sync) window.__sync.onLocalChange(); } catch (e) { /* ignore */ }
  }
  function syncNow() {
    try { if (window.__sync) window.__sync.syncNow("app"); } catch (e) { /* ignore */ }
  }
  /* 초기화: 로컬뿐 아니라 서버 사본도 비운다 (scope = "v1" | "vocab") */
  function resetRemote(scope) {
    try { if (window.__sync) window.__sync.resetRemote(scope); } catch (e) { /* ignore */ }
  }

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function el(id) { return document.getElementById(id); }
  function byLecture(list) {
    const m = {};
    list.forEach(function (q) { m[q.lecture] = (m[q.lecture] || 0) + 1; });
    return m;
  }
  /* 현재 언어의 문항 텍스트 */
  function qf(q, field) { return questionField(q, field); }
  /* 모의고사 이름 (영어 이름이 있으면 사용) */
  function mockLabel(m) {
    let lbl = (LANG === "en" && m.label_en) ? m.label_en : m.label;
    lbl = lbl.replace(/⭐\s*/g, "");                 /* 별 이모지 제거 */
    lbl = lbl.replace(/\s*—\s*\d+ questions/g, "");  /* 영어 " — 49 questions" 제거 */
    lbl = lbl.replace(/\s*\(\d+문항\)/g, "");         /* 한국어 "(49문항)" 제거 */
    return lbl;
}
  /* 좁은 화면(모바일) 여부 — 테스트 스텁에서는 false */
  function isNarrow() {
    try {
      if (typeof window !== "undefined" && window.matchMedia) {
        return window.matchMedia("(max-width:860px)").matches;
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  /* ---------- 상태 ---------- */
  let S = null;          // 현재 세션
  let timerId = null;

  /* 진행 중 세션의 짧은 breadcrumb — 상단 바가 길어져 내비게이션이 밀리지 않도록 */
  function crumbFor(cfg) {
    if (cfg.mode === "mock" && cfg.mockId && MOCKS) {
      const m = MOCKS.mocks.filter(function (x) { return x.id === cfg.mockId; })[0];
      if (m) return mockLabel(m);
    }
    const e = I18N["mode." + cfg.mode];
    const base = e ? (e[LANG] || e.ko) : cfg.label;
    if (cfg.detailKey) return base + " · " + tf(cfg.detailKey, cfg.detailArg);
    if (cfg.detail) return base + " · " + cfg.detail;
    return base;
  }

  function newSession(questions, cfg) {
    const qs = buildSession(questions, cfg);
    /* 타이머 끄기 설정이 켜져 있으면 모의고사·실전 모드도 시간 제한 없이 진행한다 */
    const timed = (cfg.timed !== false) && !timerOffPref();
    S = {
      cfg: cfg,
      questions: qs,
      answers: {},
      revealed: {},
      flags: {},
      bookmarks: {},
      visited: {},
      cur: 0,
      startAt: Date.now(),
      timed: timed,
      remain: timed ? cfg.minutes * 60 : 0,
      elapsed: 0,
      submitted: false,
      section: "A",
      shortCur: 0,
      shortAnswers: cfg.shortAnswers || [],
      shortResponses: {},
      results: null,
      total: 0,
      pass: passLine(qs.length, META, cfg.mode === "exam" || cfg.mode === "mock")
    };
    qs.forEach(function (q) { S.answers[q.sid] = []; });
    setCrumb(crumbFor(cfg));
    startTimer();
  }

  function setCrumb(text) {
    const el2 = document.getElementById("crumbCur");
    if (el2) el2.textContent = text;
  }

  /* 현재 화면 종류를 body 클래스로 표시 (모바일 고정 바 여백 계산용) */
  function setView(v) {
    const b = document.body;
    if (!b) return;
    const cls = String(b.className || "").replace(/\s*view-\w+/g, "");
    b.className = (cls + " view-" + v).replace(/^\s+/, "");
  }

  /* Overview 통계 */
  function stats() {
    const n = S.questions.length;
    let visited = 0, answered = 0, marked = 0, book = 0;
    S.questions.forEach(function (q) {
      if (S.visited[q.sid]) visited++;
      if (S.answers[q.sid] && S.answers[q.sid].length) answered++;
      if (S.flags[q.sid]) marked++;
      if (S.bookmarks[q.sid]) book++;
    });
    return {
      total: n, visited: visited, notVisited: n - visited,
      answered: answered, notAnswered: visited - answered,
      marked: marked, book: book
    };
  }

  /* 시험 중 '타이머 끄기/켜기' — 설정은 브라우저에 저장되어 다음에도 유지된다 */
  function toggleTimer() {
    const off = timerOffPref();
    setTimerOffPref(!off);
    if (S) {
      if (!off) {
        /* 끄기: 남은 시간을 경과 시간으로 환산하고 카운트다운 중단 */
        const total = (S.cfg.minutes || META.exam_minutes) * 60;
        S.elapsed = S.timed ? Math.max(0, total - S.remain) : S.elapsed;
        S.timed = false;
        S.remain = 0;
      } else {
        /* 켜기: 카운트다운 재개 (모의고사는 설정된 시간, 연습은 60분) */
        S.timed = true;
        S.remain = (S.cfg.minutes || (S.cfg.mode === "mock" ? META.exam_minutes : 60)) * 60;
      }
      if (timerId) { clearInterval(timerId); timerId = null; }
      startTimer();
      renderQuiz();
    } else {
      renderView();
    }
  }

  function startTimer() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function () {
      if (!S || S.submitted) return;
      if (S.timed) {
        S.remain--;
        paintTimers();
        if (S.remain <= 0) { clearInterval(timerId); submit(true); }
      } else {
        /* 연습 모드: 제한 없음 → 경과 시간만 올라간다 (자동 제출 없음) */
        S.elapsed++;
        paintTimers();
      }
    }, 1000);
  }

  /* 데스크톱 우측 타이머 + 모바일 상단 타이머를 함께 갱신 */
  function timerClass() {
    if (!S.timed) return "timer free";
    return "timer" + (S.remain <= 60 ? " danger" : S.remain <= 300 ? " warn" : "");
  }
  function paintTimers() {
    const cls = timerClass();
    const text = S.timed ? formatClock(S.remain) : formatClock(S.elapsed);
    const t = el("timer");
    if (t) { t.textContent = text; t.className = cls; }
    document.querySelectorAll("[data-timer]").forEach(function (m) {

  /* ---------- 시험 캘린더 탭 ----------
     일정 데이터는 curriculum.js 의 course.schedule(교수님 평가 안내 PDF 기준).
     오늘과 비교해 D-day·지남 상태를 계산해 보여 준다. */
  function calParse(s) {
    if (!s) return null;
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function calDayStart(d) { const x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function calDaysUntil(d, now) { return Math.round((calDayStart(d) - calDayStart(now)) / 86400000); }
  /* 상태: 지남=done · 하루 일정 당일=today · 기간 진행 중=ongoing · 지각 제출 구간=late · 예정=up(+남은 날)
     · span(기간) 항목은 until 까지, late(최종 마감)가 있으면 그때까지 '지각 제출' 구간으로 본다. */
  function calStatus(it, now) {
    const d = calParse(it.at);
    if (!d) return { s: "up", days: 0 };
    const end = it.span ? calParse(it.until)
      : (it.late ? calParse(it.late) : new Date(d.getTime() + 3 * 3600000));
    if (end && now > end) return { s: "done", days: 0 };
    if (now >= d) {
      if (it.late) return { s: "late", days: 0 };
      return { s: it.span ? "ongoing" : "today", days: 0 };
    }
    return { s: "up", days: calDaysUntil(d, now) };
  }

    if (st.s === "today") return t("cal.today");

    if (st.s === "late") return t("cal.late");
    if (st.s === "done") return t("cal.done");
    return st.days <= 0 ? t("cal.dday0") : tf("cal.dday", st.days);

  /* '11월 5일 (목) 17:45' · 기간 일정이면 '12월 14일 – 1월 29일' */
  function fmtCalWhen(it) {
    const loc = LANG === "en" ? "en-US" : "ko-KR";
    const d = calParse(it.at);
    if (!d) return "";
    const day = function (x) { return x.toLocaleDateString(loc, { month: "short", day: "numeric" }); };
    if (it.span && it.until) {
      const u = calParse(it.until);
      return day(d) + " – " + (u ? day(u) : "");
    }
    const md = (d.getHours() || d.getMinutes())
      ? " " + d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit", hour12: false }) : "";
    return day(d) + " (" + d.toLocaleDateString(loc, { weekday: "short" }) + ")" + md;
  }
  function courseCalendarHtml(c) {
    const items = (c && c.schedule) || [];
    if (!items.length) return '<div class="cdEmpty"><b>' + esc(t("cal.empty")) + "</b></div>";

      return String(a.at || "").localeCompare(String(b.at || ""));

    const now = new Date();
    let next = null;
    displayItems.forEach(function (it) {
      if (next) return;
      const st = calStatus(it, now);
      if (st.s !== "done") next = { it: it, st: st };

    const banner = next
      ? '<div class="calNext"><span class="calNextTag">' + esc(t("cal.next")) + '</span>' +
        '<b class="calNextName">' + esc(label(next.it.name)) + '</b>' +

        '<span class="calNextDay">' + esc(calDayText(next.st)) + "</span></div>"
      : "";
    const rows = displayItems.map(function (it) {
      const st = calStatus(it, now);
      const bits = it.kind === "lecture" || it.kind === "break"

    cert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="12" rx="2"/><path d="M9 20l3-2 3 2v-4H9z"/></svg>',
    caret: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'

  let DASH_WEEK = 0;
  let DASH_YEAR = (new Date()).getFullYear();
  function dashDateKey(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function dashHistoryByDay() {
    const map = {};
    (store.history || []).forEach(function (h) {
      const d = new Date(h.at || h.time || 0);
      if (isNaN(d.getTime())) return;
      const k = dashDateKey(d);
      map[k] = (map[k] || 0) + 1;
    });
    return map;
  }
  function dashDays() {
    const times = (store.history || []).map(function (h) { return new Date(h.at || 0).getTime(); })
      .filter(function (t) { return isFinite(t) && t > 0; });
    if (!times.length) return 1;
    return Math.max(1, Math.floor((Date.now() - Math.min.apply(null, times)) / 86400000) + 1);
  }
  function dashWeekNo(d) {
    const start = new Date(d.getFullYear(), 0, 1);
    return Math.floor(Math.floor((d - start) / 86400000) / 7) + 1;
  }
  function dashMetric(icon, value, label) {
    return '<span class="dashMetric">' + icon + '<span class="dashMetricCol">' +
      (label ? "<em>" + esc(label) + "</em>" : "") + "<b>" + esc(String(value)) + "</b></span></span>";
  }
  /* 카드 제목 줄: 왼쪽 제목(＋기어) · 오른쪽 링크/내비 */

  function dashRecentHtml() {
    const hs = (store.history || []).slice().sort(function (a, b) {
