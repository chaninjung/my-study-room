<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<!-- 한글 UI 폰트: Pretendard(주), 실패하면 Noto Sans KR / 시스템 폰트로 자동 대체.
     Noto Sans KR 을 주 폰트로 쓰려면 아래 preload 한 줄을 Google Fonts 링크로 바꾸고
     theme.css 의 font-family 첫 항목을 "Noto Sans KR" 로 바꾸면 됩니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<meta name="description" content="Deep Network Development 2026 Autumn - Theory Test 1 vocabulary and key sentences">
<title>My Study Room — 용어집 / Glossary</title>
<style>/* ==========================================================================
   theme.css — 공용 디자인 시스템 (문제 앱 / 용어집 / 인쇄 페이지 공통)
   폰트: Pretendard Variable (CDN, 비동기) → Noto Sans KR → 시스템 폰트
   원칙: 중립 그레이 + 단일 액센트(navy) · 8px 라운드 · 미세한 그림자 · 그라디언트 없음
   ========================================================================== */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --surface-3:#f2f4f7;
  --border:#e4e7ec;
  --border-2:#d0d5dd;
  --text:#101828;
  --text-2:#475467;
  --text-3:#667085;
  --text-4:#98a2b3;
  --primary:#1d3a8f;
  --primary-hover:#16306f;
  --primary-soft:#eef2fd;
  --primary-border:#c7d4f5;
  --link:#175cd3;
  --ok:#087443;      --ok-bg:#ecfdf3;   --ok-border:#a6e5c0;
  --warn:#b54708;    --warn-bg:#fffaeb; --warn-border:#f3d99b;
  --bad:#b42318;     --bad-bg:#fef3f2;  --bad-border:#f3bdb8;
  --purple:#5925dc;  --purple-bg:#f4f0ff; --purple-border:#cdbcf7;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 2px 4px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);
  --r-sm:6px; --r-md:8px; --r-lg:10px;
  --focus:0 0 0 3px rgba(29,58,143,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    "Noto Sans KR","Apple SD Gothic Neo","Segoe UI","Malgun Gothic",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{letter-spacing:-.02em;margin:0}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* 한글은 단어 중간에서 줄바꿈되지 않게 (긴 영문·코드는 필요할 때만 분리) */
.qText,.opt,.opt span,.expl,.prompt,.rBody,.sent,.card,.note,td,th{
  word-break:keep-all;overflow-wrap:anywhere}
/* 좁은 flex 행에서는 글자가 한 글자씩 쪼개지지 않도록 (min-content 를 단어 단위로 유지) */
.rowGrid,.rowGrid .name,.rowGrid .muted,.mockRow,.mockRow .name,.mockRow .meta,.mockRow .best,
.stat > div,.legend div,.ovRow,.sbItem,.sbCourseHead,.scoreChip{
  word-break:keep-all;overflow-wrap:normal;min-width:0}
/* 그리드/플렉스 자식이 강제로 넘치지 않도록 */
.panel,main,.side,.examWrap > *{min-width:0}
.mono,.timer,.scoreNum,.stat b,.legend b,.ovRow span,table.grid td{font-variant-numeric:tabular-nums}

/* ===================== 버튼 ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:13.5px;font-weight:600;line-height:1;height:38px;padding:0 14px;
  border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--border-2);background:#fff;color:var(--text);
  box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s,box-shadow .15s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:#b9c0cc}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:0;box-shadow:var(--focus)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.wide{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

/* ===================== 상단 바 / 언어 토글 =====================
   상단 바는 '화면이 바뀌어도 위치가 변하지 않도록' 고정한다:
   - flex-wrap:nowrap  → 줄바꿈으로 내비게이션이 밀리지 않음
   - 오른쪽 항목(langBox/linkish)은 flex:0 0 auto 로 절대 줄어들지 않음
   - breadcrumb 만 줄어들고 말줄임(…) 처리됨                                   */
.topbar{background:#fff;border-bottom:1px solid var(--border);min-height:60px;display:flex;align-items:center;
  padding:10px 20px;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:nowrap;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text);
  min-width:0;flex:0 1 auto;overflow:hidden}
.crumbs .sep{color:var(--text-4);font-weight:400}
.crumbs .cur{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .grow{flex:1 1 auto}
.topbar .langBox,.topbar .linkish{flex:0 0 auto;white-space:nowrap}
.linkish{color:var(--text-2);font-size:13.5px;font-weight:600;cursor:pointer;background:none;border:0;
  padding:6px 2px;font-family:inherit;transition:color .15s}
.linkish:hover{color:var(--primary);text-decoration:none}
.linkish.on{color:var(--primary)}
.langBox{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;
  background:#fff;box-shadow:var(--shadow-xs)}
.langBtn{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border:0;background:#fff;
  color:var(--text-3);cursor:pointer;transition:background .15s,color .15s}
.langBtn + .langBtn{border-left:1px solid var(--border)}
.langBtn:hover{background:var(--surface-2)}
.langBtn.on{background:var(--primary);color:#fff}

/* ===================== 레이아웃 / 패널 ===================== */
.wrap{max-width:1360px;margin:0 auto;padding:20px 20px 48px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panelHead{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;
  color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panelHead .grow{flex:1}
.panelBody{padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterRow{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--text-3);font-size:13px}

/* ===================== 배지 / 칩 ===================== */
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--surface-3);border:1px solid var(--border);color:var(--text-2);margin-right:6px;white-space:nowrap;line-height:1.7}
.tag.num{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.tag.lec{background:var(--primary-soft);border-color:var(--primary-border);color:var(--primary)}
.tag.AC{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:99px;
  padding:6px 12px;font-size:13px;color:var(--text-2);background:#fff;cursor:pointer;
  transition:border-color .15s,background .15s}
.fchip:hover{border-color:var(--border-2);background:var(--surface-2)}
.fchip input{margin:0}

/* ===================== 표 ===================== */
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.grid th,table.grid td{border-bottom:1px solid var(--surface-3);padding:10px 14px;text-align:left;vertical-align:top}
table.grid th{color:var(--text-3);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--surface-2)}
table.grid tbody tr:hover{background:#fcfcfd}
table.grid tr:last-child td{border-bottom:0}

/* ===================== 비밀번호 게이트 (선택 기능) ===================== */
.gateWrap{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;
  justify-content:center;padding:20px}
.gateWrap[hidden]{display:none}
.gateCard{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);
  width:100%;max-width:400px;padding:26px 24px}
.gateBadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-border);
  border-radius:99px;padding:2px 9px;margin-bottom:12px}
.gateTitle{font-size:17px;font-weight:700;margin:0 0 8px}
.gateSub{font-size:13px;color:var(--text-3);line-height:1.65;margin:0 0 18px}
.gateErr{color:var(--bad);font-size:13px;margin:0 0 10px}
.gateInput{width:100%;height:42px;font-family:inherit;font-size:15px;padding:0 12px;color:var(--text);
  border:1px solid var(--border-2);border-radius:var(--r-sm);margin-bottom:12px;background:#fff}
.gateInput:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
.gateChk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);
  margin:0 0 16px;line-height:1.5;cursor:pointer}
.gateChk input{margin-top:2px}
.gateFoot{font-size:11.5px;color:var(--text-4);line-height:1.6;margin-top:14px}
body.gate-locked{overflow:hidden}

/* ===================== 기타 공통 ===================== */
.note{font-size:12.5px;color:var(--text-3);padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.stat{display:flex;gap:28px;flex-wrap:wrap}
.stat > div{font-size:12.5px;color:var(--text-3)}
.stat > div b{display:block;font-size:19px;color:var(--text);margin-top:2px}
.expl{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:12px 14px;margin-top:12px;font-size:13.5px;
  color:var(--text-2);white-space:pre-wrap}
.revealHint{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:12.5px;color:var(--text-3);white-space:normal}
.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary)}
/* 검색 입력 (문제은행 / 용어집 공용) */
.search{width:100%;max-width:380px;height:38px;font-family:inherit;font-size:14px;padding:0 12px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);background:#fff;color:var(--text);
  transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--text-4)}
.search:focus{outline:0;border-color:var(--primary);box-shadow:var(--focus)}
footer{color:var(--text-4);font-size:12px;text-align:center;padding:26px 0 8px}
</style>
<style>/* ==========================================================================
   shell.css — 앱 프레임 (왼쪽 사이드바: 학기 → 과목 → 섹션 + 본문)
   ========================================================================== */
.shell{display:flex;align-items:stretch;min-height:100vh}

/* ---------- 사이드바 ---------- */
.sidebar{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.sbBrand{padding:14px 14px;border-bottom:1px solid var(--border)}
.sbBrand a{display:block;font-size:14.5px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.sbBrand a:hover{text-decoration:none;color:var(--primary)}
.sbBrandSub{margin-top:3px;font-size:11.5px;color:var(--text-3);line-height:1.5}
.sbNav{flex:1;padding:8px 8px 16px}
.sbSem{margin-bottom:6px}
.sbSemHead{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;background:none;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;border-radius:var(--r-sm);text-align:left}
.sbSemHead:hover{background:var(--surface-2);color:var(--text-2)}
.sbSemHead .chev{width:0;height:0;flex:0 0 auto;border-left:4px solid currentColor;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
.sbSemHead.open .chev{transform:rotate(90deg) translateX(1px)}
.sbSemSub{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-4);letter-spacing:0;text-transform:none}
.sbCourse{margin:2px 0 10px}
.sbCourseHead{padding:6px 10px;font-size:13.5px;font-weight:700;color:var(--text)}
.sbCourseSub{padding:0 10px 8px;font-size:11.5px;color:var(--text-4);line-height:1.5}
.sbItems{display:flex;flex-direction:column;gap:1px}
.sbItem{display:block;width:100%;text-align:left;padding:7px 8px 7px 14px;border:0;border-left:2px solid transparent;
  background:none;font-family:inherit;font-size:13px;color:var(--text-2);cursor:pointer;border-radius:0 var(--r-sm) var(--r-sm) 0;
  transition:background .15s,color .15s,border-color .15s}
.sbItem:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.sbItem.on{background:var(--primary-soft);color:var(--primary);font-weight:700;border-left-color:var(--primary)}
.sbSoon{padding:8px 12px 12px;font-size:12px;color:var(--text-4);line-height:1.6;
  border-left:2px dashed var(--border-2);margin-left:10px}
.sbFoot{padding:12px 14px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.sbFootTitle{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.sbProgress{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-3)}
.sbProgress div{display:flex}
.sbProgress b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
.sbBackdrop{display:none}

/* ---------- 본문 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- 메뉴(햄버거) 버튼 ---------- */
.sbToggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);background:#fff;cursor:pointer;box-shadow:var(--shadow-xs)}
.sbToggle:hover{background:var(--surface-2)}
.burger{position:relative;display:block;width:16px;height:2px;background:var(--text-2);border-radius:1px}
.burger::before,.burger::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--text-2);border-radius:1px}
.burger::before{top:-5px}
.burger::after{top:5px}

/* ---------- 응시/결과 화면에서는 사이드바 숨김 (집중 모드) ---------- */
body.view-quiz .sidebar,body.view-result .sidebar{display:none}
body.view-quiz .sbToggle,body.view-result .sbToggle{display:none!important}

/* ---------- 태블릿 이하: 사이드바를 드로어로 ---------- */
@media (max-width:1024px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100%;width:264px;flex-basis:264px;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
  body.sb-open .sidebar{transform:translateX(0)}
  .sbBackdrop{display:block;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:35;
    opacity:0;pointer-events:none;transition:opacity .22s}
  body.sb-open .sbBackdrop{opacity:1;pointer-events:auto}
  .sbToggle{display:inline-flex}
  .sbFoot{display:none}
}
@media (max-width:560px){
  .sidebar{width:86vw;flex-basis:86vw}
  .sbBrand{padding:14px 14px}
  .sbNav{padding:8px 8px 16px}
}
</style>
<style>/* ==========================================================================
   glossary.css — 용어집 전용 (탭 / 검색 / 단어표 / 플래시카드 / 핵심 문장)
   ========================================================================== */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font-family:inherit;font-size:13.5px;font-weight:600;height:38px;padding:0 16px;border:1px solid var(--border-2);
  background:#fff;color:var(--text-2);border-radius:var(--r-sm);cursor:pointer;box-shadow:var(--shadow-xs);
  transition:background .15s,border-color .15s,color .15s}
.tab:hover{background:var(--surface-2);border-color:#b9c0cc}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------- 단어 표 ---------- */
table.grid th{position:sticky;top:61px;z-index:5}
.term{font-weight:700;color:var(--primary);white-space:nowrap}
.ko{color:var(--text);white-space:nowrap}
.def{color:var(--text-2)}
tbody td[data-w]{cursor:pointer}
tbody td[data-w]:hover{text-decoration:underline;text-underline-offset:2px}
/* 출처(수업) 배지 — 어느 과목에서 나온 단어인지 */
.tag.course{background:#eef4fc;border-color:#a9c6e8;color:#1f4e86}

/* ---------- 필터 라벨 ---------- */
.filterLabel{margin:12px 0 6px;font-size:12px;font-weight:700;color:var(--text-3);
  letter-spacing:.02em;text-transform:uppercase}

/* ---------- 플래시카드 ---------- */
.cardBox{padding:24px 16px}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;
  cursor:pointer;text-align:center;transition:border-color .15s,box-shadow .15s,background .15s}
.card:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm);background:#fff}
.card .word{font-size:30px;font-weight:700;color:var(--primary);word-break:break-word;letter-spacing:-.02em}
.cardMeta{display:flex;gap:6px;align-items:center;justify-content:center}
.card .back{font-size:19px;font-weight:600;color:var(--text)}
.card .backEn{font-size:14px;color:var(--text-2);max-width:660px}
.card .hint{font-size:12.5px;color:var(--text-4)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.btn.ok:hover{background:#dff7e8}
.btn.no{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad)}
.btn.no:hover{background:#fde7e5}

/* ---------- 핵심 문장 ---------- */
.sent{border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;
  background:#fff;transition:border-color .15s,box-shadow .15s}
.sent:hover{border-color:var(--border-2);box-shadow:var(--shadow-xs)}
.sent .en{font-weight:700;color:var(--primary);font-size:14.5px;line-height:1.65}
.sent .koSent{color:var(--text-2);margin-top:6px}

/* ==========================================================================
   반응형 — 태블릿 / 폰(세로·가로)
   ========================================================================== */
@media (max-width:1040px){
  table.grid th{position:static}
}
@media (max-width:860px){
  .wrap{padding:16px 14px 44px}
  .topbar{position:static;box-shadow:none}
  .tab{flex:1 1 auto;min-width:0;padding:0 12px}
  .search{max-width:none}
  .cardBox{padding:16px 12px}
  .card{min-height:180px;padding:20px 16px}
  .card .word{font-size:26px}
  .sent{padding:12px 14px}
  .panelHead{padding:10px 14px}
  .filterRow{padding:12px 14px}
}
@media (max-width:700px){
  /* 단어 표 → 카드형 목록 (가로 스크롤 없이 읽기) */
  table.grid.responsive thead{display:none}
  table.grid.responsive,table.grid.responsive tbody,
  table.grid.responsive tr,table.grid.responsive td{display:block;width:100%}
  table.grid.responsive tr{border-bottom:1px solid var(--border);padding:11px 14px}
  table.grid.responsive tr:hover{background:var(--surface-2)}
  table.grid.responsive td{border:0;padding:0}
  table.grid.responsive .term{font-size:14.5px;white-space:normal}
  table.grid.responsive .ko{font-size:13.5px;font-weight:600;white-space:normal;margin-top:1px}
  table.grid.responsive .def{font-size:12.5px;color:var(--text-3);margin-top:3px}
  table.grid.responsive td:last-child{margin-top:6px}
  .card .word{font-size:22px}
  .stat{gap:18px}
  .tabs{gap:4px}
  .tab{padding:0 10px;font-size:13px}
}
@media (max-width:560px){
  .wrap{padding:12px 10px 40px}
  .appName,.crumbs .sep{display:none}
  .panelBody{padding:12px}
  .card{padding:18px 12px;min-height:160px}
  .card .word{font-size:20px}
  .card .back{font-size:17px}
  .sent .en{font-size:13.5px}
  .stat{gap:14px}
  .stat > div b{font-size:17px}
}
@media (max-height:560px) and (orientation:landscape){
  .card{min-height:150px}
  .wrap{padding:12px 14px 32px}
}

@media print{
  body{background:#fff}
  .topbar,.tabs,.search,.filterRow,.btn,.langBox{display:none!important}
  .panel{box-shadow:none;border-color:#c8ccd4}
  table.grid th{position:static}
}
</style>

<div class="wrap">
  <div class="tabs">

  </div>

  <section id="sec-list">
    <div class="panel">

        <div class="filterRow" id="courseChips"></div>
        <div class="filterLabel" id="lecLabel">강의</div>
        <div class="filterRow" id="lecChips"></div>
      </div>

        <tbody id="tbody"></tbody>
      </table>
      <div class="note" id="listNote"></div>
    </div>
  </section>

  <section id="sec-card" hidden>
    <div class="panel">
      <div class="panelHead"><span id="cardTitle">플래시카드</span><span class="grow"></span><span class="muted" id="cardCount"></span></div>
      <div class="cardBox">
        <div class="card" id="card">
          <div class="word" id="cardWord">—</div>
          <div class="cardMeta" id="cardMeta"></div>
          <div class="back" id="cardBack" hidden></div>
          <div class="backEn" id="cardBackEn" hidden></div>
          <div class="hint" id="cardHint">카드를 클릭하면 뜻이 보입니다</div>
        </div>
      </div>
      <div class="panelBody">
        <div class="row">
          <button class="btn primary" id="btnFlip" type="button">뒤집기 (Space)</button>
          <button class="btn ok" id="btnKnow" type="button">알아요</button>
          <button class="btn no" id="btnDunno" type="button">몰라요</button>
          <button class="btn" id="btnNext" type="button">다음 (&rarr;)</button>
          <span class="grow"></span>
          <button class="btn" id="btnShuffle" type="button">섞기</button>
          <button class="btn" id="btnOnlyUnknown" type="button">모르는 단어만</button>
          <button class="btn" id="btnResetCards" type="button">진행 초기화</button>
        </div>
        <div class="stat" style="margin-top:14px">

          <div><span id="statProgressLabel">진행률</span><b id="statProgress">0%</b></div>
        </div>
        <div class="muted" style="margin-top:10px" id="cardNote"></div>
      </div>
    </div>
  </section>

  <section id="sec-sent" hidden>
    <div class="panel">
      <div class="panelHead"><span id="sentTitle">핵심 문장</span><span class="grow"></span><span class="muted" id="sentCount"></span></div>
      <div class="filterRow" id="sentChips" style="padding:12px 14px 0"></div>
      <div class="panelBody" id="sentBody"></div>
    </div>
  </section>

  <footer id="foot">개인 학습용 · 기록은 이 브라우저에만 저장됩니다</footer>
</div>
  </div>
</div>

    "found": { ko: "%s개 표시 중 (전체 %s개)", en: "showing %s of %s words" },
    "listNote": { ko: "단어를 클릭하면 검색창에 들어갑니다. 마지막 열에서 그 단어가 나온 수업과 강의를 볼 수 있습니다.",
                  en: "Click a word to search it. The last column shows the course and lecture it came from." },
    "cardTitle": { ko: "플래시카드", en: "Flashcards" },
    "cardHint": { ko: "카드를 클릭하면 뜻이 보입니다", en: "Click the card to reveal the meaning" },
    "cardHintEn": { ko: "카드를 클릭하면 뜻이 보입니다 (영어 설명 포함)", en: "Click the card to reveal the meaning" },
    "flip": { ko: "뒤집기 (Space)", en: "Flip (Space)" },
    "know": { ko: "알아요", en: "I know it" },
    "dunno": { ko: "몰라요", en: "Don't know" },
    "next": { ko: "다음 (→)", en: "Next (→)" },
    "shuffle": { ko: "섞기", en: "Shuffle" },
    "onlyUnknown": { ko: "모르는 단어만", en: "Only unknown" },
    "resetCards": { ko: "진행 초기화", en: "Reset progress" },
    "statKnown": { ko: "외운 단어", en: "Known" },
    "statUnknown": { ko: "모르는 단어", en: "Unknown" },
    "statProgress": { ko: "진행률", en: "Progress" },
    "cardCount": { ko: "%s / %s 번째", en: "card %s of %s" },
    "cardNote": { ko: "Space = 뒤집기, → = 다음, 1 = 알아요, 2 = 몰라요",
                  en: "Space = flip, Right arrow = next, 1 = know, 2 = don't know" },
    "cardNoteUnknown": { ko: "모르는 단어만 보는 중입니다. 모두 외우면 알림이 표시됩니다.",
                         en: "Showing only unknown words. You will be told when all are learned." },
    "sentTitle": { ko: "핵심 문장", en: "Key sentences" },
    "sentCount": { ko: "%s문장", en: "%s sentences" },
    "foot": { ko: "개인 학습용 · 기록은 이 브라우저에만 저장됩니다",
              en: "Personal study use · progress is stored only in this browser" },
    "allLectures": { ko: "전체", en: "All" },
    "confirmReset": { ko: "플래시카드 진행 상황을 지울까요?", en: "Reset your flashcard progress?" },
    "allLearned": { ko: "모르는 단어가 없습니다. 모두 외웠습니다!", en: "No unknown words left. All learned!" }
  };

  function t(key) {
    var e = STR[key];
    if (!e) return key;
    return e[LANG] || e.ko;
  }
  function tf(key) {
    var s = t(key), args = Array.prototype.slice.call(arguments, 1), i = 0;
    return s.replace(/%s/g, function () { var x = args[i++]; return x === undefined ? "" : String(x); });
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function el(id) { return document.getElementById(id); }
  function loadSet() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_VOCAB));
      if (raw && typeof raw === "object") return { known: raw.known || {} };
    } catch (e) { /* ignore */ }
    return { known: {} };
  }
  function saveSet() {
    try { localStorage.setItem(LS_VOCAB, JSON.stringify(store)); } catch (e) { /* ignore */ }
  }
  var store = loadSet();
  var state = { course: [], lec: [], sentLec: [], q: "", tab: "list", order: [], pos: 0, flipped: false, onlyUnknown: false };

  var LECS = ["L1", "L2", "L3", "L4", "L5", "L6", "L7", "NP", "AC"];
  var LEC_NAME = {
    L1: { ko: "L1 개요", en: "L1 Intro" },
    L2: { ko: "L2 선형회귀", en: "L2 Linear regression" },
    L3: { ko: "L3 로지스틱", en: "L3 Logistic" },
    L4: { ko: "L4 신경망", en: "L4 Neural nets" },
    L5: { ko: "L5 MLP 학습", en: "L5 MLP training" },
    L6: { ko: "L6 역전파", en: "L6 Backprop" },
    L7: { ko: "L7 CNN", en: "L7 CNN" },
    NP: { ko: "NP NumPy", en: "NP NumPy" },
    AC: { ko: "AC 아카데믹", en: "AC Academic" }
  };
  function lecName(code) {
    var e = LEC_NAME[code];
    return e ? (e[LANG] || e.ko) : code;
  }
  function tagClass(code) { return "tag" + (code === "NP" || code === "AC" ? " " + code : ""); }

  /* ---------- 수업(과목) — curriculum.js 의 과목 목록을 그대로 쓴다 ---------- */
  function courseList() {
    var out = [];
    var cur = window.CURRICULUM || [];
    cur.forEach(function (sem) {
      (sem.courses || []).forEach(function (c) {
        out.push({
          id: c.id,
          label: c.label,
          short: c.short || c.label,
          sem: sem.label,
          items: c.items || []
        });
      });
    });
    return out;
  }
  function courseById(id) {
    var list = courseList();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function courseShort(id) {
    var c = courseById(id);
    if (!c) return id || "";
    return (c.short && (c.short[LANG] || c.short.ko)) || (c.label && (c.label[LANG] || c.label.ko)) || id;
  }
  function courseFull(id) {
    var c = courseById(id);
    return c && c.label ? (c.label[LANG] || c.label.ko) : (id || "");
  }
  /* 그 단어의 출처 배지: 수업 + 강의 */
  function srcBadges(courseId, lec) {
    return '<span class="tag course" title="' + esc(t("courseTip")) + ': ' + esc(courseFull(courseId)) + '">' +
      esc(courseShort(courseId)) + "</span> " +
      '<span class="' + tagClass(lec) + '">' + esc(lec) + "</span>";
  }

  /* ---------- 필터 ---------- */
  function filteredTerms() {
    var q = state.q.trim().toLowerCase();
    return TERMS.filter(function (w) {
      if (state.course.length && state.course.indexOf(w.course) === -1) return false;
      if (state.lec.length && state.lec.indexOf(w.lecture) === -1) return false;
      if (!q) return true;
      return (w.term + " " + w.ko + " " + w.en).toLowerCase().indexOf(q) !== -1;
    });
  }
  function filteredSents() {
    return SENTS.filter(function (s) {
      if (state.course.length && state.course.indexOf(s.course) === -1) return false;
      return !state.sentLec.length || state.sentLec.indexOf(s.lecture) !== -1;
    });
  }
  function countBy(list, key) {
    var m = {};
    list.forEach(function (x) { m[x[key]] = (m[x[key]] || 0) + 1; });
    return m;
  }

  /* ---------- 공통 UI ---------- */
  function applyStatic() {
    el("crumb").textContent = t("crumb");
    el("navGloss").textContent = t("navGloss");
    el("navHome").textContent = t("navHome");
    el("tabList").textContent = t("tabList");
    el("tabCard").textContent = t("tabCard");
    el("tabSent").textContent = t("tabSent");
    el("listTitle").textContent = t("listTitle");
    el("thTerm").textContent = t("thTerm");
    el("thKo").textContent = t("thKo");
    el("thDef").textContent = t("thDef");
    el("thLec").textContent = t("thLec");
    el("courseLabel").textContent = t("filterCourse");
    el("lecLabel").textContent = t("filterLec");
    el("q").setAttribute("placeholder", t("search"));
    el("listNote").textContent = t("listNote");
    el("cardTitle").textContent = t("cardTitle");
    el("btnFlip").textContent = t("flip");
    el("btnKnow").textContent = t("know");
    el("btnDunno").textContent = t("dunno");
    el("btnNext").textContent = t("next");
    el("btnShuffle").textContent = t("shuffle");
    el("btnOnlyUnknown").textContent = t("onlyUnknown");
    el("btnResetCards").textContent = t("resetCards");
    el("statKnownLabel").textContent = t("statKnown");
    el("statUnknownLabel").textContent = t("statUnknown");
    el("statProgressLabel").textContent = t("statProgress");
    el("sentTitle").textContent = t("sentTitle");
    el("foot").textContent = t("foot");
    document.documentElement.lang = LANG;
    var btns = document.querySelectorAll("[data-lang]");
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute("data-lang") === LANG;
      btns[i].className = "langBtn" + (on ? " on" : "");
      btns[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  /* 수업(과목) 칩 — 지금은 DND 한 과목이지만 과목이 늘어도 그대로 동작한다 */
  function renderCourseChips() {
    var counts = countBy(TERMS, "course");
    var html = '<label class="fchip"><input type="checkbox" data-course=""' +
      (state.course.length ? "" : " checked") + "> " + t("allCourses") + "</label>";
    courseList().forEach(function (c) {
      if (!counts[c.id]) return;
      html += '<label class="fchip"><input type="checkbox" data-course="' + esc(c.id) + '"' +
        (state.course.indexOf(c.id) !== -1 ? " checked" : "") + ' title="' +
        esc(c.label ? (c.label[LANG] || c.label.ko) : c.id) + '"> ' +
        esc(courseShort(c.id)) + ' <span class="muted">' + counts[c.id] + "</span></label>";
    });
    var box = el("courseChips");
    box.innerHTML = html;
    box.querySelectorAll("input[data-course]").forEach(function (c) {
      c.onchange = function () {
        var code = c.getAttribute("data-course");
        if (!code) {
          state.course = [];
        } else {
          var i = state.course.indexOf(code);
          if (c.checked && i === -1) state.course.push(code);
          if (!c.checked && i !== -1) state.course.splice(i, 1);
        }
        renderCourseChips();
        renderList();
        if (state.tab === "card") rebuildOrder();
        if (state.tab === "sent") renderSents();
        renderSidebarFoot();
      };
    });
  }

  function renderChips(containerId, list, key, stateKey, after) {
    var counts = countBy(list, key);
    var html = '<label class="fchip"><input type="checkbox" data-lec=""' +
      (state[stateKey].length ? "" : " checked") + "> " + t("allLectures") + "</label>";
    LECS.forEach(function (code) {
      if (!counts[code]) return;
      html += '<label class="fchip"><input type="checkbox" data-lec="' + code + '"' +
        (state[stateKey].indexOf(code) !== -1 ? " checked" : "") + "> " + esc(lecName(code)) +
        ' <span class="muted">' + counts[code] + "</span></label>";
    });
    var box = el(containerId);
    box.innerHTML = html;
    box.querySelectorAll("input[data-lec]").forEach(function (c) {
      c.onchange = function () {
        var code = c.getAttribute("data-lec");
        if (!code) {
          state[stateKey] = [];
        } else {
          var i = state[stateKey].indexOf(code);
          if (c.checked && i === -1) state[stateKey].push(code);
          if (!c.checked && i !== -1) state[stateKey].splice(i, 1);
        }
        after();
        renderChips(containerId, list, key, stateKey, after);
      };
    });
  }

  /* ---------- 왼쪽 사이드바 (학기 → 과목 → 섹션) ----------
     앱(index.html)과 같은 구조를 쓴다. 여기서는 '용어집'이 현재 항목이고,
     다른 섹션은 index.html#화면id 로 이동한다. */
  function currentCourseId() {
    if (state.course.length === 1) return state.course[0];
    var list = courseList();
    return list.length ? list[0].id : "";
  }
  function labelOf(o) { return (o && (o[LANG] || o.ko)) || ""; }
  function closeSidebar() {
    var b = document.body;
    if (b) b.className = String(b.className || "").replace(/\s*sb-open/g, "");
  }
  function renderSidebarFoot() {
    var box = el("sbFoot");
    if (!box) return;
    var knownN = Object.keys(store.known || {}).length;
    var total = TERMS.length;
    var pct = total ? Math.round((knownN / total) * 100) + "%" : "0%";
    box.innerHTML = '<div class="sbFootTitle">' + t("statProgress") + '</div><div class="sbProgress">' +
      "<div>" + t("statKnown") + "<b>" + knownN + " / " + total + "</b></div>" +
      "<div>" + t("statProgress") + "<b>" + pct + "</b></div></div>";
  }
  function renderSidebar() {
    var nav = el("sbNav");
    if (!nav) return;
    var cur = currentCourseId();
    var html = "";
    (window.CURRICULUM || []).forEach(function (sem) {
      html += '<div class="sbSem">';
      html += '<button class="sbSemHead' + (sem.open ? " open" : "") + '" data-sem="' + sem.id + '" type="button">' +
        '<span class="chev"></span><span>' + esc(labelOf(sem.label)) + "</span>" +
        '<span class="sbSemSub">' + esc(labelOf(sem.sub)) + "</span></button>";
      if (sem.open) {
        (sem.courses || []).forEach(function (c) {
          html += '<div class="sbCourse"><div class="sbCourseHead">' + esc(labelOf(c.label)) + "</div>";
          if (c.sub) html += '<div class="sbCourseSub">' + esc(labelOf(c.sub)) + "</div>";
          html += '<div class="sbItems">';
          (c.items || []).forEach(function (it) {
            if (it.href) {
              var href = it.id === "glossary" ? it.href + "?course=" + c.id : it.href;
              html += '<a class="sbItem' + (it.id === "glossary" ? " on" : "") + '" href="' + href + '"' +
                (it.id === "glossary" ? ' aria-current="page"' : "") + ">" + esc(labelOf(it.label)) + "</a>";
            } else {
              html += '<a class="sbItem" href="index.html#' + it.id + '">' + esc(labelOf(it.label)) + "</a>";
            }
          });
          html += "</div></div>";
        });
      }
      html += "</div>";
    });
    nav.innerHTML = html;
    nav.querySelectorAll("[data-sem]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-sem");
        (window.CURRICULUM || []).forEach(function (s) { if (s.id === id) s.open = !s.open; });
        renderSidebar();
      };
    });
    var bs = el("brandSub");
    if (bs) {
      var c = courseById(cur);
      var semLabel = c && c.sem ? labelOf(c.sem) : "";
      bs.textContent = (semLabel ? semLabel + " · " : "") + (c ? labelOf(c.label) : "");
    }
    renderSidebarFoot();
  }

  /* ---------- 탭 1: 단어 목록 ---------- */
  function renderList() {
    var rows = filteredTerms();
    el("listCount").textContent = tf("found", rows.length, TERMS.length);
    var html = rows.map(function (w) {
      return "<tr><td class='term' data-w='" + esc(w.term) + "'>" + esc(w.term) + "</td>" +
        "<td class='ko'>" + esc(w.ko) + "</td>" +
        "<td class='def'>" + esc(w.en) + "</td>" +
        "<td>" + srcBadges(w.course, w.lecture) + "</td></tr>";
    }).join("");
    el("tbody").innerHTML = html || "<tr><td colspan='4' class='muted'>-</td></tr>";
    el("tbody").querySelectorAll("[data-w]").forEach(function (td) {
      td.style.cursor = "pointer";
      td.onclick = function () {
        state.q = td.getAttribute("data-w");
        el("q").value = state.q;
        renderList();
      };
    });
  }

  /* ---------- 탭 2: 플래시카드 ---------- */
  function poolTerms() {
    var pool = filteredTerms();
    if (state.onlyUnknown) pool = pool.filter(function (w) { return !store.known[w.term]; });
    return pool;
  }
  function rebuildOrder() {
    state.order = poolTerms();
    state.pos = 0;
    state.flipped = false;
    renderCard();
  }
  function renderCard() {
    var total = state.order.length;
    var knownN = Object.keys(store.known).length;
    var termN = TERMS.length;
    el("statKnown").textContent = knownN;
    el("statUnknown").textContent = Math.max(0, termN - knownN);
    el("statProgress").textContent = termN ? Math.round((knownN / termN) * 100) + "%" : "0%";
    el("cardNote").textContent = state.onlyUnknown ? t("cardNoteUnknown") : t("cardNote");
    if (!total) {
      el("cardWord").textContent = "-";
      el("cardMeta").innerHTML = "";
      el("cardBack").hidden = true;
      el("cardBackEn").hidden = true;
      el("cardHint").textContent = t("allLearned");
      el("cardCount").textContent = "";
      return;
    }
    if (state.pos >= total) state.pos = 0;
    var w = state.order[state.pos];
    el("cardCount").textContent = tf("cardCount", state.pos + 1, total);
    el("cardWord").textContent = w.term;
    el("cardMeta").innerHTML = srcBadges(w.course, w.lecture);
    el("cardHint").textContent = t("cardHint");
    var back = el("cardBack"), backEn = el("cardBackEn");
    if (state.flipped) {
      back.textContent = w.ko;
      backEn.textContent = w.en;
      back.hidden = false;
      backEn.hidden = false;
    } else {
      back.hidden = true;
      backEn.hidden = true;
    }
  }
  function nextCard(step) {
    if (!state.order.length) return;
    state.pos = (state.pos + (step || 1) + state.order.length) % state.order.length;
    state.flipped = false;
    renderCard();
  }
  function mark(known) {
    if (!state.order.length) return;
    var w = state.order[state.pos];
    if (known) store.known[w.term] = 1;
    else delete store.known[w.term];
    saveSet();
    if (state.onlyUnknown && known) rebuildOrder();
    else nextCard(1);
  }


  /* ---------- 탭 3: 핵심 문장 ---------- */
  function renderSents() {
    var list = filteredSents();
    el("sentCount").textContent = tf("sentCount", list.length);
    el("sentBody").innerHTML = list.map(function (s) {
      return '<div class="sent"><div class="en">' + esc(s.en) + "</div>" +
        '<div class="koSent">' + esc(s.ko) + "</div>" +
        '<div style="margin-top:6px">' + srcBadges(s.course, s.lecture) + "</div></div>";
    }).join("") || '<div class="muted">-</div>';
  }

  /* ---------- 탭 전환 ---------- */
  function showTab(tab) {
    state.tab = tab;
    el("sec-list").hidden = tab !== "list";
    el("sec-card").hidden = tab !== "card";
    el("sec-sent").hidden = tab !== "sent";
    document.querySelectorAll(".tab").forEach(function (b) {
      b.className = "tab" + (b.getAttribute("data-tab") === tab ? " on" : "");
    });
    if (tab === "card") rebuildOrder();
    if (tab === "sent") renderSents();
    if (tab === "list") renderList();
  }

  /* ---------- 언어 ---------- */
  function setLang(v) {
    if (v !== "ko" && v !== "en") return;
    LANG = v;
    try { localStorage.setItem(LS_LANG, v); } catch (e) { /* ignore */ }
    applyStatic();
    renderSidebar();
    renderCourseChips();
    renderChips("lecChips", TERMS, "lecture", "lec", function () { renderList(); if (state.tab === "card") rebuildOrder(); });
    renderChips("sentChips", SENTS, "lecture", "sentLec", renderSents);
    if (state.tab === "card") renderCard();
    if (state.tab === "sent") renderSents();
    if (state.tab === "list") renderList();
  }

  /* ---------- 주소의 ?course= 로 과목 미리 고르기 (사이드바 링크가 넘겨준다) ---------- */
  function preselectCourse() {
    var want = "";
    try {
      var m = /[?&]course=([A-Za-z0-9_\-]+)/.exec(String((window.location && window.location.search) || ""));
      if (m) want = m[1];
    } catch (e) { want = ""; }
    if (!want) return;
    if (courseById(want)) state.course = [want];
  }

  /* ---------- 부팅 (비밀번호 게이트가 있으면 복호화 후 호출) ---------- */
  function boot() {
    if (window.__GLOSSARY__) {
      DATA = window.__GLOSSARY__;
      TERMS = DATA.terms || [];
      SENTS = DATA.sentences || [];
    }
    preselectCourse();
    applyStatic();
    renderSidebar();
    renderCourseChips();
    renderChips("lecChips", TERMS, "lecture", "lec", function () { renderList(); if (state.tab === "card") rebuildOrder(); });
  renderChips("sentChips", SENTS, "lecture", "sentLec", renderSents);
  renderList();

  /* 사이드바 열기/닫기 (폰·태블릿에서는 드로어) */
  if (el("sbToggle")) {
    el("sbToggle").onclick = function () {
      var open = String(document.body.className || "").indexOf("sb-open") === -1;
      document.body.className = open
        ? (String(document.body.className || "") + " sb-open").replace(/^\s+/, "")
        : String(document.body.className || "").replace(/\s*sb-open/g, "");
    };
  }
  if (el("sbBackdrop")) el("sbBackdrop").onclick = function () { closeSidebar(); };
  if (el("brandLink")) el("brandLink").onclick = function (e) { if (e && e.preventDefault) e.preventDefault(); };

  document.querySelectorAll(".tab").forEach(function (b) {
    b.onclick = function () { showTab(b.getAttribute("data-tab")); };
  });
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.onclick = function () { setLang(b.getAttribute("data-lang")); };
  });
  el("q").oninput = function () { state.q = el("q").value; renderList(); if (state.tab === "card") rebuildOrder(); };
  el("card").onclick = function () { state.flipped = !state.flipped; renderCard(); };
  el("btnFlip").onclick = function () { state.flipped = !state.flipped; renderCard(); };
  el("btnNext").onclick = function () { nextCard(1); };
  el("btnKnow").onclick = function () { mark(true); };
  el("btnDunno").onclick = function () { mark(false); };
  el("btnShuffle").onclick = function () {
    var pool = poolTerms();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    state.order = pool;
    state.pos = 0;
    state.flipped = false;
    renderCard();
  };
  el("btnOnlyUnknown").onclick = function () {
    state.onlyUnknown = !state.onlyUnknown;
    el("btnOnlyUnknown").className = "btn" + (state.onlyUnknown ? " primary" : "");
    rebuildOrder();
  };
  el("btnResetCards").onclick = function () {
    if (!confirm(t("confirmReset"))) return;
    store = { known: {} };
    saveSet();
    rebuildOrder();
  };

  document.addEventListener("keydown", function (e) {
    if (state.tab !== "card") return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === " " || e.key === "Spacebar") { state.flipped = !state.flipped; renderCard(); e.preventDefault(); }
    else if (e.key === "ArrowRight") { nextCard(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { nextCard(-1); e.preventDefault(); }
    else if (e.key === "1") { mark(true); }
    else if (e.key === "2") { mark(false); }
  });

  }
  window.__bootGlossary = boot;
  if (!window.__GATED__) boot();      /* 비밀번호 게이트가 없으면 바로 시작 */

  /* 디버그/테스트용 훅 */
  window.__glossary = {
    get lang() { return LANG; },
    setLang: setLang,
    showTab: showTab,
    get store() { return store; },
    terms: TERMS,
    sentences: SENTS,
    filteredTerms: filteredTerms,
    filteredSents: filteredSents,
    mark: mark,
    nextCard: nextCard,
    rebuildOrder: rebuildOrder,
    renderList: renderList,
    renderCard: renderCard,
    renderSents: renderSents,
    renderSidebar: renderSidebar,
    renderCourseChips: renderCourseChips,
    courseList: courseList,
    courseShort: courseShort,
    state: state
  };
})();


</script>
</body>
</html>
