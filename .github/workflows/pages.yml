name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp -R web/site/. _site/
          rm -rf _site/.github _site/.gitignore _site/README.md
          mkdir -p _site/site
          cp -R web/site/. _site/site/
          cat << 'EOF' > _site/site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script>
              var dest = "../" + (location.search || "") + (location.hash || "");
              location.replace(dest);
            </script>
            <meta http-equiv="refresh" content="0; url=../">
          </head>
          <body>Redirecting to <a href="../">My Study Room</a>...</body>
          </html>
          EOF

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
